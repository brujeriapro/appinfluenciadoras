                  <tr><td colSpan="8" className="empty-state">Sin solicitudes aún</td></tr>
                ) : solicitudes.map(s => (
                  <tr key={s.id}>
                    <td style={{ fontWeight: 500 }}>
                      <div>{s.influencers?.nombre || '—'}</div>
                      <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>@{s.influencers?.instagram_handle || '—'}</div>
                    </td>
                    <td><TierBadge tier={s.influencers?.tier} /></td>
                    <td>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                        {(s.productos || []).map(p => (
                          <span key={p} style={{ background: 'var(--bg-hover)', border: '1px solid var(--border)', borderRadius: 6, padding: '2px 8px', fontSize: 11 }}>{p}</span>
                        ))}
                      </div>
                    </td>
                    <td className="td-muted" style={{ fontSize: 11, maxWidth: 160 }}>
                      {s.direccion_envio ? (
                        <div>
                          <div>{s.direccion_envio}</div>
                          <div>{s.ciudad}{s.departamento ? `, ${s.departamento}` : ''}</div>
                        </div>
                      ) : '—'}
                    </td>
                    <td className="td-muted" style={{ fontSize: 12 }}>{fmtDate(s.fecha_solicitud)}</td>
                    <td style={{ fontSize: 11 }}>{s.shopify_order_id ? <span style={{ color: 'var(--green)', fontWeight: 600 }}>#{s.shopify_order_id}</span> : '—'}</td>
                    <td>
                      <span style={{ color: STATUS_SOL_COLOR[s.status] || 'var(--text-muted)', fontWeight: 600, fontSize: 12 }}>
                        {s.status}
                      </span>
                    </td>
                    <td>
                      <select
                        value={s.status}
                        disabled={actualizando === s.id}
                        onChange={e => cambiarStatus(s.id, e.target.value)}
                        style={{ fontSize: 12, padding: '4px 8px', borderRadius: 6, border: '1px solid var(--border)', background: 'var(--bg)', color: 'var(--text)', cursor: 'pointer' }}
                      >
                        {STATUS_SOL.map(st => <option key={st}>{st}</option>)}
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ── APP ROOT ──────────────────────────────────────────────────
    function App() {
      const [view, setView] = useState('dashboard');
      const [detalleId, setDetalleId] = useState(null);

      const navigate = (v, id = null) => {
        setView(v);
        setDetalleId(id);
      };

      return (
        <div>
          <nav>
            <div className="nav-brand">🔮 Creadoras <span>Brujería Capilar</span></div>
            <button className={view === 'dashboard' ? 'active' : ''} onClick={() => navigate('dashboard')}>Dashboard</button>
            <button className={view === 'influencers' || view === 'detalle' ? 'active' : ''} onClick={() => navigate('influencers')}>Influencers</button>
            <button className={view === 'contenidos' ? 'active' : ''} onClick={() => navigate('contenidos')}>Contenidos</button>
            <button className={view === 'roi' ? 'active' : ''} onClick={() => navigate('roi')}>ROI</button>
            <button className={view === 'notificaciones' ? 'active' : ''} onClick={() => navigate('notificaciones')}>Notificaciones</button>
            <button className={view === 'solicitudes' ? 'active' : ''} onClick={() => navigate('solicitudes')}>Solicitudes</button>
            <button className={view === 'candidatas' ? 'active' : ''} onClick={() => navigate('candidatas')}>Candidatas TikTok</button>
          </nav>
          <main>
            {view === 'dashboard' && <Dashboard onNavigate={navigate} />}
            {view === 'influencers' && <Influencers onNavigate={navigate} />}
            {view === 'detalle' && detalleId && <DetalleInfluencer id={detalleId} onBack={() => navigate('influencers')} />}
            {view === 'contenidos' && <Contenidos />}
            {view === 'roi' && <ROI />}
            {view === 'notificaciones' && <Notificaciones />}
            {view === 'solicitudes' && <Solicitudes />}
            {view === 'candidatas' && <Candidatas />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
