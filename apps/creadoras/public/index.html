    // ── CANDIDATAS TIKTOK ─────────────────────────────────────────
    const STATUS_CANDIDATA = ['candidata', 'revisada', 'contactada', 'descartada', 'registrada'];
    const COL_SCORE_COLOR = (s) => s >= 50 ? '#16a34a' : s >= 20 ? '#d97706' : '#dc2626';
    const COL_SCORE_LABEL = (s) => s >= 50 ? '🇨🇴 Alta' : s >= 20 ? '🌎 Media' : '❓ Baja';

    function Candidatas() {
      const [candidatas, setCandidatas] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [filtroStatus, setFiltroStatus] = useState('candidata');
      const [filtroColombia, setFiltroColombia] = useState('');
      const [filtroTier, setFiltroTier] = useState('');
      const [actualizando, setActualizando] = useState(null);

      function cargar() {
        setLoading(true);
        const params = new URLSearchParams();
        if (filtroStatus) params.set('status', filtroStatus);
        if (filtroColombia) params.set('min_colombia_score', filtroColombia);
        if (filtroTier) params.set('tier', filtroTier);
        API(`/api/candidatas?${params}`)
          .then(setCandidatas)
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      }

      useEffect(() => { cargar(); }, [filtroStatus, filtroColombia, filtroTier]);

      async function cambiarStatus(id, status) {
        setActualizando(id);
        try {
          await POSTJSON(`/api/candidatas/${id}`, { status }, 'PATCH');
          setCandidatas(prev => prev.map(c => c.id === id ? { ...c, status } : c));
        } catch (e) { alert('Error: ' + e.message); }
        finally { setActualizando(null); }
      }

      async function aprobar(id, handle) {
        if (!confirm(`¿Aprobar a @${handle} como influencer Prospectada?`)) return;
        setActualizando(id);
        try {
          await POSTJSON(`/api/candidatas/${id}/aprobar`, {});
          setCandidatas(prev => prev.map(c => c.id === id ? { ...c, status: 'registrada' } : c));
          alert(`✅ @${handle} agregada como influencer. La puedes ver en la sección Influencers.`);
        } catch (e) { alert('Error: ' + e.message); }
        finally { setActualizando(null); }
      }

      const pendientes = candidatas.filter(c => c.status === 'candidata').length;

      return (
        <div>
          <h1>Candidatas TikTok</h1>
          <p className="page-subtitle">
            {candidatas.length} perfiles
            {pendientes > 0 && <span style={{ marginLeft: 12, color: 'var(--yellow)', fontSize: 12 }}>⚠ {pendientes} sin revisar</span>}
          </p>

          {/* Filtros */}
          <div className="filter-bar" style={{ marginBottom: 20 }}>
            <select value={filtroStatus} onChange={e => setFiltroStatus(e.target.value)}>
              <option value="">Todos los estados</option>
              {STATUS_CANDIDATA.map(s => <option key={s}>{s}</option>)}
            </select>
            <select value={filtroColombia} onChange={e => setFiltroColombia(e.target.value)}>
              <option value="">Todos los scores Colombia</option>
              <option value="50">🇨🇴 Alta confianza (50+)</option>
              <option value="20">🌎 Media o alta (20+)</option>
            </select>
            <select value={filtroTier} onChange={e => setFiltroTier(e.target.value)}>
              <option value="">Todos los tiers</option>
              <option>Nano</option>
              <option>Micro</option>
              <option>Macro</option>
            </select>
            {(filtroStatus || filtroColombia || filtroTier) && (
              <button className="btn btn-secondary btn-sm" onClick={() => { setFiltroStatus('candidata'); setFiltroColombia(''); setFiltroTier(''); }}>Limpiar</button>
            )}
          </div>

          {loading && <div className="loading">Cargando candidatas...</div>}
          {error && <div className="error-msg">{error}</div>}

          {!loading && !error && (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Handle TikTok</th>
                    <th>Seguidores</th>
                    <th>Vistas prom.</th>
                    <th>Colombia</th>
                    <th>Tier</th>
                    <th>Nichos</th>
                    <th>Hashtags origen</th>
                    <th>Estado</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
                  {candidatas.length === 0 ? (
                    <tr><td colSpan="9" className="empty-state">Sin candidatas — corre el scraper primero</td></tr>
                  ) : candidatas.map(c => (
                    <tr key={c.id}>
                      <td>
                        <a href={`https://tiktok.com/@${c.tiktok_handle}`} target="_blank" rel="noreferrer"
                          style={{ color: 'var(--purple-light)', fontWeight: 600, fontSize: 13 }}>
                          @{c.tiktok_handle}
                        </a>
                        {c.nombre_display && c.nombre_display !== c.tiktok_handle && (
                          <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>{c.nombre_display}</div>
                        )}
                      </td>
                      <td style={{ fontWeight: 600 }}>{fmt(c.seguidores)}</td>
                      <td>{fmt(c.vistas_promedio)}</td>
                      <td>
                        <span style={{ color: COL_SCORE_COLOR(c.colombia_score || 0), fontWeight: 600, fontSize: 12 }}>
                          {COL_SCORE_LABEL(c.colombia_score || 0)}
                        </span>
                        <div style={{ fontSize: 10, color: 'var(--text-muted)' }}>{c.colombia_score || 0}/100</div>
                      </td>
                      <td><TierBadge tier={c.tier_estimado} /></td>
                      <td style={{ fontSize: 11, maxWidth: 140 }}>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 3 }}>
                          {(c.nichos || []).slice(0, 3).map(n => (
                            <span key={n} style={{ background: 'var(--bg-hover)', border: '1px solid var(--border)', borderRadius: 4, padding: '1px 5px', fontSize: 10 }}>{n}</span>
                          ))}
                        </div>
                      </td>
                      <td className="td-muted" style={{ fontSize: 11 }}>
                        {(c.hashtags_origen || []).map(h => `#${h}`).join(', ')}
                      </td>
                      <td>
                        <select
                          value={c.status}
                          disabled={actualizando === c.id}
                          onChange={e => cambiarStatus(c.id, e.target.value)}
                          style={{ fontSize: 11, padding: '3px 6px', borderRadius: 6, border: '1px solid var(--border)', background: 'var(--bg)', color: 'var(--text)', cursor: 'pointer' }}
                        >
                          {STATUS_CANDIDATA.map(s => <option key={s}>{s}</option>)}
                        </select>
                      </td>
                      <td>
                        {c.status !== 'registrada' && c.status !== 'descartada' && (
                          <button
                            onClick={() => aprobar(c.id, c.tiktok_handle)}
                            disabled={actualizando === c.id}
                            className="btn btn-sm"
                            style={{ background: 'var(--green)', color: 'white', border: 'none', padding: '4px 10px', borderRadius: 6, fontSize: 11, cursor: 'pointer' }}
                          >
                            Aprobar →
                          </button>
                        )}
                        {c.status === 'registrada' && <span style={{ color: 'var(--green)', fontSize: 11 }}>✓ En sistema</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ── SOLICITUDES ───────────────────────────────────────────────
    const STATUS_SOL = ['Pendiente', 'Aprobada', 'Enviada', 'Rechazada'];
    const STATUS_SOL_COLOR = { Pendiente: 'var(--yellow)', Aprobada: 'var(--green)', Enviada: 'var(--purple-light)', Rechazada: 'var(--red)' };

    function Solicitudes() {
      const [solicitudes, setSolicitudes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [actualizando, setActualizando] = useState(null);

      useEffect(() => {
        API('/api/solicitudes-reenvio')
          .then(setSolicitudes)
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      }, []);

      async function cambiarStatus(id, status) {
        setActualizando(id);
        try {
          await POSTJSON(`/api/solicitudes-reenvio/${id}`, { status }, 'PATCH');
          setSolicitudes(prev => prev.map(s => s.id === id ? { ...s, status } : s));
        } catch (e) {
          alert('Error: ' + e.message);
        } finally {
          setActualizando(null);
        }
      }

      if (loading) return <div className="loading">Cargando solicitudes...</div>;
      if (error) return <div className="error-msg">{error}</div>;

      const pendientes = solicitudes.filter(s => s.status === 'Pendiente').length;

      return (
        <div>
          <h1>Solicitudes de Producto</h1>
          <p className="page-subtitle">
            {solicitudes.length} solicitudes
            {pendientes > 0 && <span style={{ marginLeft: 12, color: 'var(--yellow)', fontSize: 12 }}>⚠ {pendientes} pendientes</span>}
          </p>

          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Influencer</th>
                  <th>Tier</th>
                  <th>Productos solicitados</th>
                  <th>Dirección confirmada</th>
                  <th>Fecha</th>
                  <th>Shopify</th>
                  <th>Estado</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody>
                {solicitudes.length === 0 ? (
                  <tr><td colSpan="8" className="empty-state">Sin solicitudes aún</td></tr>
                ) : solicitudes.map(s => (
                  <tr key={s.id}>
                    <td style={{ fontWeight: 500 }}>
                      <div>{s.influencers?.nombre || '—'}</div>
                      <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>@{s.influencers?.instagram_handle || '—'}</div>
                    </td>
                    <td><TierBadge tier={s.influencers?.tier} /></td>
                    <td>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                        {(s.productos || []).map(p => (
                          <span key={p} style={{ background: 'var(--bg-hover)', border: '1px solid var(--border)', borderRadius: 6, padding: '2px 8px', fontSize: 11 }}>{p}</span>
                        ))}
                      </div>
                    </td>
                    <td className="td-muted" style={{ fontSize: 11, maxWidth: 160 }}>
                      {s.direccion_envio ? (
                        <div>
                          <div>{s.direccion_envio}</div>
                          <div>{s.ciudad}{s.departamento ? `, ${s.departamento}` : ''}</div>
                        </div>
                      ) : '—'}
                    </td>
                    <td className="td-muted" style={{ fontSize: 12 }}>{fmtDate(s.fecha_solicitud)}</td>
                    <td style={{ fontSize: 11 }}>{s.shopify_order_id ? <span style={{ color: 'var(--green)', fontWeight: 600 }}>#{s.shopify_order_id}</span> : '—'}</td>
                    <td>
                      <span style={{ color: STATUS_SOL_COLOR[s.status] || 'var(--text-muted)', fontWeight: 600, fontSize: 12 }}>
                        {s.status}
                      </span>
                    </td>
                    <td>
                      <select
                        value={s.status}
                        disabled={actualizando === s.id}
                        onChange={e => cambiarStatus(s.id, e.target.value)}
                        style={{ fontSize: 12, padding: '4px 8px', borderRadius: 6, border: '1px solid var(--border)', background: 'var(--bg)', color: 'var(--text)', cursor: 'pointer' }}
                      >
                        {STATUS_SOL.map(st => <option key={st}>{st}</option>)}
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ── APP ROOT ──────────────────────────────────────────────────
    function App() {
      const [view, setView] = useState('dashboard');
      const [detalleId, setDetalleId] = useState(null);

      const navigate = (v, id = null) => {
        setView(v);
        setDetalleId(id);
      };

      return (
        <div>
          <nav>
            <div className="nav-brand">🔮 Creadoras <span>Brujería Capilar</span></div>
            <button className={view === 'dashboard' ? 'active' : ''} onClick={() => navigate('dashboard')}>Dashboard</button>
            <button className={view === 'influencers' || view === 'detalle' ? 'active' : ''} onClick={() => navigate('influencers')}>Influencers</button>
            <button className={view === 'contenidos' ? 'active' : ''} onClick={() => navigate('contenidos')}>Contenidos</button>
            <button className={view === 'roi' ? 'active' : ''} onClick={() => navigate('roi')}>ROI</button>
            <button className={view === 'notificaciones' ? 'active' : ''} onClick={() => navigate('notificaciones')}>Notificaciones</button>
            <button className={view === 'solicitudes' ? 'active' : ''} onClick={() => navigate('solicitudes')}>Solicitudes</button>
            <button className={view === 'candidatas' ? 'active' : ''} onClick={() => navigate('candidatas')}>Candidatas TikTok</button>
            <button className={view === 'ugc' ? 'active' : ''} onClick={() => navigate('ugc')} style={{color:'var(--gold)'}}>💰 UGC</button>
          </nav>
          <main>
            {view === 'dashboard' && <Dashboard onNavigate={navigate} />}
            {view === 'influencers' && <Influencers onNavigate={navigate} />}
            {view === 'detalle' && detalleId && <DetalleInfluencer id={detalleId} onBack={() => navigate('influencers')} />}
            {view === 'contenidos' && <Contenidos />}
            {view === 'roi' && <ROI />}
            {view === 'notificaciones' && <Notificaciones />}
            {view === 'solicitudes' && <Solicitudes />}

    // ── COMPONENTE UGC ────────────────────────────────────────────────────────
    function UGC() {
      const [tab, setTab]               = useState('creadoras');
      const [creadoras, setCreadoras]   = useState([]);
      const [regalos, setRegalos]       = useState([]);
      const [loading, setLoading]       = useState(true);
      const [syncing, setSyncing]       = useState(false);
      const [modalEnroll, setModalEnroll] = useState(false);
      const [modalPago, setModalPago]   = useState(null);
      const [modalRegalo, setModalRegalo] = useState(null);
      const [allInf, setAllInf]         = useState([]);
      const [searchEnroll, setSearchEnroll] = useState('');
      const [pagoForm, setPagoForm]     = useState({ metodo_pago: 'Nequi', notas: '' });
      const [leads, setLeads]           = useState([]);
      const [enviando, setEnviando]     = useState(false);
      const [resultadoEnvio, setResultadoEnvio] = useState(null);
      const [acuerdos, setAcuerdos]     = useState({});
      const [pidiendo, setPidiendo]     = useState(false);
      const [productos, setProductos]   = useState([]);
      const [enviandoRegalo, setEnviandoRegalo] = useState(false);
      const [soloListas, setSoloListas] = useState(false);
      const [modalMarcar, setModalMarcar] = useState(false);
      const [textoMarcar, setTextoMarcar] = useState('');
      const [marcando, setMarcando] = useState(false);

      useEffect(() => { loadAll(); }, []);

      async function marcarEnviados() {
        const nums = textoMarcar.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
        if (!nums.length) { alert('Pega al menos un número.'); return; }
        setMarcando(true);
        try {
          const r = await fetch('/api/admin/marcar-enviados', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ telefonos: nums }),
          }).then(r => r.json());
          if (r.error) throw new Error(r.error);
          let m = `✅ Marcadas como ya enviadas: ${r.marcados} de ${nums.length}`;
          if (r.no_encontrados && r.no_encontrados.length) m += `\n\nNo encontradas en la base (${r.no_encontrados.length}):\n${r.no_encontrados.join('\n')}`;
          alert(m);
          setModalMarcar(false); setTextoMarcar('');
        } catch(e) { alert('Error: ' + e.message); }
        setMarcando(false);
      }

      async function cargarProductos() {
        if (productos.length) return productos;
        try {
          const r = await fetch('/api/config/productos').then(r => r.json());
          const p = Array.isArray(r.productos) ? r.productos : [];
          setProductos(p);
          return p;
        } catch(e) { return []; }
      }

      function abrirRegalo(r) {
        const inf = r.influencers || {};
        setModalRegalo({
          id: r.id, numero_regalo: r.numero_regalo, influencer_id: r.influencer_id,
          nombre: inf.nombre || '', skus: [],
          direccion_envio: inf.direccion_envio || '', direccion_detalle: inf.direccion_detalle || '', ciudad: inf.ciudad || '',
          departamento: inf.departamento || '', telefono: inf.telefono || '', codigo_postal: inf.codigo_postal || '',
        });
        cargarProductos();
      }

      function toggleSku(sku) {
        setModalRegalo(m => ({ ...m, skus: m.skus.includes(sku) ? m.skus.filter(x => x !== sku) : [...m.skus, sku] }));
      }

      async function confirmarEnvioRegalo() {
        const m = modalRegalo;
        if (!m.skus.length) { alert('Elige al menos un producto para enviar.'); return; }
        if (!m.direccion_envio || !m.direccion_envio.trim()) { alert('La creadora no tiene dirección. Pídele que firme/confirme sus datos primero.'); return; }
        if (!m.departamento || !String(m.departamento).trim()) { alert('Falta el departamento (ej: Antioquia). Complétalo en el modal antes de despachar — Shopify lo exige para el envío.'); return; }
        const producto_nombre = productos.filter(p => m.skus.includes(p.sku)).map(p => p.nombre).join(', ');
        const body = { skus: m.skus, producto_nombre };
        ['direccion_envio','direccion_detalle','ciudad','departamento','telefono','codigo_postal'].forEach(k => { if (m[k] && String(m[k]).trim()) body[k] = String(m[k]).trim(); });
        setEnviandoRegalo(true);
        try {
          const r = await fetch(`/api/ugc/regalos/${m.id}/enviar`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }).then(r => r.json());
          if (r.error) throw new Error(r.error);
          setModalRegalo(null);
          await loadAll();
          alert('🎁 ¡Regalo despachado! Orden creada en Shopify.');
        } catch(e) { alert('Error: ' + e.message); }
        setEnviandoRegalo(false);
      }

      async function pedirFirma(ids, label, target) {
        const msg = ids && ids.length === 1
          ? `¿Enviar por WhatsApp el link del acuerdo a ${label}?`
          : target === 'todas'
            ? `¿Enviar el link del acuerdo por WhatsApp a TODAS las creadoras que aún no han firmado?`
            : `¿Enviar el link del acuerdo por WhatsApp a las creadoras con regalo pendiente?`;
        if (!confirm(msg)) return;
        setPidiendo(true);
        try {
          const payload = ids && ids.length ? { ids } : (target ? { target } : {});
          const resp = await fetch('/api/admin/pedir-acuerdo', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const txt = await resp.text();
          let r; try { r = JSON.parse(txt); } catch(_) { r = { error: txt || 'Error de red' }; }
          if (r.background) {
            alert(`📤 Enviando el acuerdo a ${r.queued} creadoras en segundo plano (las que ya lo recibieron se omiten automáticamente).\nPuede tardar un par de minutos. Refresca más tarde para ver quién ya firmó.`);
          } else if (r.error) {
            alert('Error: ' + r.error);
          } else {
            const errs = [...new Set((r.resultados || []).filter(x => !x.ok && !x.skipped).map(x => x.error).filter(Boolean))];
            let m = `Enviados: ${r.ok}/${r.total}`;
            if (r.skipped) m += `\n(${r.skipped} ya tenían el link, no se reenviaron)`;
            if (errs.length) m += `\n\nErrores:\n${errs.join('\n')}`;
            alert(m);
          }
        } catch(e) { alert('Error: ' + e.message); }
        setPidiendo(false);
      }

      function parsearCSVLeads(text) {
        const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
        if (lines.length < 2) return [];
        const headers = lines[0].split('\t').map(h => h.trim());
        const nameIdx  = headers.indexOf('full_name');
        const phoneIdx = headers.indexOf('phone_number');
        const cityIdx  = headers.indexOf('city');
        return lines.slice(1).map(line => {
          const cols = line.split('\t');
          const telefono = (cols[phoneIdx] || '').replace(/^p:/, '').trim();
          return { nombre: (cols[nameIdx] || '').trim(), telefono, ciudad: (cols[cityIdx] || '').trim() };
        }).filter(l => l.telefono && l.telefono.length > 6);
      }

      function handleCSV(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const parsed = parsearCSVLeads(ev.target.result);
          setLeads(parsed);
          setResultadoEnvio(null);
        };
        reader.readAsText(file, 'UTF-16');
      }

      async function handleEnvioMasivo() {
        if (!leads.length) return;
        if (!confirm(`¿Enviar el mensaje de bienvenida UGC a ${leads.length} contactos por WhatsApp?`)) return;
        setEnviando(true);
        setResultadoEnvio(null);
        try {
          const r = await fetch('/api/ugc/envio-masivo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ leads }),
          }).then(r => r.json());
          setResultadoEnvio(r);
        } catch(e) { alert('Error: ' + e.message); }
        setEnviando(false);
      }

      async function loadAll() {
        setLoading(true);
        try {
          const [c, r, a] = await Promise.all([
            fetch('/api/ugc/creadoras').then(r => r.json()),
            fetch('/api/ugc/regalos-pendientes').then(r => r.json()),
            fetch('/api/ugc/acuerdos').then(r => r.json()).catch(() => []),
          ]);
          setCreadoras(Array.isArray(c) ? c : []);
          setRegalos(Array.isArray(r) ? r : []);
          const map = {};
          (Array.isArray(a) ? a : []).forEach(x => { map[x.influencer_id] = x; });
          setAcuerdos(map);
        } catch(e) { console.error(e); }
        setLoading(false);
      }

      async function handleSync() {
        setSyncing(true);
        try {
          const r = await fetch('/api/ugc/sync', { method: 'POST' }).then(r => r.json());
          if (r.error) throw new Error(r.error);
          alert(`✅ Sync completo — ${r.nuevas_ventas} ventas nuevas registradas`);
          await loadAll();
        } catch(e) { alert('Error: ' + e.message); }
        setSyncing(false);
      }

      async function cargarInfluencers() {
        if (allInf.length > 0) return;
        const data = await fetch('/api/influencers').then(r => r.json());
        setAllInf(Array.isArray(data) ? data.filter(i => !i.ugc_activa) : []);
      }

      async function handleEnroll(inf) {
        if (!confirm(`¿Enrollar a ${inf.nombre} en el programa UGC?`)) return;
        try {
          const r = await fetch(`/api/ugc/enroll/${inf.id}`, { method: 'POST' }).then(r => r.json());
          if (r.error) throw new Error(r.error);
          alert(`✅ ¡Listo! Código: ${r.codigo}`);
          setModalEnroll(false);
          await loadAll();
        } catch(e) { alert('Error: ' + e.message); }
      }

      async function handleRegalo(id) {
        const notas = prompt('Notas del envío (opcional):') || '';
        try {
          await fetch(`/api/ugc/regalos/${id}/enviar`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ notas }) });
          await loadAll();
          setModalRegalo(null);
        } catch(e) { alert('Error: ' + e.message); }
      }

      async function handlePago() {
        const c = modalPago;
        try {
          await fetch('/api/ugc/pagos', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
              influencer_id: c.id,
              mes: new Date().toISOString().substring(0,7),
              total_ventas: c.ventas_mes,
              total_comision: c.comision_mes_pendiente,
              metodo_pago: pagoForm.metodo_pago,
              notas: pagoForm.notas,
            }),
          });
          alert('✅ Pago registrado');
          setModalPago(null);
          await loadAll();
        } catch(e) { alert('Error: ' + e.message); }
      }

      const fmtCOP = n => '$' + (n||0).toLocaleString('es-CO');
      const mesActual = new Date().toLocaleString('es-CO', { month: 'long', year: 'numeric' });

      const totalVentasMes    = creadoras.reduce((s,c) => s + (c.ventas_mes||0), 0);
      const totalComisionMes  = creadoras.reduce((s,c) => s + (c.comision_mes_pendiente||0), 0);
      const totalRegalos      = regalos.length;

      const infFiltradas = allInf.filter(i =>
        !searchEnroll || i.nombre.toLowerCase().includes(searchEnroll.toLowerCase()) ||
        (i.instagram_handle||'').toLowerCase().includes(searchEnroll.toLowerCase())
      );

      const NIVEL_COLOR = { 'Bruja Iniciada': 'var(--text-muted)', 'Bruja Activa': 'var(--purple-light)', 'Gran Bruja': 'var(--gold)' };

      // Datos mínimos para poder despachar + acuerdo firmado = lista para regalo
      const datosCompletos = c => !!(c.direccion_envio && String(c.direccion_envio).trim() && c.telefono && String(c.telefono).trim());
      const estaLista = c => !!acuerdos[c.id] && datosCompletos(c);
      const creadorasMostradas = soloListas ? creadoras.filter(estaLista) : creadoras;
      function enviarRegaloDeCreadora(c) {
        const rg = regalos.find(r => r.influencer_id === c.id);
        if (!rg) { alert('Esta creadora no tiene un regalo pendiente por enviar (ya se le enviaron todos).'); return; }
        abrirRegalo(rg);
      }

      return (
        <div>
          <div style={{marginBottom:24}}>
            <h1>💰 Programa UGC</h1>
            <p className="page-subtitle">Comisiones por ventas · {mesActual}</p>
          </div>

          {/* Stats */}
          <div className="stat-grid" style={{marginBottom:24}}>
            <div className="stat-card">
              <div className="label">Creadoras UGC</div>
              <div className="value purple">{creadoras.length}</div>
            </div>
            <div className="stat-card">
              <div className="label">Ventas del mes</div>
              <div className="value green">{fmtCOP(totalVentasMes)}</div>
            </div>
            <div className="stat-card">
              <div className="label">Comisiones pendientes</div>
              <div className="value" style={{color:'var(--gold)'}}>{fmtCOP(totalComisionMes)}</div>
            </div>
            <div className="stat-card">
              <div className="label">Regalos por enviar</div>
              <div className="value" style={{color:'var(--orange)'}}>{totalRegalos}</div>
            </div>
          </div>

          {/* Tabs + acciones */}
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,flexWrap:'wrap'}}>
            <div style={{display:'flex',gap:4,background:'var(--bg2)',borderRadius:8,padding:4}}>
              <button onClick={()=>setTab('creadoras')} className={tab==='creadoras'?'active':''}>Creadoras</button>
              <button onClick={()=>setTab('regalos')} className={tab==='regalos'?'active':''} style={totalRegalos>0?{color:'var(--orange)'}:{}}>
                Regalos {totalRegalos>0 && <span className="badge" style={{background:'var(--orange)',color:'#fff',marginLeft:4}}>{totalRegalos}</span>}
              </button>
              <button onClick={()=>setTab('leads')} className={tab==='leads'?'active':''} style={{color:'var(--gold)'}}>📤 Leads</button>
            </div>
            <div style={{marginLeft:'auto',display:'flex',gap:8}}>
              <button className="btn btn-secondary btn-sm" onClick={()=>{ setModalEnroll(true); cargarInfluencers(); }}>+ Enrollar creadora</button>
              <button className="btn btn-sm" style={{background:'var(--purple)'}} onClick={handleSync} disabled={syncing}>
                {syncing ? 'Sincronizando...' : '🔄 Sync Shopify'}
              </button>
            </div>
          </div>

          {loading ? <div style={{color:'var(--text-muted)',textAlign:'center',padding:40}}>Cargando...</div> : tab === 'creadoras' ? (
            /* Tabla creadoras */
            <div style={{overflowX:'auto'}}>
              {creadoras.length > 0 && (
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                  <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer'}}>
                    <input type="checkbox" checked={soloListas} onChange={e=>setSoloListas(e.target.checked)} style={{width:16,height:16}} />
                    🎁 Solo listas para regalo (datos + firma)
                  </label>
                  <span style={{fontSize:12,color:'var(--text-muted)'}}>{creadorasMostradas.length} de {creadoras.length}</span>
                </div>
              )}
              {creadoras.length === 0 ? (
                <div style={{textAlign:'center',padding:60,color:'var(--text-muted)'}}>
                  <div style={{fontSize:48,marginBottom:12}}>💰</div>
                  <div>Aún no hay creadoras en el programa UGC</div>
                  <button className="btn btn-sm" style={{marginTop:16,background:'var(--purple)'}} onClick={()=>{ setModalEnroll(true); cargarInfluencers(); }}>Enrollar primera creadora</button>
                </div>
              ) : (
                <table style={{width:'100%',borderCollapse:'collapse'}}>
                  <thead>
                    <tr style={{borderBottom:'1px solid var(--border)',color:'var(--text-muted)',fontSize:11,textTransform:'uppercase',letterSpacing:'0.5px'}}>
                      <th style={{padding:'10px 12px',textAlign:'left'}}>Creadora</th>
                      <th style={{padding:'10px 12px',textAlign:'left'}}>Código</th>
                      <th style={{padding:'10px 12px',textAlign:'right'}}>Ventas mes</th>
                      <th style={{padding:'10px 12px',textAlign:'left'}}>Nivel</th>
                      <th style={{padding:'10px 12px',textAlign:'right'}}>Comisión mes</th>
                      <th style={{padding:'10px 12px',textAlign:'right'}}>Ventas totales</th>
                      <th style={{padding:'10px 12px',textAlign:'center'}}>Datos</th>
                      <th style={{padding:'10px 12px',textAlign:'center'}}>Acuerdo</th>
                      <th style={{padding:'10px 12px',textAlign:'center'}}>Regalos</th>
                      <th style={{padding:'10px 12px',textAlign:'center'}}>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    {creadorasMostradas.map(c => (
                      <tr key={c.id} style={{borderBottom:'1px solid var(--border)'}}>
                        <td style={{padding:'12px'}}>
                          <div style={{fontWeight:600}}>{c.nombre}</div>
                          <div style={{fontSize:11,color:'var(--text-muted)'}}>@{c.instagram_handle||c.tiktok_handle||'-'}</div>
                        </td>
                        <td style={{padding:'12px'}}>
                          <span className="mono" style={{background:'var(--bg3)',padding:'3px 8px',borderRadius:4,fontSize:12,color:'var(--purple-light)'}}>{c.codigo_ugc||'—'}</span>
                        </td>
                        <td style={{padding:'12px',textAlign:'right',fontWeight:600,color:'var(--green)'}}>{fmtCOP(c.ventas_mes)}</td>
                        <td style={{padding:'12px'}}>
                          <span style={{color: NIVEL_COLOR[c.nivel_ugc]||'var(--text)', fontWeight:500, fontSize:12}}>{c.nivel_ugc}</span>
                          <span style={{color:'var(--text-muted)',fontSize:11,display:'block'}}>{c.comision_pct}% comisión</span>
                        </td>
                        <td style={{padding:'12px',textAlign:'right',color:'var(--gold)',fontWeight:600}}>{fmtCOP(c.comision_mes_pendiente)}</td>
                        <td style={{padding:'12px',textAlign:'right',color:'var(--text-muted)'}}>{fmtCOP(c.ventas_totales)}</td>
                        <td style={{padding:'12px',textAlign:'center',fontSize:14}}>
                          {datosCompletos(c)
                            ? <span style={{color:'var(--green)'}} title="Dirección y teléfono OK">✅</span>
                            : <span style={{color:'var(--orange)'}} title="Faltan dirección o teléfono">⚠️</span>}
                        </td>
                        <td style={{padding:'12px',textAlign:'center'}}>
                          {acuerdos[c.id]
                            ? <a href={`/acuerdo/ver/${c.id}`} target="_blank" rel="noreferrer" style={{color:'var(--green)',fontSize:12,fontWeight:600,textDecoration:'none'}}>✅ Ver</a>
                            : <span style={{color:'var(--text-muted)',fontSize:12}}>⏳ pend.</span>}
                        </td>
                        <td style={{padding:'12px',textAlign:'center'}}>
                          <span title={`${c.regalos_enviados} enviados / ${c.regalos_ganados} ganados`}>
                            {'🎁'.repeat(Math.min(c.regalos_pendientes,5))}
                            {c.regalos_pendientes===0 && <span style={{color:'var(--text-muted)',fontSize:11}}>al día</span>}
                            {c.regalos_pendientes>5 && <span style={{color:'var(--orange)',fontSize:11}}> +{c.regalos_pendientes-5}</span>}
                          </span>
                        </td>
                        <td style={{padding:'12px',textAlign:'center'}}>
                          <div style={{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap'}}>
                            {estaLista(c) && regalos.some(r => r.influencer_id === c.id) && (
                              <button className="btn btn-sm" style={{background:'var(--green)',color:'#000',fontSize:11,padding:'4px 10px',fontWeight:600}}
                                onClick={() => enviarRegaloDeCreadora(c)}>
                                🎁 Regalo
                              </button>
                            )}
                            {c.comision_mes_pendiente > 0 && (
                              <button className="btn btn-sm" style={{background:'var(--gold)',color:'#000',fontSize:11,padding:'4px 10px'}}
                                onClick={() => { setModalPago(c); setPagoForm({ metodo_pago:'Nequi', notas:'' }); }}>
                                Pagar
                              </button>
                            )}
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          ) : (
            /* Tabla regalos pendientes */
            <div>
              <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginBottom:12}}>
                <button className="btn btn-sm"
                  style={{background:'var(--bg3)',color:'var(--purple-light)',border:'1px solid var(--border)',fontSize:12,padding:'6px 14px'}}
                  onClick={() => setModalMarcar(true)}>
                  ✓ Marcar ya enviados
                </button>
                <button className="btn btn-sm" disabled={pidiendo}
                  style={{background:'var(--gold)',color:'#000',fontSize:12,padding:'6px 14px',fontWeight:600}}
                  onClick={() => pedirFirma(null, null, 'todas')}>
                  {pidiendo ? 'Enviando…' : '📣 Pedir datos + firma a TODAS'}
                </button>
                {regalos.length > 0 && (
                  <button className="btn btn-sm" disabled={pidiendo}
                    style={{background:'var(--purple)',color:'#fff',fontSize:12,padding:'6px 14px'}}
                    onClick={() => pedirFirma(null)}>
                    📝 Solo a pendientes
                  </button>
                )}
              </div>
              {regalos.length === 0 ? (
                <div style={{textAlign:'center',padding:60,color:'var(--text-muted)'}}>
                  <div style={{fontSize:48,marginBottom:12}}>🎁</div>
                  <div>No hay regalos pendientes por enviar</div>
                </div>
              ) : (
                <table style={{width:'100%',borderCollapse:'collapse'}}>
                  <thead>
                    <tr style={{borderBottom:'1px solid var(--border)',color:'var(--text-muted)',fontSize:11,textTransform:'uppercase',letterSpacing:'0.5px'}}>
                      <th style={{padding:'10px 12px',textAlign:'left'}}>Creadora</th>
                      <th style={{padding:'10px 12px',textAlign:'left'}}>Dirección</th>
                      <th style={{padding:'10px 12px',textAlign:'center'}}>Acuerdo</th>
                      <th style={{padding:'10px 12px',textAlign:'center'}}>Regalo #</th>
                      <th style={{padding:'10px 12px',textAlign:'left'}}>Hito</th>
                      <th style={{padding:'10px 12px',textAlign:'center'}}>Acción</th>
                    </tr>
                  </thead>
                  <tbody>
                    {regalos.map(r => {
                      const inf = r.influencers || {};
                      return (
                        <tr key={r.id} style={{borderBottom:'1px solid var(--border)'}}>
                          <td style={{padding:'12px'}}>
                            <div style={{fontWeight:600}}>{inf.nombre||'—'}</div>
                            <div style={{fontSize:11,color:'var(--text-muted)'}}>@{inf.instagram_handle||'-'} · {inf.telefono||''}</div>
                          </td>
                          <td style={{padding:'12px',fontSize:12,color:'var(--text-muted)',maxWidth:220}}>{inf.direccion_envio||'Sin dirección'}, {inf.ciudad||''}</td>
                          <td style={{padding:'12px',textAlign:'center'}}>
                            {acuerdos[r.influencer_id] ? (
                              <a href={`/acuerdo/ver/${r.influencer_id}`} target="_blank" rel="noreferrer"
                                 style={{color:'var(--green)',fontSize:12,fontWeight:600,textDecoration:'none'}}>✅ Ver acuerdo</a>
                            ) : (
                              <button className="btn btn-sm" disabled={pidiendo}
                                style={{background:'var(--bg3)',color:'var(--purple-light)',border:'1px solid var(--border)',fontSize:11,padding:'4px 10px'}}
                                onClick={() => pedirFirma([r.influencer_id], inf.nombre)}>📝 Pedir firma</button>
                            )}
                          </td>
                          <td style={{padding:'12px',textAlign:'center'}}>
                            <span style={{fontSize:20}}>{'🎁'}</span>
                            <span style={{display:'block',fontSize:11,color:'var(--text-muted)'}}>#{r.numero_regalo}</span>
                          </td>
                          <td style={{padding:'12px',fontSize:12}}>
                            {r.numero_regalo === 1 ? 'Bienvenida al programa' : `Al llegar a $${((r.numero_regalo-1)*300000).toLocaleString('es-CO')} en ventas`}
                          </td>
                          <td style={{padding:'12px',textAlign:'center'}}>
                            <button className="btn btn-sm" style={{background:'var(--green)',color:'#000',fontSize:11,padding:'4px 10px',fontWeight:600}} onClick={() => abrirRegalo(r)}>
                              🎁 Elegir y enviar
                            </button>
                            <button className="btn btn-sm" style={{background:'none',color:'var(--text-muted)',fontSize:10,padding:'2px 6px',marginTop:4,display:'block',margin:'4px auto 0',border:'none',textDecoration:'underline',cursor:'pointer'}} onClick={() => handleRegalo(r.id)}>
                              solo marcar enviado
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>
          )}

          {/* Tab Leads — envío masivo WhatsApp */}
          {tab === 'leads' && (
            <div style={{maxWidth:640}}>
              <h3 style={{marginBottom:8,fontSize:15}}>Envío masivo — Leads Meta</h3>
              <p style={{color:'var(--text-muted)',fontSize:13,marginBottom:20}}>
                Sube el CSV de leads descargado de Meta Business Suite y envía el mensaje de bienvenida UGC a todos por WhatsApp.
              </p>

              <div style={{background:'var(--bg2)',borderRadius:10,padding:20,marginBottom:20}}>
                <label style={{display:'block',marginBottom:8,fontSize:13,color:'var(--text-muted)'}}>Archivo CSV (Meta Lead Ads)</label>
                <input type="file" accept=".csv" onChange={handleCSV}
                  style={{fontSize:13,color:'var(--text)',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'8px 12px',width:'100%',boxSizing:'border-box'}} />
                {leads.length > 0 && (
                  <p style={{marginTop:10,fontSize:13,color:'var(--green)'}}>✅ {leads.length} contactos listos para enviar</p>
                )}
              </div>

              {leads.length > 0 && (
                <>
                  <div style={{overflowX:'auto',marginBottom:16,maxHeight:260,overflowY:'auto',background:'var(--bg2)',borderRadius:8}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                      <thead>
                        <tr style={{background:'var(--bg3)'}}>
                          <th style={{padding:'8px 12px',textAlign:'left'}}>Nombre</th>
                          <th style={{padding:'8px 12px',textAlign:'left'}}>Teléfono</th>
                          <th style={{padding:'8px 12px',textAlign:'left'}}>Ciudad</th>
                        </tr>
                      </thead>
                      <tbody>
                        {leads.map((l,i) => (
                          <tr key={i} style={{borderTop:'1px solid var(--border)'}}>
                            <td style={{padding:'7px 12px'}}>{l.nombre}</td>
                            <td style={{padding:'7px 12px',color:'var(--text-muted)'}}>{l.telefono}</td>
                            <td style={{padding:'7px 12px',color:'var(--text-muted)'}}>{l.ciudad}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <button className="btn" onClick={handleEnvioMasivo} disabled={enviando}
                    style={{background:'var(--green)',fontSize:14,padding:'12px 28px'}}>
                    {enviando ? `Enviando...` : `📤 Enviar a ${leads.length} contactos`}
                  </button>
                </>
              )}

              {resultadoEnvio && (
                <div style={{marginTop:20,background:'var(--bg2)',borderRadius:10,padding:20}}>
                  <p style={{marginBottom:12,fontSize:14}}>
                    <strong>Resultado:</strong>&nbsp;
                    ✅ {resultadoEnvio.ok} enviados &nbsp;|&nbsp; ❌ {resultadoEnvio.errors} errores &nbsp;|&nbsp; Total: {resultadoEnvio.total}
                  </p>
                  {resultadoEnvio.errors > 0 && (
                    <div style={{fontSize:12,color:'var(--text-muted)'}}>
                      {resultadoEnvio.resultados.filter(r=>!r.ok).map((r,i)=>(
                        <div key={i} style={{padding:'4px 0',borderTop:'1px solid var(--border)'}}>
                          ❌ {r.nombre} ({r.telefono}) — {r.error}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* Modal enrollar */}
          {modalEnroll && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}} onClick={()=>setModalEnroll(false)}>
              <div style={{background:'var(--bg2)',borderRadius:12,padding:28,width:480,maxHeight:'80vh',overflow:'auto'}} onClick={e=>e.stopPropagation()}>
                <h2 style={{marginBottom:16,fontSize:16}}>Enrollar creadora en UGC</h2>
                <input className="input" placeholder="Buscar por nombre o @instagram..." value={searchEnroll}
                  onChange={e=>setSearchEnroll(e.target.value)} style={{width:'100%',marginBottom:16}} autoFocus />
                <div style={{maxHeight:320,overflowY:'auto'}}>
                  {infFiltradas.slice(0,30).map(i => (
                    <div key={i.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
                      <div>
                        <div style={{fontWeight:500}}>{i.nombre}</div>
                        <div style={{fontSize:11,color:'var(--text-muted)'}}>@{i.instagram_handle||i.tiktok_handle||'-'} · {i.ciudad||''}</div>
                      </div>
                      <button className="btn btn-sm" style={{background:'var(--purple)',fontSize:11}} onClick={()=>handleEnroll(i)}>Enrollar</button>
                    </div>
                  ))}
                  {infFiltradas.length === 0 && <div style={{color:'var(--text-muted)',textAlign:'center',padding:20}}>Sin resultados</div>}
                </div>
                <button className="btn btn-secondary btn-sm" style={{marginTop:16,width:'100%'}} onClick={()=>setModalEnroll(false)}>Cerrar</button>
              </div>
            </div>
          )}

          {/* Modal registrar pago */}
          {modalPago && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}} onClick={()=>setModalPago(null)}>
              <div style={{background:'var(--bg2)',borderRadius:12,padding:28,width:400}} onClick={e=>e.stopPropagation()}>
                <h2 style={{marginBottom:4,fontSize:16}}>Registrar pago</h2>
                <p style={{color:'var(--text-muted)',fontSize:12,marginBottom:20}}>{modalPago.nombre} · {mesActual}</p>
                <div style={{background:'var(--bg3)',borderRadius:8,padding:16,marginBottom:20}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                    <span style={{color:'var(--text-muted)'}}>Ventas del mes</span>
                    <span style={{color:'var(--green)',fontWeight:600}}>{fmtCOP(modalPago.ventas_mes)}</span>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                    <span style={{color:'var(--text-muted)'}}>Nivel · % comisión</span>
                    <span>{modalPago.nivel_ugc} · {modalPago.comision_pct}%</span>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',borderTop:'1px solid var(--border)',paddingTop:8}}>
                    <span style={{fontWeight:600}}>Total a pagar</span>
                    <span style={{color:'var(--gold)',fontWeight:700,fontSize:18}}>{fmtCOP(modalPago.comision_mes_pendiente)}</span>
                  </div>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={{fontSize:12,color:'var(--text-muted)',display:'block',marginBottom:4}}>Método de pago</label>
                  <select className="input" value={pagoForm.metodo_pago} onChange={e=>setPagoForm({...pagoForm,metodo_pago:e.target.value})} style={{width:'100%'}}>
                    <option>Nequi</option><option>Bancolombia</option><option>Daviplata</option><option>Transferencia</option><option>Efectivo</option>
                  </select>
                </div>
                <div style={{marginBottom:20}}>
                  <label style={{fontSize:12,color:'var(--text-muted)',display:'block',marginBottom:4}}>Notas (opcional)</label>
                  <input className="input" value={pagoForm.notas} onChange={e=>setPagoForm({...pagoForm,notas:e.target.value})} style={{width:'100%'}} placeholder="Comprobante, número de transacción..." />
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button className="btn btn-secondary btn-sm" style={{flex:1}} onClick={()=>setModalPago(null)}>Cancelar</button>
                  <button className="btn btn-sm" style={{flex:1,background:'var(--gold)',color:'#000'}} onClick={handlePago}>Confirmar pago</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal enviar regalo — elegir producto + confirmar envío */}
          {modalRegalo && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}} onClick={()=>!enviandoRegalo&&setModalRegalo(null)}>
              <div style={{background:'var(--bg2)',borderRadius:12,padding:24,width:520,maxWidth:'100%',maxHeight:'90vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
                <h2 style={{marginBottom:2,fontSize:16}}>🎁 Enviar regalo #{modalRegalo.numero_regalo}</h2>
                <p style={{color:'var(--text-muted)',fontSize:12,marginBottom:16}}>{modalRegalo.nombre}</p>

                <div style={{fontSize:12,fontWeight:600,color:'var(--purple-light)',marginBottom:8}}>1. Producto(s) a enviar</div>
                <div style={{maxHeight:240,overflowY:'auto',background:'var(--bg3)',borderRadius:8,padding:6,marginBottom:16}}>
                  {productos.length === 0 ? (
                    <div style={{padding:16,textAlign:'center',color:'var(--text-muted)',fontSize:13}}>Cargando productos…</div>
                  ) : productos.map(p => {
                    const sel = modalRegalo.skus.includes(p.sku);
                    const sinStock = p.stock !== null && p.stock <= 0;
                    return (
                      <label key={p.sku} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:6,cursor:'pointer',background:sel?'rgba(124,58,237,0.18)':'transparent'}}>
                        <input type="checkbox" checked={sel} onChange={()=>toggleSku(p.sku)} style={{width:18,height:18,flexShrink:0}} />
                        <span style={{flex:1,fontSize:13}}>{p.nombre}</span>
                        <span style={{fontSize:11,color:sinStock?'var(--red)':'var(--text-muted)'}}>{p.stock===null?'—':`${p.stock} und`}</span>
                      </label>
                    );
                  })}
                </div>

                <div style={{fontSize:12,fontWeight:600,color:'var(--purple-light)',marginBottom:8}}>2. Dirección de envío</div>
                <input className="input" value={modalRegalo.direccion_envio} onChange={e=>setModalRegalo(m=>({...m,direccion_envio:e.target.value}))} placeholder="Dirección (calle y número)" style={{width:'100%',marginBottom:8}} />
                <input className="input" value={modalRegalo.direccion_detalle} onChange={e=>setModalRegalo(m=>({...m,direccion_detalle:e.target.value}))} placeholder="Detalle (casa, apto, torre, urbanización)" style={{width:'100%',marginBottom:8}} />
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                  <input className="input" value={modalRegalo.ciudad} onChange={e=>setModalRegalo(m=>({...m,ciudad:e.target.value}))} placeholder="Ciudad" />
                  <input className="input" value={modalRegalo.departamento} onChange={e=>setModalRegalo(m=>({...m,departamento:e.target.value}))} placeholder="Departamento" />
                  <input className="input" value={modalRegalo.telefono} onChange={e=>setModalRegalo(m=>({...m,telefono:e.target.value}))} placeholder="Teléfono" />
                  <input className="input" value={modalRegalo.codigo_postal} onChange={e=>setModalRegalo(m=>({...m,codigo_postal:e.target.value}))} placeholder="Código postal" />
                </div>

                <div style={{display:'flex',gap:8,marginTop:8}}>
                  <button className="btn btn-secondary btn-sm" style={{flex:1}} disabled={enviandoRegalo} onClick={()=>setModalRegalo(null)}>Cancelar</button>
                  <button className="btn btn-sm" style={{flex:2,background:'var(--green)',color:'#000',fontWeight:600}} disabled={enviandoRegalo||!modalRegalo.skus.length} onClick={confirmarEnvioRegalo}>
                    {enviandoRegalo ? 'Creando orden…' : `🚚 Enviar regalo${modalRegalo.skus.length?` (${modalRegalo.skus.length})`:''}`}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal marcar como ya enviados (pegar números) */}
          {modalMarcar && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}} onClick={()=>!marcando&&setModalMarcar(false)}>
              <div style={{background:'var(--bg2)',borderRadius:12,padding:24,width:460,maxWidth:'100%'}} onClick={e=>e.stopPropagation()}>
                <h2 style={{marginBottom:4,fontSize:16}}>✓ Marcar como ya enviados</h2>
                <p style={{color:'var(--text-muted)',fontSize:12,marginBottom:14,lineHeight:1.5}}>
                  Pega los números de las creadoras que ya recibieron el acuerdo (una por línea o separadas por coma). Quedarán excluidas del envío masivo para no repetirles.
                </p>
                <textarea value={textoMarcar} onChange={e=>setTextoMarcar(e.target.value)}
                  placeholder={'573001234567\n573007654321\n…'}
                  style={{width:'100%',minHeight:140,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,padding:12,color:'var(--text)',fontSize:13,fontFamily:'monospace',boxSizing:'border-box',resize:'vertical'}} />
                <div style={{display:'flex',gap:8,marginTop:14}}>
                  <button className="btn btn-secondary btn-sm" style={{flex:1}} disabled={marcando} onClick={()=>setModalMarcar(false)}>Cancelar</button>
                  <button className="btn btn-sm" style={{flex:2,background:'var(--purple)',color:'#fff',fontWeight:600}} disabled={marcando} onClick={marcarEnviados}>
                    {marcando ? 'Marcando…' : 'Marcar como enviados'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
