<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creadoras — Brujería Capilar</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0a1e;
      --bg2: #1a1035;
      --bg3: #241848;
      --border: #3d2d6e;
      --purple: #7C3AED;
      --purple-light: #a855f7;
      --purple-dark: #2D1B69;
      --text: #f0ebff;
      --text-muted: #9580c0;
      --green: #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --blue: #3b82f6;
      --red: #ef4444;
      --gold: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* NAV */
    nav {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 32px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 16px;
      color: var(--purple-light);
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .nav-brand span { color: var(--text-muted); font-weight: 400; }
    nav button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    nav button:hover { background: var(--bg3); color: var(--text); }
    nav button.active { background: var(--purple-dark); color: var(--purple-light); }

    /* LAYOUT */
    main { padding: 28px 28px; max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .page-subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 13px; }

    /* STAT CARDS */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--text); }
    .stat-card .value.purple { color: var(--purple-light); }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.gold { color: var(--gold); }
    .stat-card .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* BADGE */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-registrada   { background: #1e3a5f; color: #60a5fa; }
    .badge-enviado      { background: #3f2e00; color: #facc15; }
    .badge-entregado    { background: #3f1f00; color: #fb923c; }
    .badge-calificada   { background: #052e16; color: #4ade80; }
    .badge-prospectada  { background: #1e1b4b; color: #a5b4fc; }
    .badge-contactada   { background: #312e81; color: #c7d2fe; }

    .badge-nano  { background: #1f2937; color: #9ca3af; }
    .badge-micro { background: #3b0764; color: #d8b4fe; }
    .badge-macro { background: #2D1B69; color: var(--purple-light); }

    .badge-semilla     { background: #052e16; color: #86efac; }
    .badge-aprendiz    { background: #1e3a5f; color: #93c5fd; }
    .badge-practicante { background: #3b0764; color: #d8b4fe; }
    .badge-experta     { background: #2D1B69; color: var(--purple-light); }
    .badge-gran        { background: #451a03; color: #fcd34d; }

    /* TABLE */
    .table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .table-header h2 { font-size: 15px; font-weight: 600; }
    .table-count { color: var(--text-muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg3); cursor: pointer; }
    tbody td { padding: 11px 16px; font-size: 13px; }
    .td-muted { color: var(--text-muted); }
    .td-mono { font-family: monospace; font-size: 12px; color: var(--text-muted); }

    /* FILTERS */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    select, input[type="text"], input[type="date"] {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--purple); }
    select option { background: var(--bg2); }

    /* BUTTONS */
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--purple); color: white; }
    .btn-primary:hover { background: var(--purple-light); }
    .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-danger { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }

    /* DETAIL PANEL */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .detail-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--purple-light); }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-muted); }
    .detail-value { font-weight: 500; text-align: right; }

    /* BACK BUTTON */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 20px;
      padding: 4px 0;
    }
    .back-btn:hover { color: var(--text); }

    /* ROI */
    .roi-form {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }

    /* INLINE EDIT */
    .inline-edit { display: flex; gap: 8px; align-items: center; }
    .inline-edit input { flex: 1; }

    /* STATUS SELECTOR */
    .status-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* LOADING / ERROR */
    .loading { color: var(--text-muted); padding: 40px; text-align: center; }
    .error-msg { color: #fca5a5; background: #450a0a; border: 1px solid #7f1d1d; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; }

    /* SCORE BAR */
    .score-bar { display: flex; align-items: center; gap: 8px; }
    .score-bar-bg { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
    .score-bar-fill { height: 100%; background: var(--purple); border-radius: 3px; transition: width 0.3s; }
    .score-num { font-size: 12px; color: var(--text-muted); width: 32px; text-align: right; }

    /* STATUS BREAKDOWN */
    .status-breakdown { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; margin-top: 28px; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

    input[type="text"].input-sm { width: 200px; }

    /* MODAL ENVIAR KIT */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
    }
    .modal {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; width: 500px; max-width: 95vw;
      max-height: 85vh; overflow-y: auto;
    }
    .modal h2 { font-size: 16px; margin-bottom: 4px; }
    .modal-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .producto-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      border: 1px solid transparent; margin-bottom: 6px; transition: all 0.1s;
    }
    .producto-item:hover { background: var(--bg3); }
    .producto-item.selected { border-color: var(--purple); background: rgba(124,58,237,0.12); }
    .producto-item.sin-stock { opacity: 0.45; cursor: not-allowed; }
    .producto-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--purple); flex-shrink: 0; }
    .producto-nombre { font-size: 13px; font-weight: 500; flex: 1; }
    .producto-sku { font-size: 11px; color: var(--text-muted); font-family: monospace; }
    .producto-stock { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
    .stock-ok { background: #052e16; color: #86efac; }
    .stock-bajo { background: #451a03; color: #fcd34d; }
    .stock-cero { background: #450a0a; color: #fca5a5; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .modal-counter { font-size: 13px; color: var(--text-muted); margin-top: 12px; }
    .modal-counter strong { color: var(--text); }
    .envio-success { background: var(--bg3); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .envio-success .line { font-size: 13px; padding: 5px 0; display: flex; align-items: center; gap: 8px; }
    .envio-success .line.ok { color: var(--green); }
    .envio-success .line.warn { color: var(--yellow); }
    .tier-hint { background: rgba(124,58,237,0.1); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
    .tier-hint strong { color: var(--purple-light); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ── UTILS ──────────────────────────────────────────────────────
    const API = async (path) => {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`Error ${res.status}`);
      return res.json();
    };

    const PATCH = async (path, body) => {
      const res = await fetch(path, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`Error ${res.status}`);
      return res.json();
    };

    const POSTJSON = async (path, body, method = 'POST') => {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
      return data;
    };

    const fmt = (n) => n != null ? Number(n).toLocaleString('es-CO') : '—';
    const fmtCOP = (n) => n != null ? `$${Number(n).toLocaleString('es-CO')}` : '—';
    const fmtDate = (s) => s ? new Date(s).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';

    // ── BADGES ────────────────────────────────────────────────────
    function StatusBadge({ status }) {
      const map = {
        'Registrada': 'registrada',
        'Producto Enviado': 'enviado',
        'Contenido Entregado': 'entregado',
        'Calificada': 'calificada',
        'Prospectada': 'prospectada',
        'Contactada': 'contactada',
      };
      return <span className={`badge badge-${map[status] || 'registrada'}`}>{status || '—'}</span>;
    }

    function TierBadge({ tier }) {
      const map = { 'Nano': 'nano', 'Micro': 'micro', 'Macro': 'macro' };
      return <span className={`badge badge-${map[tier] || 'nano'}`}>{tier || '—'}</span>;
    }

    function NivelBadge({ nivel }) {
      const map = {
        'Magia Naciente':  'semilla',
        'Magia Viva':      'aprendiz',
        'Magia Profunda':  'practicante',
        'Magia Pura':      'experta',
        'Gran Magia':      'gran',
        // nombres legacy
        'Bruja Semilla': 'semilla',
        'Bruja Aprendiz': 'aprendiz',
        'Bruja Practicante': 'practicante',
        'Bruja Experta': 'experta',
        'Gran Bruja': 'gran',
      };
      return <span className={`badge badge-${map[nivel] || 'semilla'}`}>{nivel || '—'}</span>;
    }

    // ── STAT CARD ─────────────────────────────────────────────────
    function StatCard({ label, value, sub, color }) {
      return (
        <div className="stat-card">
          <div className="label">{label}</div>
          <div className={`value ${color || ''}`}>{value}</div>
          {sub && <div className="sub">{sub}</div>}
        </div>
      );
    }

    // ── SCORE BAR ─────────────────────────────────────────────────
    function ScoreBar({ score }) {
      const s = score != null ? Math.min(score, 100) : 0;
      return (
        <div className="score-bar">
          <div className="score-bar-bg">
            <div className="score-bar-fill" style={{ width: `${s}%` }} />
          </div>
          <span className="score-num">{score != null ? score.toFixed(1) : '—'}</span>
        </div>
      );
    }

    // ── DASHBOARD ─────────────────────────────────────────────────
    function Dashboard({ onNavigate }) {
      const [stats, setStats] = useState(null);
      const [influencers, setInfluencers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        Promise.all([API('/api/stats'), API('/api/influencers')])
          .then(([s, inf]) => { setStats(s); setInfluencers(inf.slice(0, 8)); })
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      }, []);

      if (loading) return <div className="loading">Cargando...</div>;
      if (error) return <div className="error-msg">{error}</div>;

      const statusOrder = ['Registrada', 'Producto Enviado', 'Contenido Entregado', 'Calificada'];

      return (
        <div>
          <h1>Dashboard</h1>
          <p className="page-subtitle">Vista general del Programa Creadoras</p>

          <div className="stat-grid">
            <StatCard label="Total Influencers" value={fmt(stats.total)} color="purple" />
            <StatCard label="Kits Enviados" value={fmt(stats.enviadas)} sub="Producto Enviado + Calificadas" />
            <StatCard label="Costo Total Kits" value={fmtCOP(stats.costoTotalKits)} sub="Valor retail acumulado" color="gold" />
            <StatCard label="Contenidos" value={fmt(stats.totalContenidos)} sub="Piezas entregadas" />
            <StatCard label="Score Promedio" value={stats.scorePromedio > 0 ? `${stats.scorePromedio}` : '—'} sub="Promedio general" color="green" />
          </div>

          {stats.porStatus && (
            <div style={{ marginBottom: 28 }}>
              <div className="table-wrap" style={{ padding: '16px 20px' }}>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Distribución por Estado</div>
                <div className="status-breakdown">
                  {statusOrder.map(s => stats.porStatus[s] ? (
                    <div key={s} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <StatusBadge status={s} />
                      <span style={{ fontSize: 15, fontWeight: 700 }}>{stats.porStatus[s]}</span>
                    </div>
                  ) : null)}
                </div>
              </div>
            </div>
          )}

          <div className="table-wrap">
            <div className="table-header">
              <h2>Últimas Registradas</h2>
              <button className="btn btn-secondary btn-sm" onClick={() => onNavigate('influencers')}>Ver todas →</button>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Instagram</th>
                  <th>Tier</th>
                  <th>Status</th>
                  <th>Nivel Bruja</th>
                  <th>Registro</th>
                </tr>
              </thead>
              <tbody>
                {influencers.map(inf => (
                  <tr key={inf.id} onClick={() => onNavigate('detalle', inf.id)}>
                    <td>{inf.nombre || '—'}</td>
                    <td className="td-muted">{inf.instagram_handle || '—'}</td>
                    <td><TierBadge tier={inf.tier} /></td>
                    <td><StatusBadge status={inf.status} /></td>
                    <td><NivelBadge nivel={inf.nivel_bruja} /></td>
                    <td className="td-muted">{fmtDate(inf.fecha_registro)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ── INFLUENCERS ───────────────────────────────────────────────
    const STATUSES_INF = ['Prospectada', 'Contactada', 'Registrada', 'Producto Enviado', 'Contenido Entregado', 'Calificada'];

    function Influencers({ onNavigate }) {
      const [all, setAll] = useState([]);
      const [filtered, setFiltered] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [filters, setFilters] = useState({ status: '', tier: '', nivel_bruja: '', search: '' });
      const [updatingStatus, setUpdatingStatus] = useState(null);

      const load = () => {
        API('/api/influencers')
          .then(data => {
            const sorted = data.sort((a, b) => new Date(b.fecha_registro) - new Date(a.fecha_registro));
            setAll(sorted); setFiltered(sorted);
          })
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      };

      useEffect(() => { load(); }, []);

      useEffect(() => {
        let res = all;
        if (filters.status) res = res.filter(i => i.status === filters.status);
        if (filters.tier) res = res.filter(i => i.tier === filters.tier);
        if (filters.nivel_bruja) res = res.filter(i => i.nivel_bruja === filters.nivel_bruja);
        if (filters.search) {
          const q = filters.search.toLowerCase();
          res = res.filter(i =>
            (i.nombre || '').toLowerCase().includes(q) ||
            (i.email || '').toLowerCase().includes(q) ||
            (i.instagram_handle || '').toLowerCase().includes(q) ||
            (i.tiktok_handle || '').toLowerCase().includes(q)
          );
        }
        setFiltered(res);
      }, [filters, all]);

      const setFilter = (k, v) => setFilters(f => ({ ...f, [k]: v }));

      const cambiarStatus = async (e, inf) => {
        e.stopPropagation();
        const nuevoStatus = e.target.value;
        setUpdatingStatus(inf.id);
        try {
          await PATCH(`/api/influencers/${inf.id}`, { status: nuevoStatus });
          setAll(prev => prev.map(i => i.id === inf.id ? { ...i, status: nuevoStatus } : i));
        } catch(err) {
          alert('Error al actualizar: ' + err.message);
        } finally {
          setUpdatingStatus(null);
        }
      };

      if (loading) return <div className="loading">Cargando influencers...</div>;
      if (error) return <div className="error-msg">{error}</div>;

      return (
        <div>
          <h1>Influencers</h1>
          <p className="page-subtitle">{filtered.length} de {all.length} influencers</p>

          <div className="table-wrap">
            <div className="table-header">
              <div className="filters">
                <input
                  type="text"
                  placeholder="Buscar nombre, email, @tiktok..."
                  value={filters.search}
                  onChange={e => setFilter('search', e.target.value)}
                  style={{ width: 220 }}
                />
                <select value={filters.status} onChange={e => setFilter('status', e.target.value)}>
                  <option value="">Todos los estados</option>
                  {STATUSES_INF.map(s => <option key={s}>{s}</option>)}
                </select>
                <select value={filters.tier} onChange={e => setFilter('tier', e.target.value)}>
                  <option value="">Todos los tiers</option>
                  <option>Nano</option>
                  <option>Micro</option>
                  <option>Macro</option>
                </select>
                <select value={filters.nivel_bruja} onChange={e => setFilter('nivel_bruja', e.target.value)}>
                  <option value="">Todos los niveles</option>
                  <option>Magia Naciente</option>
                  <option>Magia Viva</option>
                  <option>Magia Profunda</option>
                  <option>Magia Pura</option>
                  <option>Gran Magia</option>
                </select>
                {(filters.status || filters.tier || filters.nivel_bruja || filters.search) && (
                  <button className="btn btn-secondary btn-sm" onClick={() => setFilters({ status: '', tier: '', nivel_bruja: '', search: '' })}>
                    Limpiar
                  </button>
                )}
              </div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Instagram</th>
                  <th>TikTok</th>
                  <th>Seguidores</th>
                  <th>Tier</th>
                  <th>Kit</th>
                  <th>Status</th>
                  <th>Nivel Bruja</th>
                  <th>Score</th>
                  <th>Registro</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr><td colSpan="10" className="empty-state">Sin resultados</td></tr>
                ) : filtered.map(inf => (
                  <tr key={inf.id} onClick={() => onNavigate('detalle', inf.id)} style={{ cursor: 'pointer' }}>
                    <td style={{ fontWeight: 500 }}>{inf.nombre || '—'}</td>
                    <td className="td-muted">{inf.instagram_handle || '—'}</td>
                    <td className="td-muted">
                      {inf.tiktok_handle
                        ? <a href={`https://tiktok.com/@${inf.tiktok_handle}`} target="_blank" rel="noreferrer"
                            onClick={e => e.stopPropagation()}
                            style={{ color: 'var(--purple-light)' }}>@{inf.tiktok_handle}</a>
                        : '—'}
                    </td>
                    <td className="td-muted">{inf.seguidores_instagram ? fmt(inf.seguidores_instagram) : (inf.seguidores_tiktok ? fmt(inf.seguidores_tiktok) : '—')}</td>
                    <td><TierBadge tier={inf.tier} /></td>
                    <td className="td-muted" style={{ fontSize: 12 }}>{inf.kit_asignado || '—'}</td>
                    <td onClick={e => e.stopPropagation()}>
                      <select
                        value={inf.status || ''}
                        disabled={updatingStatus === inf.id}
                        onChange={e => cambiarStatus(e, inf)}
                        style={{
                          fontSize: 12, padding: '3px 6px', borderRadius: 6,
                          border: '1px solid var(--border)', background: 'var(--bg)',
                          color: 'var(--text)', cursor: 'pointer', opacity: updatingStatus === inf.id ? 0.5 : 1
                        }}
                      >
                        {STATUSES_INF.map(s => <option key={s}>{s}</option>)}
                      </select>
                    </td>
                    <td><NivelBadge nivel={inf.nivel_bruja} /></td>
                    <td style={{ minWidth: 120 }}><ScoreBar score={inf.score_total} /></td>
                    <td className="td-muted">{fmtDate(inf.fecha_registro)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ── DETALLE INFLUENCER ────────────────────────────────────────
    function DetalleInfluencer({ id, onBack }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [saving, setSaving] = useState(false);
      const [codigoEdit, setCodigoEdit] = useState('');
      const [notasEdit, setNotasEdit] = useState('');
      const [tipoCabelloEdit, setTipoCabelloEdit] = useState('');
      const [telefonoEdit, setTelefonoEdit] = useState('');
      const [savedMsg, setSavedMsg] = useState('');
      // Modal enviar kit
      const [modalEnvio, setModalEnvio] = useState(false);
      const [productos, setProductos] = useState([]);
      const [skusSeleccionados, setSkusSeleccionados] = useState([]);
      const [enviando, setEnviando] = useState(false);
      const [envioResult, setEnvioResult] = useState(null);
      // Dirección editable en modal
      const [modalDireccion, setModalDireccion] = useState('');
      const [modalCiudad, setModalCiudad] = useState('');
      const [modalDepartamento, setModalDepartamento] = useState('');
      const [modalTelefono, setModalTelefono] = useState('');
      const [modalCodigoPostal, setModalCodigoPostal] = useState('');

      const load = useCallback(() => {
        setLoading(true);
        API(`/api/influencers/${id}`)
          .then(d => {
            setData(d);
            setCodigoEdit(d.codigo_descuento || '');
            setNotasEdit(d.notas_equipo || '');
            setTipoCabelloEdit(d.tipo_cabello || '');
            setTelefonoEdit(d.telefono || '');
          })
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      }, [id]);

      useEffect(() => { load(); }, [load]);

      const guardar = async (fields) => {
        setSaving(true);
        try {
          await PATCH(`/api/influencers/${id}`, fields);
          setSavedMsg('Guardado');
          setTimeout(() => setSavedMsg(''), 2000);
          load();
        } catch(e) {
          setError(e.message);
        } finally {
          setSaving(false);
        }
      };

      const abrirModal = async () => {
        const cfg = await API('/api/config/productos');
        setProductos(cfg.productos || []);
        setSkusSeleccionados([]);
        setEnvioResult(null);
        setModalDireccion(data.direccion_envio || '');
        setModalCiudad(data.ciudad || '');
        setModalDepartamento(data.departamento || '');
        setModalTelefono(data.telefono || '');
        setModalCodigoPostal(data.codigo_postal || '');
        setModalEnvio(true);
      };

      const toggleSku = (sku) => {
        setSkusSeleccionados(prev =>
          prev.includes(sku) ? prev.filter(s => s !== sku) : [...prev, sku]
        );
      };

      const confirmarEnvio = async () => {
        if (skusSeleccionados.length === 0) return;
        setEnviando(true);
        try {
          const res = await fetch(`/api/influencers/${id}/enviar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              skus: skusSeleccionados,
              kit_nombre: `Kit ${skusSeleccionados.length} producto(s)`,
              direccion_envio: modalDireccion,
              ciudad: modalCiudad,
              departamento: modalDepartamento,
              telefono: modalTelefono,
              codigo_postal: modalCodigoPostal,
            }),
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.error);
          setEnvioResult(result);
          load();
        } catch(e) {
          setError(e.message);
          setModalEnvio(false);
        } finally {
          setEnviando(false);
        }
      };

      const tierSugerencia = { 'Nano': 1, 'Micro': 2, 'Macro': 3 };

      if (loading) return <div className="loading">Cargando...</div>;
      if (error) return <div className="error-msg">{error}</div>;
      if (!data) return null;

      const statusOptions = ['Registrada', 'Contactada', 'Producto Enviado', 'Contenido Entregado', 'Calificada', 'Pausada'];
      const puedeEnviar = !['Producto Enviado', 'Contenido Entregado', 'Calificada'].includes(data.status);

      return (
        <div>
          <button className="back-btn" onClick={onBack}>← Volver</button>

          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 4, flexWrap: 'wrap' }}>
            <h1>{data.nombre || 'Sin nombre'}</h1>
            {savedMsg && <span style={{ fontSize: 13, color: 'var(--green)' }}>✓ {savedMsg}</span>}
            {puedeEnviar && (
              <button className="btn btn-primary" onClick={abrirModal}>
                📦 Enviar Kit
              </button>
            )}
          </div>
          <p className="page-subtitle">{data.email} · {data.telefono || '—'}</p>

          {/* Modal Enviar Kit */}
          {modalEnvio && (
            <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget && !enviando) { setModalEnvio(false); } }}>
              <div className="modal">
                {!envioResult ? (
                  <>
                    <h2>Seleccionar productos para enviar</h2>
                    <p className="modal-subtitle">{data.nombre} · <TierBadge tier={data.tier} /></p>

                    {data.tier && tierSugerencia[data.tier] && (
                      <div className="tier-hint">
                        Sugerencia tier <strong>{data.tier}</strong>: {tierSugerencia[data.tier]} producto(s). Puedes seleccionar cualquier cantidad.
                      </div>
                    )}

                    {/* Dirección de envío — editable antes de confirmar */}
                    <div style={{ background: 'var(--bg3)', borderRadius: 8, padding: 12, marginBottom: 14 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
                        📍 Dirección de envío
                        {(!modalDireccion || !modalCiudad) && (
                          <span style={{ color: '#f59e0b', fontSize: 11 }}>⚠ Campos incompletos — verifica antes de enviar</span>
                        )}
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                        <input
                          type="text"
                          placeholder="Dirección (calle, número, barrio...)"
                          value={modalDireccion}
                          onChange={e => setModalDireccion(e.target.value)}
                          style={{
                            padding: '7px 10px', borderRadius: 6, fontSize: 13,
                            border: !modalDireccion ? '1.5px solid #f59e0b' : '1px solid var(--border)',
                            background: 'var(--bg2)', color: 'var(--text)', width: '100%', boxSizing: 'border-box',
                          }}
                        />
                        <div style={{ display: 'flex', gap: 6 }}>
                          <input
                            type="text"
                            placeholder="Ciudad"
                            value={modalCiudad}
                            onChange={e => setModalCiudad(e.target.value)}
                            style={{
                              flex: 2, padding: '7px 10px', borderRadius: 6, fontSize: 13,
                              border: !modalCiudad ? '1.5px solid #f59e0b' : '1px solid var(--border)',
                              background: 'var(--bg2)', color: 'var(--text)',
                            }}
                          />
                          <input
                            type="text"
                            placeholder="Cód. postal"
                            value={modalCodigoPostal}
                            onChange={e => setModalCodigoPostal(e.target.value)}
                            style={{
                              flex: 1, padding: '7px 10px', borderRadius: 6, fontSize: 13,
                              border: '1px solid var(--border)',
                              background: 'var(--bg2)', color: 'var(--text)',
                            }}
                          />
                        </div>
                        <input
                          type="text"
                          placeholder="Departamento"
                          value={modalDepartamento}
                          onChange={e => setModalDepartamento(e.target.value)}
                          style={{
                            padding: '7px 10px', borderRadius: 6, fontSize: 13,
                            border: !modalDepartamento ? '1.5px solid #f59e0b' : '1px solid var(--border)',
                            background: 'var(--bg2)', color: 'var(--text)', width: '100%', boxSizing: 'border-box',
                          }}
                        />
                        <input
                          type="text"
                          placeholder="Teléfono"
                          value={modalTelefono}
                          onChange={e => setModalTelefono(e.target.value)}
                          style={{
                            padding: '7px 10px', borderRadius: 6, fontSize: 13,
                            border: '1px solid var(--border)',
                            background: 'var(--bg2)', color: 'var(--text)', width: '100%', boxSizing: 'border-box',
                          }}
                        />
                      </div>
                    </div>

                    <div>
                      {productos.map((p) => {
                        const sel = skusSeleccionados.includes(p.sku);
                        const sinStock = p.stock !== null && p.stock <= 0;
                        const stockClass = p.stock === null ? '' : p.stock <= 0 ? 'stock-cero' : p.stock <= 5 ? 'stock-bajo' : 'stock-ok';
                        const stockLabel = p.stock === null ? '' : p.stock <= 0 ? 'Sin stock' : `${p.stock} uds`;
                        return (
                          <div
                            key={p.sku}
                            className={`producto-item ${sel ? 'selected' : ''} ${sinStock ? 'sin-stock' : ''}`}
                            onClick={() => !sinStock && toggleSku(p.sku)}
                          >
                            <input type="checkbox" checked={sel} disabled={sinStock} onChange={() => !sinStock && toggleSku(p.sku)} />
                            <span className="producto-nombre">{p.nombre}</span>
                            <span className="producto-sku">{p.sku}</span>
                            {stockLabel && <span className={`producto-stock ${stockClass}`}>{stockLabel}</span>}
                          </div>
                        );
                      })}
                    </div>

                    <div className="modal-counter">
                      <strong>{skusSeleccionados.length}</strong> producto(s) seleccionado(s)
                    </div>

                    <div className="modal-footer">
                      <button className="btn btn-secondary" onClick={() => setModalEnvio(false)} disabled={enviando}>
                        Cancelar
                      </button>
                      <button
                        className="btn btn-primary"
                        onClick={confirmarEnvio}
                        disabled={skusSeleccionados.length === 0 || enviando}
                      >
                        {enviando ? 'Creando orden...' : `Confirmar y enviar (${skusSeleccionados.length})`}
                      </button>
                    </div>
                  </>
                ) : (
                  <>
                    <h2>¡Kit enviado!</h2>
                    <p className="modal-subtitle" style={{ marginBottom: 16 }}>{data.nombre}</p>
                    <div className="envio-success">
                      <div className="line ok">
                        ✓ Orden Shopify #{envioResult.shopify?.shopify_order_number || envioResult.shopify?.shopify_order_id}
                      </div>
                      <div className="line ok">
                        ✓ Supabase actualizado — status: Producto Enviado
                      </div>
                      {envioResult.siigo && (
                        <div className="line ok">✓ Inventario registrado en Siigo: {envioResult.siigo.name}</div>
                      )}
                      {envioResult.siigo_error && (
                        <div className="line warn">⚠ Siigo: {envioResult.siigo_error}</div>
                      )}
                    </div>
                    <div className="modal-footer">
                      <button className="btn btn-primary" onClick={() => setModalEnvio(false)}>Cerrar</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          <div className="detail-grid">
            {/* Datos personales */}
            <div className="detail-card">
              <h3>Datos</h3>
              <div className="detail-row"><span className="detail-label">Instagram</span><span className="detail-value">{data.instagram_handle || '—'}</span></div>
              <div className="detail-row"><span className="detail-label">TikTok</span><span className="detail-value">{data.tiktok_handle || '—'}</span></div>
              <div className="detail-row"><span className="detail-label">Seguidores IG</span><span className="detail-value">{fmt(data.seguidores_instagram)}</span></div>
              <div className="detail-row"><span className="detail-label">Seguidores TT</span><span className="detail-value">{fmt(data.seguidores_tiktok)}</span></div>
              <div className="detail-row">
                <span className="detail-label">Teléfono</span>
                <div className="inline-edit" style={{ flex: 1, justifyContent: 'flex-end' }}>
                  <input
                    type="text"
                    value={telefonoEdit}
                    onChange={e => setTelefonoEdit(e.target.value)}
                    placeholder="Ej: 3001234567"
                    style={{ width: 130, fontSize: 13 }}
                  />
                  <button
                    className="btn btn-primary btn-sm"
                    onClick={() => guardar({ telefono: telefonoEdit || null })}
                    disabled={saving}
                  >{saving ? '...' : 'Guardar'}</button>
                </div>
              </div>
              <div className="detail-row"><span className="detail-label">Ciudad</span><span className="detail-value">{data.ciudad || '—'}</span></div>
              <div className="detail-row"><span className="detail-label">Dirección</span><span className="detail-value" style={{ maxWidth: 200, textAlign: 'right', fontSize: 12 }}>{data.direccion_envio || '—'}</span></div>
              <div className="detail-row"><span className="detail-label">Registro</span><span className="detail-value">{fmtDate(data.fecha_registro)}</span></div>
              <div className="detail-row">
                <span className="detail-label">Tipo de Cabello</span>
                <select
                  value={tipoCabelloEdit}
                  onChange={e => { setTipoCabelloEdit(e.target.value); guardar({ tipo_cabello: e.target.value || null }); }}
                  style={{ fontSize: 12, padding: '4px 8px', background: 'var(--bg3)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: 6 }}
                >
                  <option value="">— Sin definir —</option>
                  <option value="Liso">Liso</option>
                  <option value="Ondulado">Ondulado</option>
                  <option value="Rizado">Rizado</option>
                  <option value="Muy rizado">Muy rizado</option>
                </select>
              </div>
            </div>

            {/* Programa */}
            <div className="detail-card">
              <h3>Programa</h3>
              <div className="detail-row"><span className="detail-label">Tier</span><span className="detail-value"><TierBadge tier={data.tier} /></span></div>
              <div className="detail-row"><span className="detail-label">Kit</span><span className="detail-value">{data.kit_asignado || '—'}</span></div>
              <div className="detail-row"><span className="detail-label">Nivel Bruja</span><span className="detail-value"><NivelBadge nivel={data.nivel_bruja} /></span></div>
              <div className="detail-row"><span className="detail-label">Score Total</span><span className="detail-value">{data.score_total != null ? data.score_total.toFixed(1) : '0.0'}</span></div>
              <div className="detail-row"><span className="detail-label">Envío</span><span className="detail-value">{fmtDate(data.fecha_envio)}</span></div>
              <div className="detail-row"><span className="detail-label">Guía</span><span className="detail-value td-mono" style={{ fontSize: 12 }}>{data.numero_guia || '—'}</span></div>

              {/* Status editable */}
              <div className="detail-row" style={{ flexDirection: 'column', gap: 8, alignItems: 'flex-start' }}>
                <span className="detail-label">Estado actual</span>
                <div className="status-row">
                  <StatusBadge status={data.status} />
                  <select
                    value={data.status || ''}
                    onChange={e => guardar({ status: e.target.value })}
                    style={{ fontSize: 12, padding: '4px 8px' }}
                  >
                    {statusOptions.map(s => <option key={s}>{s}</option>)}
                  </select>
                </div>
              </div>
            </div>

            {/* Código de descuento */}
            <div className="detail-card">
              <h3>Código de Descuento Shopify</h3>
              <p style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 12 }}>
                Si la influencer tiene un código de descuento asignado, las ventas con ese código se atribuyen a ella en la vista ROI.
              </p>
              <div className="inline-edit">
                <input
                  type="text"
                  value={codigoEdit}
                  onChange={e => setCodigoEdit(e.target.value)}
                  placeholder="Ej: BRUJA-ANA20"
                  style={{ textTransform: 'uppercase' }}
                />
                <button
                  className="btn btn-primary btn-sm"
                  onClick={() => guardar({ codigo_descuento: codigoEdit.toUpperCase() || null })}
                  disabled={saving}
                >
                  {saving ? '...' : 'Guardar'}
                </button>
              </div>
            </div>

            {/* Notas */}
            <div className="detail-card">
              <h3>Notas del Equipo</h3>
              <textarea
                value={notasEdit}
                onChange={e => setNotasEdit(e.target.value)}
                placeholder="Observaciones internas..."
                style={{
                  width: '100%', minHeight: 80, background: 'var(--bg3)',
                  border: '1px solid var(--border)', color: 'var(--text)',
                  borderRadius: 8, padding: 10, fontSize: 13, resize: 'vertical',
                  marginBottom: 10,
                }}
              />
              <button
                className="btn btn-secondary btn-sm"
                onClick={() => guardar({ notas_equipo: notasEdit })}
                disabled={saving}
              >
                {saving ? 'Guardando...' : 'Guardar notas'}
              </button>
            </div>
          </div>

          {/* Contenidos */}
          {data.contenidos && data.contenidos.length > 0 && (
            <div style={{ marginTop: 28 }}>
              <div className="section-title">Contenidos Entregados ({data.contenidos.length})</div>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Plataforma</th>
                      <th>Tipo</th>
                      <th>Fecha Publicación</th>
                      <th>Vistas</th>
                      <th>Likes</th>
                      <th>Guardados</th>
                      <th>Score</th>
                      <th>URL</th>
                    </tr>
                  </thead>
                  <tbody>
                    {data.contenidos.map(c => (
                      <tr key={c.id} style={{ cursor: 'default' }}>
                        <td>{c.plataforma || '—'}</td>
                        <td className="td-muted">{c.tipo_contenido || '—'}</td>
                        <td className="td-muted">{fmtDate(c.fecha_publicacion)}</td>
                        <td>{fmt(c.vistas)}</td>
                        <td>{fmt(c.likes)}</td>
                        <td>{fmt(c.guardados)}</td>
                        <td style={{ minWidth: 120 }}><ScoreBar score={c.score_contenido} /></td>
                        <td>
                          {c.url_contenido
                            ? <a href={c.url_contenido} target="_blank" rel="noreferrer" style={{ color: 'var(--purple-light)', fontSize: 12 }} onClick={e => e.stopPropagation()}>Ver →</a>
                            : '—'
                          }
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {data.contenidos && data.contenidos.length === 0 && (
            <div className="empty-state" style={{ marginTop: 28 }}>Sin contenidos entregados aún</div>
          )}
        </div>
      );
    }

    // ── CONTENIDOS ────────────────────────────────────────────────
    function Estrellas({ valor, onChange, disabled }) {
      const [hover, setHover] = useState(0);
      return (
        <div style={{ display: 'flex', gap: 2 }}>
          {[1,2,3,4,5].map(n => (
            <span
              key={n}
              onClick={() => !disabled && onChange(n)}
              onMouseEnter={() => !disabled && setHover(n)}
              onMouseLeave={() => !disabled && setHover(0)}
              style={{
                fontSize: 18, cursor: disabled ? 'default' : 'pointer',
                color: n <= (hover || valor || 0) ? 'var(--gold)' : 'var(--border)',
                transition: 'color 0.1s',
                userSelect: 'none',
              }}
            >★</span>
          ))}
        </div>
      );
    }

    function FilaContenido({ c, onCalificado }) {
      const [calificacion, setCalificacion] = useState(c.calificacion_equipo || 0);
      const [guardando, setGuardando] = useState(false);
      const [score, setScore] = useState(c.score_contenido);

      async function calificar(val) {
        if (val === calificacion) return;
        setCalificacion(val);
        setGuardando(true);
        try {
          const res = await POSTJSON(`/api/contenidos/${c.id}/calificar`, { calificacion: val }, 'PATCH');
          setScore(res.score_contenido);
          if (onCalificado) onCalificado(c.id, val, res.score_contenido);
        } catch (e) {
          console.error('Error calificando:', e);
          setCalificacion(c.calificacion_equipo || 0);
        } finally {
          setGuardando(false);
        }
      }

      return (
        <tr key={c.id}>
          <td style={{ fontWeight: 500 }}>{c.influencers?.nombre || '—'}</td>
          <td>{c.plataforma || '—'}</td>
          <td className="td-muted">{c.tipo_contenido || '—'}</td>
          <td>{fmt(c.vistas)}</td>
          <td>{fmt(c.likes)}</td>
          <td>{fmt(c.guardados)}</td>
          <td style={{ minWidth: 120 }}><ScoreBar score={score} /></td>
          <td>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              <Estrellas valor={calificacion} onChange={calificar} disabled={guardando} />
              {guardando && <span style={{ fontSize: 10, color: 'var(--text-muted)' }}>Guardando...</span>}
              {!guardando && !calificacion && <span style={{ fontSize: 10, color: 'var(--yellow)' }}>Sin calificar</span>}
              {!guardando && calificacion > 0 && <span style={{ fontSize: 10, color: 'var(--green)' }}>{calificacion}/5 ✓</span>}
            </div>
          </td>
          <td className="td-muted" style={{ fontSize: 12 }}>{fmtDate(c.fecha_submision)}</td>
          <td style={{ maxWidth: 200 }}>
            {c.url_contenido
              ? <a href={c.url_contenido} target="_blank" rel="noreferrer" style={{ color: 'var(--purple-light)', fontSize: 11, wordBreak: 'break-all', display: 'block', lineHeight: 1.4 }}>
                  {c.url_contenido.replace(/^https?:\/\/(www\.)?/, '')}
                </a>
              : '—'
            }
          </td>
        </tr>
      );
    }

    function Contenidos() {
      const [contenidos, setContenidos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        API('/api/contenidos')
          .then(setContenidos)
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      }, []);

      if (loading) return <div className="loading">Cargando contenidos...</div>;
      if (error) return <div className="error-msg">{error}</div>;

      const conScore = contenidos.filter(c => c.score_contenido != null);
      const promedio = conScore.length > 0
        ? (conScore.reduce((s, c) => s + c.score_contenido, 0) / conScore.length).toFixed(1)
        : '—';
      const sinCalificar = contenidos.filter(c => !c.calificacion_equipo).length;

      return (
        <div>
          <h1>Contenidos</h1>
          <p className="page-subtitle">
            {contenidos.length} piezas · Score promedio: {promedio}
            {sinCalificar > 0 && <span style={{ marginLeft: 12, color: 'var(--yellow)', fontSize: 12 }}>⚠ {sinCalificar} sin calificar</span>}
          </p>

          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Influencer</th>
                  <th>Plataforma</th>
                  <th>Tipo</th>
                  <th>Vistas</th>
                  <th>Likes</th>
                  <th>Guardados</th>
                  <th>Score</th>
                  <th>Calificación equipo</th>
                  <th>Fecha</th>
                  <th>URL</th>
                </tr>
              </thead>
              <tbody>
                {contenidos.length === 0 ? (
                  <tr><td colSpan="10" className="empty-state">Sin contenidos aún</td></tr>
                ) : contenidos.map(c => (
                  <FilaContenido key={c.id} c={c} />
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ── ROI ───────────────────────────────────────────────────────
    function ROI() {
      const hoy = new Date().toISOString().split('T')[0];
      const hace90 = new Date(Date.now() - 90 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

      const [desde, setDesde] = useState(hace90);
      const [hasta, setHasta] = useState(hoy);
      const [resultado, setResultado] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const calcular = async () => {
        setLoading(true);
        setError(null);
        setResultado(null);
        try {
          const data = await API(`/api/roi?desde=${desde}&hasta=${hasta}`);
          setResultado(data);
        } catch(e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div>
          <h1>ROI del Programa</h1>
          <p className="page-subtitle">Compara el costo de kits enviados vs ventas de Shopify en el mismo período</p>

          <div className="roi-form">
            <div className="form-group">
              <label>Desde</label>
              <input type="date" value={desde} onChange={e => setDesde(e.target.value)} />
            </div>
            <div className="form-group">
              <label>Hasta</label>
              <input type="date" value={hasta} onChange={e => setHasta(e.target.value)} />
            </div>
            <button className="btn btn-primary" onClick={calcular} disabled={loading}>
              {loading ? 'Calculando...' : 'Calcular ROI'}
            </button>
          </div>

          {error && <div className="error-msg">{error}</div>}

          {resultado && (
            <div>
              <div className="stat-grid">
                <StatCard
                  label="Ventas Shopify"
                  value={fmtCOP(resultado.ventas)}
                  sub={`${fmt(resultado.totalOrdenes)} órdenes pagadas`}
                  color="green"
                />
                <StatCard
                  label="Costo Kits"
                  value={fmtCOP(resultado.costoKits)}
                  sub={`${fmt(resultado.influenciasEnviadas)} kits enviados en el período`}
                  color="gold"
                />
                <StatCard
                  label="ROI Global"
                  value={resultado.roi}
                  sub={resultado.roi !== 'N/A' ? `Por cada $1 invertido en kits, se vendieron $${resultado.costoKits > 0 ? (resultado.ventas / resultado.costoKits).toFixed(1) : '—'}` : 'Sin kits enviados en el período'}
                  color={resultado.roi !== 'N/A' ? 'purple' : ''}
                />
              </div>

              <div style={{ background: 'var(--bg2)', border: '1px solid var(--border)', borderRadius: 12, padding: '16px 20px', marginTop: 8 }}>
                <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 8 }}>Nota sobre el cálculo</div>
                <p style={{ fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.6 }}>
                  El <strong style={{ color: 'var(--text)' }}>costo de kits</strong> incluye influencers con <code>fecha_envio</code> dentro del período seleccionado.
                  Las <strong style={{ color: 'var(--text)' }}>ventas</strong> son el total de órdenes pagadas en Shopify en ese mismo rango — no atribución directa.
                  Para atribución por influencer, asigna un código de descuento desde el detalle de cada influencer.
                </p>
              </div>
            </div>
          )}

          {!resultado && !loading && (
            <div className="empty-state" style={{ marginTop: 40 }}>
              Selecciona un período y haz clic en "Calcular ROI"
            </div>
          )}
        </div>
      );
    }

    // ── NOTIFICACIONES ────────────────────────────────────────────
    const TEMPLATES = [
      {
        value: 'bienvenida_kit',
        label: 'Bienvenida con Kit',
        tag: 'Automático al enviar kit',
        tagColor: 'var(--green)',
        desc: 'Se envía cuando el admin despacha el kit. Incluye link de reporte y código de descuento.',
        preview: '📦 Hola [Nombre]! Tu kit de Brujería Capilar ya está en camino. Link de reporte: [...] Código: [CODIGO]',
      },
      {
        value: 'recordatorio',
        label: 'Recordatorio de Contenido',
        tag: 'Automático los lunes',
        tagColor: 'var(--yellow)',
        desc: 'Recuerda que debe publicar su reseña. Se dispara automáticamente cada lunes por Railway cron.',
        preview: '⏰ Hola [Nombre]! Han pasado [N] días desde que recibiste tu kit. Tu fecha límite es el [Fecha]...',
      },
      {
        value: 'ideas',
        label: 'Ideas de Contenido',
        tag: 'Automático a los 4 días del envío',
        tagColor: 'var(--blue)',
        desc: 'Se envía 4 días después de despachar el kit con ideas e inspiración para crear contenido.',
        preview: '🌙 Hola [Nombre]! Tu kit ya debe estar llegando. Aquí van ideas para tu contenido...',
      },
      {
        value: 'feedback_contenido',
        label: 'Feedback de Contenido',
        tag: 'Automático al recibir contenido',
        tagColor: 'var(--purple-light)',
        desc: 'Confirma que se recibió el contenido y le muestra su score y nivel actual.',
        preview: '✨ Hola [Nombre]! Recibimos tu contenido. Tu score: [N]/100 puntos. Nivel: [Nivel]. ¡Sigue así!',
      },
    ];

    // Templates únicos que no se pueden reenviar
    const TEMPLATES_UNICOS = ['bienvenida_kit', 'recordatorio']; // recordatorio es semanal pero lo mostramos

    function Notificaciones() {
      const [influencers, setInfluencers] = useState([]);
      const [notifMap, setNotifMap] = useState({}); // { influencer_id: [template_name, ...] }
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [template, setTemplate] = useState('bienvenida_kit');
      const [destinatarios, setDestinatarios] = useState('all');
      const [seleccionados, setSeleccionados] = useState([]);
      const [sending, setSending] = useState(false);
      const [resultado, setResultado] = useState(null);
      const [sendError, setSendError] = useState(null);

      useEffect(() => {
        Promise.all([
          API('/api/influencers/con-telefono'),
          API('/api/influencers/notificaciones-todas'),
        ])
          .then(([inf, notifs]) => {
            setInfluencers(inf);
            setNotifMap(notifs);
          })
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      }, []);

      const templateMeta = template === 'bienvenida_kit' ? 'bienvenida_club_brujeria'
        : template === 'recordatorio' ? 'explicacion_contenido_brujeria'
        : template === 'ideas' ? 'ideas_contenido_brujeria1'
        : template === 'feedback_contenido' ? 'feedback_contenido_brujeria'
        : null;

      const yaRecibio = (infId) => templateMeta && (notifMap[infId] || []).includes(templateMeta);
      const pendientesCount = influencers.filter(i => !yaRecibio(i.id)).length;

      const toggleSeleccion = (id) => {
        setSeleccionados(prev =>
          prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]
        );
      };

      const enviar = async () => {
        setSending(true);
        setSendError(null);
        setResultado(null);
        try {
          const ids = destinatarios === 'all' ? 'all' : seleccionados;
          if (ids !== 'all' && ids.length === 0) {
            setSendError('Selecciona al menos una influencer');
            setSending(false);
            return;
          }
          const data = await POSTJSON('/api/admin/notificaciones', { influencer_ids: ids, template });
          setResultado(data);
        } catch (e) {
          setSendError(e.message);
        } finally {
          setSending(false);
        }
      };

      const tpl = TEMPLATES.find(t => t.value === template);
      const enviadas = resultado?.resultados?.filter(r => r.ok) || [];
      const skipped = resultado?.resultados?.filter(r => !r.ok && r.skipped) || [];
      const fallidas = resultado?.resultados?.filter(r => !r.ok && !r.skipped) || [];

      return (
        <div>
          <h1>Notificaciones WhatsApp</h1>
          <p className="page-subtitle">Envía mensajes directos a las influencers desde el dashboard</p>

          {error && <div className="error-msg">{error}</div>}

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
            {/* Configuración */}
            <div className="detail-card">
              <h3>Configurar Envío</h3>

              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 12, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.4px', marginBottom: 8 }}>Template</div>
                {TEMPLATES.map(t => (
                  <label key={t.value} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '10px 12px', borderRadius: 8, border: `1px solid ${template === t.value ? 'var(--purple)' : 'var(--border)'}`, background: template === t.value ? 'rgba(124,58,237,0.1)' : 'transparent', cursor: 'pointer', marginBottom: 8 }}>
                    <input type="radio" name="template" value={t.value} checked={template === t.value} onChange={() => setTemplate(t.value)} style={{ accentColor: 'var(--purple)', marginTop: 2 }} />
                    <div style={{ flex: 1 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 3 }}>
                        <span style={{ fontWeight: 600, fontSize: 13 }}>{t.label}</span>
                        <span style={{ fontSize: 10, padding: '1px 7px', borderRadius: 99, background: 'rgba(0,0,0,0.3)', color: t.tagColor, border: `1px solid ${t.tagColor}`, whiteSpace: 'nowrap' }}>{t.tag}</span>
                      </div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 4 }}>{t.desc}</div>
                      {template === t.value && (
                        <div style={{ fontSize: 11, color: 'var(--text-muted)', background: 'var(--bg3)', borderRadius: 6, padding: '6px 10px', fontStyle: 'italic', lineHeight: 1.5 }}>
                          {t.preview}
                        </div>
                      )}
                    </div>
                  </label>
                ))}
              </div>

              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 12, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.4px', marginBottom: 8 }}>Destinatarias</div>
                <select value={destinatarios} onChange={e => { setDestinatarios(e.target.value); setSeleccionados([]); }} style={{ width: '100%' }}>
                  <option value="all">Todas las influencers con teléfono ({loading ? '...' : influencers.length})</option>
                  <option value="seleccion">Selección manual</option>
                </select>
              </div>

              {sendError && <div className="error-msg" style={{ marginBottom: 12 }}>{sendError}</div>}

              <button className="btn btn-primary" onClick={enviar} disabled={sending || loading || pendientesCount === 0} style={{ width: '100%' }}>
                {sending ? 'Enviando...' : pendientesCount === 0 ? 'Todas ya recibieron este mensaje' : `Enviar a ${destinatarios === 'all' ? pendientesCount : seleccionados.filter(id => !yaRecibio(id)).length} influencers — ${tpl?.label}`}
              </button>

              <div style={{ marginTop: 10, fontSize: 12, color: 'var(--text-muted)', lineHeight: 1.5 }}>
                Solo se envía a influencers que tienen número de teléfono registrado. Si el template no está aprobado en Meta, el mensaje fallará silenciosamente.
              </div>
            </div>

            {/* Lista de selección manual / resultado */}
            <div>
              {destinatarios === 'seleccion' && !resultado && (
                <div className="detail-card">
                  <h3>Seleccionar Influencers ({seleccionados.length} seleccionadas)</h3>
                  {loading
                    ? <div className="loading" style={{ padding: 20 }}>Cargando...</div>
                    : influencers.length === 0
                      ? <div className="empty-state">Sin influencers con teléfono registrado</div>
                      : (
                        <div style={{ maxHeight: 380, overflowY: 'auto' }}>
                          {influencers.map(inf => {
                            const recibio = yaRecibio(inf.id);
                            return (
                            <label key={inf.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 4px', borderBottom: '1px solid var(--border)', cursor: recibio ? 'default' : 'pointer', opacity: recibio ? 0.5 : 1 }}>
                              <input type="checkbox" checked={seleccionados.includes(inf.id)} onChange={() => !recibio && toggleSeleccion(inf.id)} disabled={recibio} style={{ accentColor: 'var(--purple)' }} />
                              <div style={{ flex: 1 }}>
                                <div style={{ fontWeight: 500, fontSize: 13 }}>{inf.nombre}</div>
                                <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>@{inf.instagram_handle} · {inf.telefono}</div>
                              </div>
                              {recibio
                                ? <span style={{ fontSize: 10, padding: '2px 7px', borderRadius: 99, background: 'rgba(34,197,94,0.15)', color: 'var(--green)', border: '1px solid var(--green)' }}>✓ Ya enviado</span>
                                : <TierBadge tier={inf.tier} />
                              }
                            </label>
                            );
                          })}
                        </div>
                      )
                  }
                </div>
              )}

              {resultado && (
                <div className="detail-card">
                  <h3>Resultado del Envío</h3>
                  <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
                    <div style={{ background: '#052e16', border: '1px solid #166534', borderRadius: 8, padding: '10px 16px', flex: 1, textAlign: 'center' }}>
                      <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--green)' }}>{enviadas.length}</div>
                      <div style={{ fontSize: 12, color: '#86efac' }}>Enviados</div>
                    </div>
                    <div style={{ background: 'rgba(234,179,8,0.1)', border: '1px solid var(--yellow)', borderRadius: 8, padding: '10px 16px', flex: 1, textAlign: 'center' }}>
                      <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--yellow)' }}>{skipped.length}</div>
                      <div style={{ fontSize: 12, color: 'var(--yellow)' }}>Ya enviados</div>
                    </div>
                    <div style={{ background: fallidas.length > 0 ? '#450a0a' : 'var(--bg3)', border: `1px solid ${fallidas.length > 0 ? '#7f1d1d' : 'var(--border)'}`, borderRadius: 8, padding: '10px 16px', flex: 1, textAlign: 'center' }}>
                      <div style={{ fontSize: 24, fontWeight: 700, color: fallidas.length > 0 ? 'var(--red)' : 'var(--text-muted)' }}>{fallidas.length}</div>
                      <div style={{ fontSize: 12, color: fallidas.length > 0 ? '#fca5a5' : 'var(--text-muted)' }}>Fallidos</div>
                    </div>
                  </div>

                  <div style={{ maxHeight: 300, overflowY: 'auto' }}>
                    {resultado.resultados.map((r, i) => (
                      <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', borderBottom: '1px solid var(--border)', fontSize: 13, opacity: r.skipped ? 0.6 : 1 }}>
                        <span style={{ color: r.ok ? 'var(--green)' : r.skipped ? 'var(--yellow)' : 'var(--red)', fontWeight: 700 }}>{r.ok ? '✓' : r.skipped ? '—' : '✗'}</span>
                        <span style={{ flex: 1 }}>{r.nombre}</span>
                        {r.skipped && <span style={{ fontSize: 11, color: 'var(--yellow)' }}>Ya recibido antes</span>}
                        {!r.ok && !r.skipped && <span style={{ fontSize: 11, color: 'var(--red)' }}>{r.error}</span>}
                      </div>
                    ))}
                  </div>

                  <button className="btn btn-secondary" style={{ marginTop: 16, width: '100%' }} onClick={() => setResultado(null)}>
                    Nuevo envío
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ── CANDIDATAS TIKTOK ─────────────────────────────────────────
    const STATUS_CANDIDATA = ['candidata', 'revisada', 'contactada', 'descartada', 'registrada'];
    const COL_SCORE_COLOR = (s) => s >= 50 ? '#16a34a' : s >= 20 ? '#d97706' : '#dc2626';
    const COL_SCORE_LABEL = (s) => s >= 50 ? '🇨🇴 Alta' : s >= 20 ? '🌎 Media' : '❓ Baja';

    function Candidatas() {
      const [candidatas, setCandidatas] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [filtroStatus, setFiltroStatus] = useState('candidata');
      const [filtroColombia, setFiltroColombia] = useState('');
      const [filtroTier, setFiltroTier] = useState('');
      const [actualizando, setActualizando] = useState(null);

      function cargar() {
        setLoading(true);
        const params = new URLSearchParams();
        if (filtroStatus) params.set('status', filtroStatus);
        if (filtroColombia) params.set('min_colombia_score', filtroColombia);
        if (filtroTier) params.set('tier', filtroTier);
        API(`/api/candidatas?${params}`)
          .then(setCandidatas)
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      }

      useEffect(() => { cargar(); }, [filtroStatus, filtroColombia, filtroTier]);

      async function cambiarStatus(id, status) {
        setActualizando(id);
        try {
          await POSTJSON(`/api/candidatas/${id}`, { status }, 'PATCH');
          setCandidatas(prev => prev.map(c => c.id === id ? { ...c, status } : c));
        } catch (e) { alert('Error: ' + e.message); }
        finally { setActualizando(null); }
      }

      async function aprobar(id, handle) {
        if (!confirm(`¿Aprobar a @${handle} como influencer Prospectada?`)) return;
        setActualizando(id);
        try {
          await POSTJSON(`/api/candidatas/${id}/aprobar`, {});
          setCandidatas(prev => prev.map(c => c.id === id ? { ...c, status: 'registrada' } : c));
          alert(`✅ @${handle} agregada como influencer. La puedes ver en la sección Influencers.`);
        } catch (e) { alert('Error: ' + e.message); }
        finally { setActualizando(null); }
      }

      const pendientes = candidatas.filter(c => c.status === 'candidata').length;

      return (
        <div>
          <h1>Candidatas TikTok</h1>
          <p className="page-subtitle">
            {candidatas.length} perfiles
            {pendientes > 0 && <span style={{ marginLeft: 12, color: 'var(--yellow)', fontSize: 12 }}>⚠ {pendientes} sin revisar</span>}
          </p>

          {/* Filtros */}
          <div className="filter-bar" style={{ marginBottom: 20 }}>
            <select value={filtroStatus} onChange={e => setFiltroStatus(e.target.value)}>
              <option value="">Todos los estados</option>
              {STATUS_CANDIDATA.map(s => <option key={s}>{s}</option>)}
            </select>
            <select value={filtroColombia} onChange={e => setFiltroColombia(e.target.value)}>
              <option value="">Todos los scores Colombia</option>
              <option value="50">🇨🇴 Alta confianza (50+)</option>
              <option value="20">🌎 Media o alta (20+)</option>
            </select>
            <select value={filtroTier} onChange={e => setFiltroTier(e.target.value)}>
              <option value="">Todos los tiers</option>
              <option>Nano</option>
              <option>Micro</option>
              <option>Macro</option>
            </select>
            {(filtroStatus || filtroColombia || filtroTier) && (
              <button className="btn btn-secondary btn-sm" onClick={() => { setFiltroStatus('candidata'); setFiltroColombia(''); setFiltroTier(''); }}>Limpiar</button>
            )}
          </div>

          {loading && <div className="loading">Cargando candidatas...</div>}
          {error && <div className="error-msg">{error}</div>}

          {!loading && !error && (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Handle TikTok</th>
                    <th>Seguidores</th>
                    <th>Vistas prom.</th>
                    <th>Colombia</th>
                    <th>Tier</th>
                    <th>Nichos</th>
                    <th>Hashtags origen</th>
                    <th>Estado</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
                  {candidatas.length === 0 ? (
                    <tr><td colSpan="9" className="empty-state">Sin candidatas — corre el scraper primero</td></tr>
                  ) : candidatas.map(c => (
                    <tr key={c.id}>
                      <td>
                        <a href={`https://tiktok.com/@${c.tiktok_handle}`} target="_blank" rel="noreferrer"
                          style={{ color: 'var(--purple-light)', fontWeight: 600, fontSize: 13 }}>
                          @{c.tiktok_handle}
                        </a>
                        {c.nombre_display && c.nombre_display !== c.tiktok_handle && (
                          <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>{c.nombre_display}</div>
                        )}
                      </td>
                      <td style={{ fontWeight: 600 }}>{fmt(c.seguidores)}</td>
                      <td>{fmt(c.vistas_promedio)}</td>
                      <td>
                        <span style={{ color: COL_SCORE_COLOR(c.colombia_score || 0), fontWeight: 600, fontSize: 12 }}>
                          {COL_SCORE_LABEL(c.colombia_score || 0)}
                        </span>
                        <div style={{ fontSize: 10, color: 'var(--text-muted)' }}>{c.colombia_score || 0}/100</div>
                      </td>
                      <td><TierBadge tier={c.tier_estimado} /></td>
                      <td style={{ fontSize: 11, maxWidth: 140 }}>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 3 }}>
                          {(c.nichos || []).slice(0, 3).map(n => (
                            <span key={n} style={{ background: 'var(--bg-hover)', border: '1px solid var(--border)', borderRadius: 4, padding: '1px 5px', fontSize: 10 }}>{n}</span>
                          ))}
                        </div>
                      </td>
                      <td className="td-muted" style={{ fontSize: 11 }}>
                        {(c.hashtags_origen || []).map(h => `#${h}`).join(', ')}
                      </td>
                      <td>
                        <select
                          value={c.status}
                          disabled={actualizando === c.id}
                          onChange={e => cambiarStatus(c.id, e.target.value)}
                          style={{ fontSize: 11, padding: '3px 6px', borderRadius: 6, border: '1px solid var(--border)', background: 'var(--bg)', color: 'var(--text)', cursor: 'pointer' }}
                        >
                          {STATUS_CANDIDATA.map(s => <option key={s}>{s}</option>)}
                        </select>
                      </td>
                      <td>
                        {c.status !== 'registrada' && c.status !== 'descartada' && (
                          <button
                            onClick={() => aprobar(c.id, c.tiktok_handle)}
                            disabled={actualizando === c.id}
                            className="btn btn-sm"
                            style={{ background: 'var(--green)', color: 'white', border: 'none', padding: '4px 10px', borderRadius: 6, fontSize: 11, cursor: 'pointer' }}
                          >
                            Aprobar →
                          </button>
                        )}
                        {c.status === 'registrada' && <span style={{ color: 'var(--green)', fontSize: 11 }}>✓ En sistema</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ── SOLICITUDES ───────────────────────────────────────────────
    const STATUS_SOL = ['Pendiente', 'Aprobada', 'Enviada', 'Rechazada'];
    const STATUS_SOL_COLOR = { Pendiente: 'var(--yellow)', Aprobada: 'var(--green)', Enviada: 'var(--purple-light)', Rechazada: 'var(--red)' };

    function Solicitudes() {
      const [solicitudes, setSolicitudes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [actualizando, setActualizando] = useState(null);

      useEffect(() => {
        API('/api/solicitudes-reenvio')
          .then(setSolicitudes)
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      }, []);

      async function cambiarStatus(id, status) {
        setActualizando(id);
        try {
          await POSTJSON(`/api/solicitudes-reenvio/${id}`, { status }, 'PATCH');
          setSolicitudes(prev => prev.map(s => s.id === id ? { ...s, status } : s));
        } catch (e) {
          alert('Error: ' + e.message);
        } finally {
          setActualizando(null);
        }
      }

      if (loading) return <div className="loading">Cargando solicitudes...</div>;
      if (error) return <div className="error-msg">{error}</div>;

      const pendientes = solicitudes.filter(s => s.status === 'Pendiente').length;

      return (
        <div>
          <h1>Solicitudes de Producto</h1>
          <p className="page-subtitle">
            {solicitudes.length} solicitudes
            {pendientes > 0 && <span style={{ marginLeft: 12, color: 'var(--yellow)', fontSize: 12 }}>⚠ {pendientes} pendientes</span>}
          </p>

          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Influencer</th>
                  <th>Tier</th>
                  <th>Productos solicitados</th>
                  <th>Dirección confirmada</th>
                  <th>Fecha</th>
                  <th>Shopify</th>
                  <th>Estado</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody>
                {solicitudes.length === 0 ? (
