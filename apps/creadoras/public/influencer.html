<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Portal — Brujería Capilar Creadoras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #c0298b;
      --pink-light: #e83daa;
      --coral: #ff7b78;
      --cream: #fffbea;
      --cream2: #fff5f0;
      --cream3: #ffeefb;
      --white: #ffffff;
      --border: #f0d0e8;
      --border2: #ede0f5;
      --text: #1a0010;
      --text-muted: #7a4060;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --red: #dc2626;
      --red-bg: #fff1f2;
    }
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }

    /* LANDING */
    .landing {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px; text-align: center;
      background: linear-gradient(160deg, #fff0f9 0%, #fffbea 60%, #fff5f0 100%);
    }
    .landing img.logo { height: 64px; object-fit: contain; margin-bottom: 24px; }
    .landing h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px; font-weight: 800;
      color: var(--pink); margin-bottom: 10px; line-height: 1.2;
    }
    .landing p { color: var(--text-muted); font-size: 15px; margin-bottom: 36px; max-width: 380px; line-height: 1.6; }
    .landing-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

    /* LOGIN CARD */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      background: linear-gradient(160deg, #fff0f9 0%, #fffbea 100%);
    }
    .login-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%; max-width: 400px;
      box-shadow: 0 8px 40px rgba(192,41,139,0.08);
    }
    .login-card img.logo { height: 44px; object-fit: contain; margin-bottom: 20px; }
    .login-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 700;
      color: var(--text); margin-bottom: 6px;
    }
    .login-card .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
    .field input {
      width: 100%; background: var(--cream);
      border: 1.5px solid var(--border2);
      color: var(--text); padding: 11px 14px;
      border-radius: 10px; font-size: 14px; outline: none;
      font-family: 'DM Sans', sans-serif;
    }
    .field input:focus { border-color: var(--pink); background: var(--white); }

    /* BUTTONS */
    .btn {
      padding: 11px 20px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.15s; width: 100%;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-primary { background: linear-gradient(135deg, var(--pink), var(--coral)); color: white; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background: transparent; color: var(--text-muted); border: 1.5px solid var(--border); }
    .btn-secondary:hover { background: var(--cream3); color: var(--text); }
    .btn-outline {
      background: transparent; color: var(--pink); border: 2px solid var(--pink);
      width: auto; padding: 12px 28px; font-size: 15px; border-radius: 99px;
    }
    .btn-outline:hover { background: var(--pink); color: white; }
    .btn-ghost { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; }
    .btn-ghost:hover { color: var(--text); }

    /* ALERTS */
    .alert-error {
      color: var(--red); background: var(--red-bg);
      border: 1px solid #fecdd3; border-radius: 10px;
      padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
    }

    /* TOP BAR */
    .top-bar {
      background: var(--white);
      border-bottom: 1.5px solid var(--border);
      padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
      height: 56px; position: sticky; top: 0; z-index: 100;
    }
    .top-bar img.logo { height: 32px; object-fit: contain; }
    .top-bar .user-name { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .top-bar .logout-btn {
      background: none; border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text-muted); font-size: 12px; font-weight: 600;
      padding: 5px 12px; cursor: pointer; transition: all 0.15s;
    }
    .top-bar .logout-btn:hover { border-color: var(--pink); color: var(--pink); }

    /* DASHBOARD */
    .dash { padding: 24px 20px; max-width: 700px; margin: 0 auto; }
    .dash-greeting { margin-bottom: 24px; }
    .dash-greeting h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 4px;
    }
    .dash-greeting p { color: var(--text-muted); font-size: 14px; }

    /* SECTION TITLE */
    .section-title {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 12px; margin-top: 28px;
    }

    /* STAT CARDS */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 500px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
    .stat-card {
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 16px 14px;
    }
    .stat-card .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }
    .stat-card .stat-val { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-card .stat-val.pink { color: var(--pink); }
    .stat-card .stat-val.green { color: var(--green); }

    /* NIVEL CARD */
    .nivel-card {
      background: linear-gradient(135deg, #fff0f9, #fff5ea);
      border: 1.5px solid var(--border);
      border-radius: 16px; padding: 20px;
    }
    .nivel-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .nivel-emoji { font-size: 36px; }
    .nivel-info .nivel-name { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: var(--text); }
    .nivel-info .nivel-pts { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .progress-bg { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--coral)); border-radius: 4px; transition: width 0.7s; }
    .progress-label { font-size: 12px; color: var(--text-muted); }
    .progress-label strong { color: var(--pink); }

    /* CODIGO */
    .codigo-card {
      background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; padding: 20px;
    }
    .codigo-card h3 { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
    .codigo-val {
      font-size: 28px; font-weight: 800; letter-spacing: 3px;
      color: var(--pink); margin-bottom: 12px;
      background: var(--cream3); border: 1.5px dashed var(--border);
      border-radius: 10px; padding: 12px 16px; text-align: center;
    }
    .codigo-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .codigo-row:last-child { border-bottom: none; }
    .codigo-row .cr-label { color: var(--text-muted); }
    .codigo-row .cr-val { font-weight: 600; color: var(--green); }

    /* PERFIL */
    .perfil-card {
      background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; padding: 20px;
    }
    .perfil-card h3 { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
    .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--text-muted); }
    .info-val { font-weight: 600; text-align: right; }

    /* SOLICITUD PRODUCTO */
    .sol-producto { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; padding: 20px; }
    .sol-producto h3 { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
    .productos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    @media (max-width: 420px) { .productos-grid { grid-template-columns: 1fr; } }
    .producto-check { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.15s; font-size: 13px; }
    .producto-check.selected { border-color: var(--pink); background: var(--cream3); color: var(--pink); font-weight: 600; }
    .producto-check input { accent-color: var(--pink); }
    .sol-textarea { width: 100%; background: var(--cream); border: 1.5px solid var(--border2); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 13px; font-family: 'DM Sans', sans-serif; resize: vertical; min-height: 72px; outline: none; margin-bottom: 14px; }
    .sol-textarea:focus { border-color: var(--pink); background: var(--white); }
    .sol-success { background: var(--green-bg); border: 1px solid #bbf7d0; border-radius: 10px; padding: 14px 16px; color: var(--green); font-size: 13px; font-weight: 600; text-align: center; }

    /* CTA */
    .cta-subir {
      background: linear-gradient(135deg, var(--pink), var(--coral));
      border-radius: 16px; padding: 22px 20px; text-align: center;
    }
    .cta-subir h3 { font-size: 16px; font-weight: 700; color: white; margin-bottom: 6px; }
    .cta-subir p { color: rgba(255,255,255,0.88); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
    .cta-subir a {
      display: inline-block; background: white; color: var(--pink);
      padding: 10px 28px; border-radius: 99px; font-weight: 700;
      text-decoration: none; font-size: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .cta-subir a:hover { transform: translateY(-1px); }

    /* CONTENIDOS */
    .contenidos-card {
      background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden;
    }
    .contenidos-header {
      padding: 14px 20px; border-bottom: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .contenidos-header h3 { font-size: 14px; font-weight: 700; color: var(--text); }
    .contenidos-header span { font-size: 12px; color: var(--text-muted); }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 10px 16px;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px;
      color: var(--text-muted); border-bottom: 1px solid var(--border);
      background: var(--cream); font-weight: 700;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 10px 16px; font-size: 13px; }
    .td-muted { color: var(--text-muted); }

    /* SCORE BAR */
    .score-bar { display: flex; align-items: center; gap: 8px; }
    .score-bar-bg { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .score-bar-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--coral)); border-radius: 3px; }
    .score-num { font-size: 12px; color: var(--text-muted); width: 32px; text-align: right; font-weight: 600; }

    /* BADGE TIER */
    .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .badge-nano  { background: #f3f4f6; color: #374151; }
    .badge-micro { background: var(--cream3); color: var(--pink); }
    .badge-macro { background: linear-gradient(135deg, #fce7f3, #fff7ed); color: var(--pink); border: 1px solid var(--border); }

    .empty-state { text-align: center; padding: 36px 20px; color: var(--text-muted); font-size: 13px; }
    .loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 14px; }
    .divider { margin-top: 16px; text-align: center; }
    .link-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: underline; }
    .link-btn:hover { color: var(--pink); }
  </style>
</head>
<body>
  <!-- Pantalla de carga visible mientras Babel transpila el JSX -->
  <div id="babel-loading" style="
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:linear-gradient(160deg,#fff0f9 0%,#fffbea 100%);
    font-family:'Inter',sans-serif; gap:20px;
  ">
    <img src="https://brujeriacapilar.com/cdn/shop/files/Asset_57brujeria_2_b689e4cc-5724-4fae-962a-211a53578613.png?v=1751472378"
      style="height:48px;object-fit:contain;" alt="Brujería Capilar" />
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="
        width:36px;height:36px;border-radius:50%;
        border:3px solid #f0d0e8;border-top-color:#c0298b;
        animation:spin 0.8s linear infinite;
      "></div>
      <p style="color:#9b6ea0;font-size:14px;margin:0;">Cargando tu portal...</p>
    </div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>

  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const LOGO = "https://brujeriacapilar.com/cdn/shop/files/Asset_57brujeria_2_b689e4cc-5724-4fae-962a-211a53578613.png?v=1751472378";

    // ── NIVELES ────────────────────────────────────────────────────
    const NIVELES = [
      { nombre: 'Magia Naciente',  emoji: '🌱', min: 0,    max: 100,  color: '#16a34a', desc: 'Primeros pasos en el club' },
      { nombre: 'Magia Viva',      emoji: '🌸', min: 101,  max: 300,  color: '#7c3aed', desc: 'Tu magia empieza a florecer' },
      { nombre: 'Magia Profunda',  emoji: '✨', min: 301,  max: 600,  color: '#c0298b', desc: 'Contenido que enamora' },
      { nombre: 'Magia Pura',      emoji: '💜', min: 601,  max: 1000, color: '#c0298b', desc: 'Creadora de alto impacto' },
      { nombre: 'Gran Magia',      emoji: '🔮', min: 1001, max: null,  color: '#ff7b78', desc: 'Nivel máximo — beneficios exclusivos' },
    ];

    function getNivel(score) {
      const s = score || 0;
      return NIVELES.find(n => s >= n.min && (n.max === null || s <= n.max)) || NIVELES[0];
    }

    function getProgreso(score) {
      const s = score || 0;
      const idx = NIVELES.findIndex(n => s >= n.min && (n.max === null || s <= n.max));
      const nivel = NIVELES[idx];
      const next = NIVELES[idx + 1];
      if (!next) return { pct: 100, falta: 0, next: null };
      const rango = next.min - nivel.min;
      const avance = s - nivel.min;
      return { pct: Math.min(100, Math.round((avance / rango) * 100)), falta: next.min - s, next: next.nombre };
    }

    const PRODUCTOS_DISPONIBLES = [
      'Termoprotector Capilar',
      'Mascarilla Hechizo Total',
      'Crema Para Rizos 3en1',
      'Shampoo Ultra',
      'Varita Mágica',
      'Mantequilla Corporal Vainilla',
      'Mantequilla Corporal Strawberry',
      'Mantequilla Corporal Watermelon',
    ];

    function SolicitarProducto({ infData }) {
      const [paso, setPaso] = useState(1);
      const [seleccionados, setSeleccionados] = useState([]);
      const [mensaje, setMensaje] = useState('');
      const [direccion, setDireccion] = useState({
        direccion_envio: infData?.direccion_envio || '',
        ciudad: infData?.ciudad || '',
        departamento: infData?.departamento || '',
        codigo_postal: infData?.codigo_postal || '',
      });
      const [loading, setLoading] = useState(false);
      const [enviado, setEnviado] = useState(false);
      const [error, setError] = useState('');

      function toggle(p) {
        setSeleccionados(prev => prev.includes(p) ? prev.filter(x => x !== p) : [...prev, p]);
      }

      function siguientePaso(e) {
        e.preventDefault();
        if (seleccionados.length === 0) { setError('Selecciona al menos un producto'); return; }
        setError('');
        setPaso(2);
      }

      async function enviar(e) {
        e.preventDefault();
        if (!direccion.direccion_envio || !direccion.ciudad) { setError('La dirección y ciudad son obligatorias'); return; }
        setLoading(true); setError('');
        try {
          await apiFetch('/api/influencer/solicitar-producto', {
            method: 'POST',
            body: JSON.stringify({ productos: seleccionados, mensaje, direccion }),
          });
          setEnviado(true);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }

      if (enviado) {
        return (
          <div className="sol-producto">
            <div className="sol-success">
              ✓ ¡Solicitud enviada! Te avisamos cuando esté en camino 💜
            </div>
          </div>
        );
      }

      return (
        <div className="sol-producto">
          {/* Indicador de pasos */}
          <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:16}}>
            <div style={{display:'flex', alignItems:'center', gap:6}}>
              <div style={{width:22, height:22, borderRadius:'50%', background: paso >= 1 ? 'var(--pink)' : 'var(--border)', color:'white', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700}}>1</div>
              <span style={{fontSize:12, fontWeight: paso === 1 ? 700 : 400, color: paso === 1 ? 'var(--text)' : 'var(--text-muted)'}}>Productos</span>
            </div>
            <div style={{flex:1, height:1, background:'var(--border)'}} />
            <div style={{display:'flex', alignItems:'center', gap:6}}>
              <div style={{width:22, height:22, borderRadius:'50%', background: paso >= 2 ? 'var(--pink)' : 'var(--border)', color:'white', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700}}>2</div>
              <span style={{fontSize:12, fontWeight: paso === 2 ? 700 : 400, color: paso === 2 ? 'var(--text)' : 'var(--text-muted)'}}>Dirección</span>
            </div>
          </div>

          {paso === 1 && (
            <form onSubmit={siguientePaso}>
              <div style={{fontSize:13, color:'var(--text-muted)', marginBottom:12}}>¿Qué productos te gustaría recibir?</div>
              <div className="productos-grid">
                {PRODUCTOS_DISPONIBLES.map(p => (
                  <label key={p} className={`producto-check${seleccionados.includes(p) ? ' selected' : ''}`}>
                    <input type="checkbox" checked={seleccionados.includes(p)} onChange={() => toggle(p)} style={{display:'none'}} />
                    {seleccionados.includes(p) ? '✓ ' : ''}{p}
                  </label>
                ))}
              </div>
              <textarea
                className="sol-textarea"
                placeholder="¿Algo más que quieras decirnos? (opcional)"
                value={mensaje}
                onChange={e => setMensaje(e.target.value)}
              />
              {error && <div className="alert-error" style={{marginBottom:12}}>{error}</div>}
              <button className="btn btn-primary" type="submit">Continuar →</button>
            </form>
          )}

          {paso === 2 && (
            <form onSubmit={enviar}>
              <div style={{fontSize:13, color:'var(--text-muted)', marginBottom:14}}>Confirma que tu dirección de envío es correcta o corrígela.</div>
              <div className="field">
                <label>Dirección</label>
                <input value={direccion.direccion_envio} onChange={e => setDireccion(d => ({...d, direccion_envio: e.target.value}))} placeholder="Calle, carrera, número, barrio" required />
              </div>
              <div className="field">
                <label>Ciudad</label>
                <input value={direccion.ciudad} onChange={e => setDireccion(d => ({...d, ciudad: e.target.value}))} placeholder="Ciudad" required />
              </div>
              <div className="field">
                <label>Departamento</label>
                <input value={direccion.departamento} onChange={e => setDireccion(d => ({...d, departamento: e.target.value}))} placeholder="Departamento" />
              </div>
              <div className="field">
                <label>Código postal</label>
                <input value={direccion.codigo_postal} onChange={e => setDireccion(d => ({...d, codigo_postal: e.target.value}))} placeholder="Código postal (opcional)" />
              </div>
              {error && <div className="alert-error" style={{marginBottom:12}}>{error}</div>}
              <div style={{display:'flex', gap:10}}>
                <button type="button" className="btn btn-secondary" onClick={() => setPaso(1)} style={{width:'auto', padding:'10px 18px'}}>← Volver</button>
                <button className="btn btn-primary" type="submit" disabled={loading}>
                  {loading ? 'Enviando...' : 'Enviar solicitud →'}
                </button>
              </div>
            </form>
          )}
        </div>

    // ── TOKEN UTILS ────────────────────────────────────────────────
    const getToken = () => localStorage.getItem('inf_token');
    const setToken = (t) => localStorage.setItem('inf_token', t);
    const clearToken = () => localStorage.removeItem('inf_token');

    async function apiFetch(path, opts = {}) {
      const token = getToken();
      const headers = {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      };
      const res = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
      return data;
    }

    const fmtDate = (s) => s ? new Date(s).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';

    // ── LOGIN ──────────────────────────────────────────────────────
    function LoginPage({ onSuccess, onBack }) {
      const [step, setStep] = useState('email');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [password2, setPassword2] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      async function handleEmail(e) {
        e.preventDefault();
        if (!email.trim()) return;
        setLoading(true); setError('');
        try {
          const data = await apiFetch('/api/auth/check-email', {
            method: 'POST',
            body: JSON.stringify({ email: email.trim() }),
          });
          setStep(data.hasPassword ? 'login' : 'set-password');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }

      async function handleSetPassword(e) {
        e.preventDefault();
        if (password !== password2) { setError('Las contraseñas no coinciden'); return; }
        if (password.length < 6) { setError('Mínimo 6 caracteres'); return; }
        setLoading(true); setError('');
        try {
          const data = await apiFetch('/api/auth/set-password', {
            method: 'POST',
            body: JSON.stringify({ email: email.trim(), password }),
          });
          setToken(data.token);
          onSuccess(data.nombre);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }

      async function handleLogin(e) {
        e.preventDefault();
        setLoading(true); setError('');
        try {
          const data = await apiFetch('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email: email.trim(), password }),
          });
          setToken(data.token);
          onSuccess(data.nombre);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }

      const subtitles = {
        email: 'Ingresa el email con el que te registraste en el programa',
        'set-password': 'Primera vez — crea una contraseña para tu cuenta',
        login: 'Bienvenida de vuelta 💜',

      return (
        <div className="login-wrap">
          <div className="login-card">
            <img className="logo" src={LOGO} alt="Brujería Capilar" />
            <h2>{step === 'email' ? 'Entrar al portal' : step === 'set-password' ? 'Crear contraseña' : 'Iniciar sesión'}</h2>

                  <label>Tu email</label>
                  <input

                    onChange={e => setEmail(e.target.value)}
                    placeholder="tu@email.com" required autoFocus
                  />
                </div>
                <button className="btn btn-primary" type="submit" disabled={loading}>
                  {loading ? 'Verificando...' : 'Continuar →'}
                </button>
                <div className="divider">
                  <button type="button" className="link-btn" onClick={onBack}>← Volver</button>
                </div>
              </form>
            )}

            {step === 'set-password' && (
              <form onSubmit={handleSetPassword}>
                <div className="field">
                  <label>Crear Contraseña</label>
                  <input
                    type="password" value={password}
                    onChange={e => setPassword(e.target.value)}
                    placeholder="Mínimo 6 caracteres" required autoFocus
                  />
                </div>
                <div className="field">
                  <label>Confirmar Contraseña</label>
                  <input
                    type="password" value={password2}
                    onChange={e => setPassword2(e.target.value)}

                  />

                <button className="btn btn-primary" type="submit" disabled={loading}>
                  {loading ? 'Guardando...' : 'Crear cuenta y entrar →'}
                </button>
                <div className="divider">
                  <button type="button" className="link-btn" onClick={() => { setStep('email'); setError(''); }}>← Cambiar email</button>

                <div className="field">
                  <label>Contraseña</label>
                  <input
                    type="password" value={password}

                  {loading ? 'Entrando...' : 'Entrar →'}
                </button>
                <div className="divider">
                  <button type="button" className="link-btn" onClick={() => { setStep('email'); setPassword(''); setError(''); }}>← Cambiar email</button>

    // ── FORM SUBIR CONTENIDO ───────────────────────────────────────
    function SubirContenido({ onSuccess }) {
      const [abierto, setAbierto] = useState(false);
      const [form, setForm] = useState({ url: '', plataforma: 'TikTok', tipo: 'Reel', vistas: '', likes: '', guardados: '' });
      const [loading, setLoading] = useState(false);
      const [exito, setExito] = useState(null);
      const [error, setError] = useState('');

      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      async function enviar(e) {
        e.preventDefault();
        if (!form.url) { setError('La URL del contenido es obligatoria'); return; }
        setLoading(true); setError('');
        try {
          const r = await apiFetch('/api/influencer/contenido', {
            method: 'POST',
            body: JSON.stringify({
              url_contenido: form.url,
              plataforma: form.plataforma,
              tipo_contenido: form.tipo,
              vistas: parseInt(form.vistas) || 0,
              likes: parseInt(form.likes) || 0,
              guardados: parseInt(form.guardados) || 0,
            }),
          });
          setExito(r);
          onSuccess && onSuccess();
        } catch(e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

            Subir otro
          </button>
        </div>

      if (!abierto) return (
        <button onClick={() => setAbierto(true)}
          style={{width:'100%', background:'linear-gradient(135deg, var(--pink), var(--coral))', color:'white', border:'none', borderRadius:99, padding:'14px 32px', fontWeight:700, cursor:'pointer', fontSize:15}}>
          ✨ Reportar contenido publicado

      );

      return (
        <form onSubmit={enviar} style={{background:'var(--white)', border:'1.5px solid var(--border)', borderRadius:16, padding:'20px 20px 16px'}}>
          <div style={{fontWeight:700, fontSize:15, marginBottom:16, color:'var(--text)'}}>Reportar contenido</div>

          <div className="field">
            <label>URL del contenido *</label>
            <input type="url" placeholder="https://www.tiktok.com/..." value={form.url} onChange={e => set('url', e.target.value)} required />
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12}}>
            <div className="field" style={{margin:0}}>
              <label>Plataforma</label>
              <select value={form.plataforma} onChange={e => set('plataforma', e.target.value)} style={{width:'100%', padding:'10px 12px', borderRadius:10, border:'1.5px solid var(--border2)', background:'var(--cream)', fontSize:14, color:'var(--text)'}}>
                <option>TikTok</option>
                <option>Instagram</option>
                <option>YouTube</option>
              </select>
            </div>
            <div className="field" style={{margin:0}}>
              <label>Tipo</label>
              <select value={form.tipo} onChange={e => set('tipo', e.target.value)} style={{width:'100%', padding:'10px 12px', borderRadius:10, border:'1.5px solid var(--border2)', background:'var(--cream)', fontSize:14, color:'var(--text)'}}>
                <option>Reel</option>
                <option>Video</option>
                <option>TikTok</option>
                <option>Post</option>
                <option>Historia</option>
              </select>
            </div>
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginBottom:16}}>
            {[['vistas','Vistas / Reproducciones'],['likes','Likes'],['guardados','Guardados']].map(([k,l]) => (
              <div className="field" key={k} style={{margin:0}}>
                <label>{l}</label>
                <input type="number" min="0" placeholder="0" value={form[k]} onChange={e => set(k, e.target.value)} />
              </div>
            ))}
          </div>

          {error && <div style={{color:'var(--red)', fontSize:13, marginBottom:10}}>{error}</div>}

          <div style={{display:'flex', gap:10}}>
            <button type="button" onClick={() => setAbierto(false)}
              style={{flex:1, padding:'11px', borderRadius:99, border:'1.5px solid var(--border)', background:'transparent', color:'var(--text-muted)', cursor:'pointer', fontWeight:600, fontSize:14}}>
              Cancelar

            <button type="submit" disabled={loading}
              style={{flex:2, padding:'11px', borderRadius:99, border:'none', background:'linear-gradient(135deg, var(--pink), var(--coral))', color:'white', fontWeight:700, cursor:'pointer', fontSize:14, opacity: loading ? 0.7 : 1}}>
              {loading ? 'Guardando...' : 'Guardar contenido'}
            </button>
          </div>
        </form>
      );
    }

      const [ventas, setVentas] = useState(null);

      useEffect(() => {
        Promise.all([

          setData(me);
          setVentas(v);
        }).catch(err => {
          if (err.message.includes('401') || err.message.toLowerCase().includes('autorizado') || err.message.toLowerCase().includes('token')) {

            {/* CONTENIDOS */}
            <div className="section-title">Mis contenidos</div>
            <div className="contenidos-card" style={{marginBottom:32}}>
              <div className="contenidos-header">
                <h3>Historial</h3>
                <span>{contenidos.length} piezas</span>
              </div>
              {contenidos.length === 0 ? (
                <div className="empty-state">
                  Aún no has reportado contenido.<br/>
                  <span style={{color:'var(--text-muted)', fontSize:13}}>Usa el botón de arriba para reportar tu publicación.</span>
                </div>
              ) : (
                <table>
                  <thead>
                    <tr>
                      <th>Fecha</th>
                      <th>Tipo</th>
                      <th>Score</th>
                      <th>Link</th>
                    </tr>
                  </thead>
                  <tbody>
                    {contenidos.map(c => (
                      <tr key={c.id}>
                        <td className="td-muted">{fmtDate(c.fecha_submision)}</td>
                        <td>{c.tipo_contenido || '—'}</td>
                        <td>
                          {c.score_contenido != null ? (
                            <div className="score-bar">
                              <div className="score-bar-bg">
                                <div className="score-bar-fill" style={{width:`${Math.min(parseFloat(c.score_contenido), 100)}%`}} />
                              </div>
                              <span className="score-num">{parseFloat(c.score_contenido).toFixed(1)}</span>
                            </div>
                          ) : <span className="td-muted">Pendiente</span>}
                        </td>
                        <td>
                          {c.url_contenido
                            ? <a href={c.url_contenido} target="_blank" rel="noopener noreferrer" style={{color:'var(--pink)', fontWeight:600}}>Ver</a>
                            : <span className="td-muted">—</span>
                          }
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>

            {/* SUBIR CONTENIDO BOTTOM */}
            {contenidos.length > 0 && (
              <div style={{marginBottom:40}}>
                <SubirContenido onSuccess={load} />
              </div>
            )}

          </div>
        </>
      );
    }

    // ── APP ────────────────────────────────────────────────────────
    function App() {
      const [view, setView] = useState(getToken() ? 'dashboard' : 'landing');
      const [nombre, setNombre] = useState('');
      const [tallyContenido, setTallyContenido] = useState('https://tally.so/r/rjEZdo');
      const [tallyRegistro, setTallyRegistro] = useState('');

      useEffect(() => {
        fetch('/api/influencer/tally-urls')
          .then(r => r.json())
          .then(d => {
            if (d.contenido) setTallyContenido(d.contenido);
            if (d.registro) setTallyRegistro(d.registro);
          })
          .catch(() => {});
      }, []);

      function onLoginSuccess(n) {
        setNombre(n);
        setView('dashboard');
      }

      function onLogout() {
        clearToken();
        setView('landing');
        setNombre('');
      }

      if (view === 'landing') {
        return <LandingPage onLogin={() => setView('login')} tallyRegistro={tallyRegistro} />;
      }
      if (view === 'login') {
        return <LoginPage onSuccess={onLoginSuccess} onBack={() => setView('landing')} />;
      }
      return <Dashboard nombre={nombre} onLogout={onLogout} />;
    }

    // Ocultar pantalla de carga una vez que React monta
    const loadingEl = document.getElementById('babel-loading');
    if (loadingEl) loadingEl.style.display = 'none';

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
