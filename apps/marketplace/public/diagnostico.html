<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué le falta a tu marca para vender más online? · Creators Manager</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icono/icono-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icono/icono-180.png">
<meta name="theme-color" content="#0E0E0E">
<meta name="description" content="Cinco preguntas y te decimos qué le está faltando a tu marca para vender más online, con una receta concreta. Gratis y en dos minutos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  /* El diagnóstico. Pantalla completa y una pregunta a la vez: en una pauta,
     ver seis preguntas juntas es lo que hace cerrar la pestaña. */

  body { background: var(--ink); color: var(--off-white); margin: 0; }

  .barra { height: 4px; background: var(--border-dark); }
  .barra__lleno { height: 100%; background: var(--lime); transition: width .3s ease; }

  .cab { display: flex; align-items: center; justify-content: space-between;
         padding: 14px var(--pad-x); border-bottom: 2px solid var(--border-dark); }
  .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: inherit; }
  .logo__marca { font-family: var(--mono-title); font-weight: 800; font-size: 17px;
                 letter-spacing: -1px; color: var(--lime); }
  .logo__texto { font-family: var(--mono-title); font-weight: 800; font-size: 13px; letter-spacing: -.4px; }
  .cuenta { font-family: var(--mono-title); font-size: 10.5px; letter-spacing: .1em; color: var(--text-3); }

  .marco { max-width: 640px; margin: 0 auto; padding: clamp(30px, 6vw, 60px) var(--pad-x) 80px; }

  .h1 { font-family: var(--mono-title); font-weight: 800; letter-spacing: -.03em;
        font-size: clamp(26px, 6vw, 44px); line-height: 1.08; margin: 0 0 18px; }
  .bajada { font-size: clamp(15px, 2vw, 18px); line-height: 1.65; color: var(--text-2);
            max-width: 46ch; margin: 0 0 30px; }

  .num { font-family: var(--mono-title); font-size: 10.5px; font-weight: 700;
         letter-spacing: .16em; color: var(--lime); text-transform: uppercase; margin-bottom: 14px; }
  .preg { font-family: var(--mono-title); font-weight: 800; letter-spacing: -.02em;
          font-size: clamp(20px, 4vw, 30px); line-height: 1.18; margin: 0 0 8px; }
  .ayuda { font-size: 14px; color: var(--text-3); margin: 0 0 24px; }

  .ops { display: grid; gap: 10px; }
  .op { background: transparent; border: 2px solid var(--border-dark); color: var(--off-white);
        padding: 16px 18px; text-align: left; cursor: pointer; font: inherit; font-size: 15px;
        line-height: 1.4; transition: border-color .12s, background .12s; }
  .op:hover, .op:focus-visible { border-color: var(--lime); background: rgba(214,255,0,.05); outline: none; }
  .op__t { font-weight: 600; display: block; }
  .op__s { display: block; font-size: 12.5px; color: var(--text-3); margin-top: 4px; }

  .volver { background: none; border: none; color: var(--text-3); font: inherit; font-size: 13px;
            cursor: pointer; padding: 0; margin-top: 24px; text-decoration: underline; }

  /* ── El resultado ─────────────────────────────────────────────────────── */
  .veredicto { border: 2px solid var(--lime); padding: clamp(20px, 4vw, 32px); margin-bottom: 24px; }
  .veredicto__r { font-family: var(--mono-title); font-size: 10px; font-weight: 700;
                  letter-spacing: .16em; color: var(--lime); text-transform: uppercase; margin-bottom: 12px; }
  .veredicto__t { font-family: var(--mono-title); font-weight: 800; letter-spacing: -.02em;
                  font-size: clamp(20px, 4vw, 30px); line-height: 1.18; margin: 0 0 16px; }
  .veredicto__d { font-size: 15.5px; line-height: 1.7; color: var(--text-2); margin: 0; }

  /* Las cifras del sector: es lo que hace que se lea como un informe y no
     como una opinión. */
  .cifras { display: grid; gap: 2px; background: var(--border-dark); margin: 24px 0; }
  @media (min-width: 560px) { .cifras { grid-template-columns: repeat(3, 1fr); } }
  .cifra { background: var(--ink); padding: 18px 16px; }
  .cifra__n { font-family: var(--mono-title); font-weight: 800; font-size: clamp(22px, 4vw, 30px);
              line-height: 1; color: var(--lime); letter-spacing: -.03em; }
  .cifra__q { font-size: 12.5px; line-height: 1.5; color: var(--text-3); margin-top: 9px; }

  .rotulo { font-family: var(--mono-title); font-size: 10px; font-weight: 700;
            letter-spacing: .16em; text-transform: uppercase; color: var(--text-3);
            margin: 30px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-dark); }

  .manual { border: 2px solid var(--border-dark); padding: 20px; margin: 26px 0; }
  .manual__t { font-family: var(--mono-title); font-weight: 800; font-size: 16px;
               line-height: 1.3; margin-bottom: 8px; }
  .manual__d { font-size: 14px; line-height: 1.6; color: var(--text-3); margin-bottom: 14px; }

  .receta { margin: 26px 0; }
  .receta__t { font-family: var(--mono-title); font-size: 12px; font-weight: 800;
               letter-spacing: .1em; text-transform: uppercase; margin-bottom: 14px; }
  .paso { display: flex; gap: 14px; align-items: baseline; padding: 13px 0;
          border-top: 1px solid var(--border-dark); }
  .paso__n { font-family: var(--mono-title); font-weight: 800; color: var(--lime); flex-shrink: 0; }
  .paso__t { font-size: 14.5px; line-height: 1.55; color: var(--text-2); }

  .empezar { background: var(--lime); color: var(--ink); padding: 16px 18px;
             font-family: var(--mono-title); font-weight: 800; font-size: 14px;
             line-height: 1.4; margin-bottom: 26px; }

  /* ── Los datos ────────────────────────────────────────────────────────── */
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-family: var(--mono-title); font-size: 10.5px;
                 font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
                 color: var(--text-3); margin-bottom: 6px; }
  .campo input { width: 100%; background: transparent; border: 2px solid var(--border-dark);
                 color: var(--off-white); padding: 13px 14px; font: inherit; font-size: 15px; }
  .campo input:focus { border-color: var(--lime); outline: none; }
  .nota { font-size: 12.5px; color: var(--text-3); line-height: 1.6; margin: 14px 0 0; }
  .error { color: var(--magenta); font-size: 13.5px; font-weight: 700; margin-top: 12px; }
  .oculto { display: none !important; }

  .listo { border: 2px solid var(--lime); padding: clamp(22px, 4vw, 34px); text-align: center; }
  .listo__t { font-family: var(--mono-title); font-weight: 800; font-size: clamp(20px, 4vw, 28px);
              line-height: 1.2; margin: 0 0 14px; }
</style>
</head>
<body>

<div class="barra"><div class="barra__lleno" id="barra" style="width:0%"></div></div>

<header class="cab">
  <a href="/" class="logo">
    <span class="logo__marca">[C]</span>
    <span class="logo__texto">CREATORS MANAGER</span>
  </a>
  <span class="cuenta" id="cuenta"></span>
</header>

<main class="marco" id="marco"></main>

<script src="/js/pixel-meta.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let PREGUNTAS = [];
let PASO = -1;              // -1 es la portada
const R = {};
let DATOS = {};
let RESULTADO = null;

async function arrancar() {
  try {
    const d = await (await fetch('/api/diagnostico/preguntas')).json();
    PREGUNTAS = d.preguntas || [];
    pintar();
  } catch (e) {
    $('marco').innerHTML = '<p class="bajada">No pudimos cargar el diagnóstico. Recarga la página.</p>';
  }
}

function pintar() {
  // La barra avanza también en la portada: arrancar en cero absoluto hace
  // sentir que falta más de lo que falta.
  const total = PREGUNTAS.length + 2;   // portada + preguntas + datos
  $('barra').style.width = Math.round(((PASO + 1) / total) * 100) + '%';
  $('cuenta').textContent = PASO >= 0 && PASO < PREGUNTAS.length
    ? `${PASO + 1} DE ${PREGUNTAS.length}` : '';

  if (PASO === -1)                  return portada();
  if (PASO < PREGUNTAS.length)      return pregunta(PREGUNTAS[PASO]);
  if (PASO === PREGUNTAS.length)    return datos();
  return resultado();
}

function portada() {
  $('marco').innerHTML = `
    <h1 class="h1">¿QUÉ LE FALTA A TU MARCA<br>PARA VENDER MÁS ONLINE?</h1>
    <p class="bajada">
      Cinco preguntas, dos minutos, y te decimos qué está fallando y qué hacer
      al respecto. No es un catálogo disfrazado: según lo que contestes te sale
      un diagnóstico distinto.
    </p>
    <div class="ops">
      <button class="op" id="empezar"><span class="op__t">Empezar →</span></button>
    </div>
    <p class="nota">Gratis. No pedimos tarjeta ni te llamamos sin avisar.</p>`;
  $('empezar').onclick = () => { PASO = 0; pintar(); };
}

function pregunta(q) {
  $('marco').innerHTML = `
    <div class="num">Pregunta ${PASO + 1}</div>
    <h2 class="preg">${esc(q.pregunta)}</h2>
    ${q.ayuda ? `<p class="ayuda">${esc(q.ayuda)}</p>` : '<div style="height:10px"></div>'}
    <div class="ops">
      ${q.opciones.map(o => `
        <button class="op" data-v="${esc(o.v)}">
          <span class="op__t">${esc(o.t)}</span>
          ${o.sub ? `<span class="op__s">${esc(o.sub)}</span>` : ''}
        </button>`).join('')}
    </div>
    ${PASO > 0 ? '<button class="volver" id="atras">← Volver</button>' : ''}`;

  document.querySelectorAll('[data-v]').forEach(b => {
    b.onclick = () => { R[q.clave] = b.dataset.v; PASO++; pintar(); window.scrollTo(0, 0); };
  });
  const atras = $('atras');
  if (atras) atras.onclick = () => { PASO--; pintar(); };
}

/**
 * Los datos, antes del resultado.
 *
 * Se piden acá y no después porque la marca ya invirtió cinco respuestas: está
 * en el punto de más ganas de saber. Pedirlos al final, con el diagnóstico ya
 * leído, es pedirle algo a quien ya tiene lo que vino a buscar.
 *
 * A cambio hay que ser explícitos en que el resultado sale enseguida. Un
 * formulario en la mitad, sin decir qué pasa después, se lee como una trampa.
 */
function datos() {
  $('marco').innerHTML = `
    <div class="num">Último paso</div>
    <h2 class="preg">¿A nombre de qué marca hacemos el análisis?</h2>
    <p class="ayuda">Lo necesitamos para mirar tu cuenta antes de dártelo. Sale enseguida.</p>

    <div class="campo"><label>Nombre de tu marca</label>
      <input id="marca" autocomplete="organization" placeholder="Como la conoce la gente"></div>
    <div class="campo"><label>Instagram de la marca</label>
      <input id="ig" autocomplete="off" placeholder="@tumarca"></div>
    <div class="campo"><label>WhatsApp</label>
      <input id="tel" type="tel" autocomplete="tel" placeholder="300 123 4567"></div>
    <div class="campo"><label>Correo <span style="text-transform:none;letter-spacing:0;color:var(--text-3)">— opcional, para mandarte el manual</span></label>
      <input id="email" type="email" autocomplete="email"></div>

    <div class="ops"><button class="op" id="ver"
      style="border-color:var(--lime);background:var(--lime);color:var(--ink);text-align:center">
      <span class="op__t">Ver mi análisis →</span></button></div>
    <div class="error oculto" id="err"></div>

    <button class="volver" id="atras">← Volver</button>
    <p class="nota">
      No te llamamos sin avisar y puedes pedirnos que borremos tus datos cuando
      quieras — <a href="/privacidad" style="color:var(--text-2)">así los tratamos</a>.
    </p>`;

  $('atras').onclick = () => { PASO--; pintar(); };
  $('ver').onclick = guardarYSeguir;
}

async function guardarYSeguir() {
  const b = $('ver'), err = $('err');
  const marca = $('marca').value.trim();
  const ig = $('ig').value.trim();
  const tel = $('tel').value.trim();
  const email = $('email').value.trim();

  const fallo = (m) => { err.textContent = m; err.classList.remove('oculto'); return false; };
  err.classList.add('oculto');

  if (!marca) return fallo('Falta el nombre de tu marca');
  if (!ig)    return fallo('Falta el Instagram de tu marca');
  // Diez dígitos que empiezan por 3, con o sin indicativo: es lo único que
  // sirve para escribirle por WhatsApp después.
  if (!/^3\d{9}$/.test(tel.replace(/\D/g, '').replace(/^57/, ''))) {
    return fallo('El WhatsApp debe ser un celular colombiano de 10 dígitos');
  }
  if (email && !/^[^@\s]+@[^@\s]+\.\w{2,}$/.test(email)) return fallo('Ese correo no se ve bien');

  b.disabled = true;
  b.querySelector('.op__t').textContent = 'Analizando…';

  DATOS = { nombre: marca, instagram: ig, telefono: tel, email: email || null };
  try {
    await fetch('/api/diagnostico/contacto', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...DATOS, respuestas: R }),
    });
    window.pixelRegistro?.();
  } catch (e) {
    // Si falla el guardado igual se muestra el análisis: ella cumplió su parte
    // y no tiene por qué pagar un problema nuestro.
    console.warn('no se pudo guardar el contacto');
  }
  PASO++;
  pintar();
  window.scrollTo(0, 0);
}

async function resultado() {
  $('marco').innerHTML = '<p class="bajada">Leyendo tus respuestas…</p>';
  try {
    const d = await fetch('/api/diagnostico', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ respuestas: R }),
    });
    RESULTADO = await d.json();
  } catch (e) {
    $('marco').innerHTML = '<p class="bajada">No pudimos calcular tu diagnóstico. Recarga e intenta otra vez.</p>';
    return;
  }

  const r = RESULTADO;
  $('marco').innerHTML = `
    <div class="num">Análisis de ${esc(DATOS.nombre || 'tu marca')}</div>

    <div class="veredicto">
      <div class="veredicto__r">El diagnóstico</div>
      <h2 class="veredicto__t">${esc(r.titulo)}</h2>
      <p class="veredicto__d">${esc(r.diagnostico)}</p>
    </div>

    ${(r.cifras || []).length ? `
      <div class="rotulo">Los números de tu categoría</div>
      <div class="cifras">
        ${r.cifras.map(c => `
          <div class="cifra">
            <div class="cifra__n">${esc(c.n)}</div>
            <div class="cifra__q">${esc(c.q)}</div>
          </div>`).join('')}
      </div>` : ''}

    <div class="rotulo">Lo que haría yo en tu lugar</div>
    <div class="receta">
      ${(r.receta || []).map((p, i) => `
        <div class="paso">
          <span class="paso__n">${i + 1}</span>
          <span class="paso__t">${esc(p)}</span>
        </div>`).join('')}
    </div>

    <div class="empezar">${esc(r.empezar)}</div>

    <div class="manual">
      <div class="manual__t">¿Quieres el manual completo?</div>
      <div class="manual__d">
        Cómo armar una campaña con creadoras paso a paso: a cuántas contratar,
        qué pedirles exactamente, cuánto pagar y cómo saber si funcionó.
        Escrito para tu situación, no genérico.
      </div>
      <div class="ops"><button class="op" id="manual"
        style="border-color:var(--lime);background:var(--lime);color:var(--ink);text-align:center">
        <span class="op__t">Sí, mándenme el manual →</span></button></div>
      <div id="manual-listo"></div>
    </div>

    <p class="nota">
      ¿Prefieres verlo tú? Acá está <a href="/metodologia" style="color:var(--lime)">por qué esto funciona</a>
      y <a href="/marcas" style="color:var(--lime)">cómo trabajamos</a>.
    </p>`;

  $('manual').onclick = pedirManual;
}

/**
 * El manual.
 *
 * Los datos ya se guardaron en el paso anterior, así que acá solo se marca que
 * lo pidió — es una señal fuerte de interés y cambia a quién le escribe primero
 * el equipo.
 */
async function pedirManual() {
  const b = $('manual');
  b.disabled = true;
  b.querySelector('.op__t').textContent = 'Enviando…';
  try {
    await fetch('/api/diagnostico/manual', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: DATOS.email, telefono: DATOS.telefono,
                             nombre: DATOS.nombre, perfil: RESULTADO?.perfil }),
    });
  } catch (e) { /* la señal ya quedó del lado del servidor o no; no vale trabar la pantalla */ }

  $('manual-listo').innerHTML = `
    <p class="nota" style="color:var(--lime);margin-top:14px">
      Listo. Te lo mandamos ${DATOS.email ? 'al correo' : 'por WhatsApp'} hoy mismo.
    </p>`;
  b.remove();
}

arrancar();
</script>
</body>
</html>
