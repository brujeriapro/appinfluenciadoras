<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué le falta a tu marca para vender más en redes? · Creators Manager</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icono/icono-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icono/icono-180.png">
<meta name="theme-color" content="#0E0E0E">
<meta name="description" content="Cinco preguntas y te decimos qué le está faltando a tu marca para vender en redes, con una receta concreta. Gratis y en dos minutos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  /* El diagnóstico. Pantalla completa y una pregunta a la vez: en una pauta,
     ver seis preguntas juntas es lo que hace cerrar la pestaña. */

  body { background: var(--ink); color: var(--off-white); margin: 0; }

  .barra { height: 4px; background: var(--border-dark); }
  .barra__lleno { height: 100%; background: var(--lime); transition: width .3s ease; }

  .cab { display: flex; align-items: center; justify-content: space-between;
         padding: 14px var(--pad-x); border-bottom: 2px solid var(--border-dark); }
  .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: inherit; }
  .logo__marca { font-family: var(--mono-title); font-weight: 800; font-size: 17px;
                 letter-spacing: -1px; color: var(--lime); }
  .logo__texto { font-family: var(--mono-title); font-weight: 800; font-size: 13px; letter-spacing: -.4px; }
  .cuenta { font-family: var(--mono-title); font-size: 10.5px; letter-spacing: .1em; color: var(--text-3); }

  .marco { max-width: 640px; margin: 0 auto; padding: clamp(30px, 6vw, 60px) var(--pad-x) 80px; }

  .h1 { font-family: var(--mono-title); font-weight: 800; letter-spacing: -.03em;
        font-size: clamp(26px, 6vw, 44px); line-height: 1.08; margin: 0 0 18px; }
  .bajada { font-size: clamp(15px, 2vw, 18px); line-height: 1.65; color: var(--text-2);
            max-width: 46ch; margin: 0 0 30px; }

  .num { font-family: var(--mono-title); font-size: 10.5px; font-weight: 700;
         letter-spacing: .16em; color: var(--lime); text-transform: uppercase; margin-bottom: 14px; }
  .preg { font-family: var(--mono-title); font-weight: 800; letter-spacing: -.02em;
          font-size: clamp(20px, 4vw, 30px); line-height: 1.18; margin: 0 0 8px; }
  .ayuda { font-size: 14px; color: var(--text-3); margin: 0 0 24px; }

  .ops { display: grid; gap: 10px; }
  .op { background: transparent; border: 2px solid var(--border-dark); color: var(--off-white);
        padding: 16px 18px; text-align: left; cursor: pointer; font: inherit; font-size: 15px;
        line-height: 1.4; transition: border-color .12s, background .12s; }
  .op:hover, .op:focus-visible { border-color: var(--lime); background: rgba(214,255,0,.05); outline: none; }
  .op__t { font-weight: 600; display: block; }
  .op__s { display: block; font-size: 12.5px; color: var(--text-3); margin-top: 4px; }

  .volver { background: none; border: none; color: var(--text-3); font: inherit; font-size: 13px;
            cursor: pointer; padding: 0; margin-top: 24px; text-decoration: underline; }

  /* ── El resultado ─────────────────────────────────────────────────────── */
  .veredicto { border: 2px solid var(--lime); padding: clamp(20px, 4vw, 32px); margin-bottom: 24px; }
  .veredicto__r { font-family: var(--mono-title); font-size: 10px; font-weight: 700;
                  letter-spacing: .16em; color: var(--lime); text-transform: uppercase; margin-bottom: 12px; }
  .veredicto__t { font-family: var(--mono-title); font-weight: 800; letter-spacing: -.02em;
                  font-size: clamp(20px, 4vw, 30px); line-height: 1.18; margin: 0 0 16px; }
  .veredicto__d { font-size: 15.5px; line-height: 1.7; color: var(--text-2); margin: 0; }

  .receta { margin: 26px 0; }
  .receta__t { font-family: var(--mono-title); font-size: 12px; font-weight: 800;
               letter-spacing: .1em; text-transform: uppercase; margin-bottom: 14px; }
  .paso { display: flex; gap: 14px; align-items: baseline; padding: 13px 0;
          border-top: 1px solid var(--border-dark); }
  .paso__n { font-family: var(--mono-title); font-weight: 800; color: var(--lime); flex-shrink: 0; }
  .paso__t { font-size: 14.5px; line-height: 1.55; color: var(--text-2); }

  .empezar { background: var(--lime); color: var(--ink); padding: 16px 18px;
             font-family: var(--mono-title); font-weight: 800; font-size: 14px;
             line-height: 1.4; margin-bottom: 26px; }

  /* ── Los datos ────────────────────────────────────────────────────────── */
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-family: var(--mono-title); font-size: 10.5px;
                 font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
                 color: var(--text-3); margin-bottom: 6px; }
  .campo input { width: 100%; background: transparent; border: 2px solid var(--border-dark);
                 color: var(--off-white); padding: 13px 14px; font: inherit; font-size: 15px; }
  .campo input:focus { border-color: var(--lime); outline: none; }
  .nota { font-size: 12.5px; color: var(--text-3); line-height: 1.6; margin: 14px 0 0; }
  .error { color: var(--magenta); font-size: 13.5px; font-weight: 700; margin-top: 12px; }
  .oculto { display: none !important; }

  .listo { border: 2px solid var(--lime); padding: clamp(22px, 4vw, 34px); text-align: center; }
  .listo__t { font-family: var(--mono-title); font-weight: 800; font-size: clamp(20px, 4vw, 28px);
              line-height: 1.2; margin: 0 0 14px; }
</style>
</head>
<body>

<div class="barra"><div class="barra__lleno" id="barra" style="width:0%"></div></div>

<header class="cab">
  <a href="/" class="logo">
    <span class="logo__marca">[C]</span>
    <span class="logo__texto">CREATORS MANAGER</span>
  </a>
  <span class="cuenta" id="cuenta"></span>
</header>

<main class="marco" id="marco"></main>

<script src="/js/pixel-meta.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let PREGUNTAS = [];
let PASO = -1;              // -1 es la portada
const R = {};
let RESULTADO = null;

async function arrancar() {
  try {
    const d = await (await fetch('/api/diagnostico/preguntas')).json();
    PREGUNTAS = d.preguntas || [];
    pintar();
  } catch (e) {
    $('marco').innerHTML = '<p class="bajada">No pudimos cargar el diagnóstico. Recarga la página.</p>';
  }
}

function pintar() {
  // La barra avanza también en la portada: arrancar en cero absoluto hace
  // sentir que falta más de lo que falta.
  const total = PREGUNTAS.length + 1;
  $('barra').style.width = Math.round(((PASO + 1) / total) * 100) + '%';
  $('cuenta').textContent = PASO >= 0 && PASO < PREGUNTAS.length
    ? `${PASO + 1} DE ${PREGUNTAS.length}` : '';

  if (PASO === -1)                  return portada();
  if (PASO < PREGUNTAS.length)      return pregunta(PREGUNTAS[PASO]);
  return resultado();
}

function portada() {
  $('marco').innerHTML = `
    <h1 class="h1">¿QUÉ LE FALTA A TU MARCA<br>PARA VENDER EN REDES?</h1>
    <p class="bajada">
      Cinco preguntas, dos minutos, y te decimos qué está fallando y qué hacer
      al respecto. No es un catálogo disfrazado: según lo que contestes te sale
      un diagnóstico distinto.
    </p>
    <div class="ops">
      <button class="op" id="empezar"><span class="op__t">Empezar →</span></button>
    </div>
    <p class="nota">Gratis. No pedimos tarjeta ni te llamamos sin avisar.</p>`;
  $('empezar').onclick = () => { PASO = 0; pintar(); };
}

function pregunta(q) {
  $('marco').innerHTML = `
    <div class="num">Pregunta ${PASO + 1}</div>
    <h2 class="preg">${esc(q.pregunta)}</h2>
    ${q.ayuda ? `<p class="ayuda">${esc(q.ayuda)}</p>` : '<div style="height:10px"></div>'}
    <div class="ops">
      ${q.opciones.map(o => `
        <button class="op" data-v="${esc(o.v)}">
          <span class="op__t">${esc(o.t)}</span>
          ${o.sub ? `<span class="op__s">${esc(o.sub)}</span>` : ''}
        </button>`).join('')}
    </div>
    ${PASO > 0 ? '<button class="volver" id="atras">← Volver</button>' : ''}`;

  document.querySelectorAll('[data-v]').forEach(b => {
    b.onclick = () => { R[q.clave] = b.dataset.v; PASO++; pintar(); window.scrollTo(0, 0); };
  });
  const atras = $('atras');
  if (atras) atras.onclick = () => { PASO--; pintar(); };
}

async function resultado() {
  $('marco').innerHTML = '<p class="bajada">Leyendo tus respuestas…</p>';
  try {
    const d = await fetch('/api/diagnostico', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ respuestas: R }),
    });
    RESULTADO = await d.json();
  } catch (e) {
    $('marco').innerHTML = '<p class="bajada">No pudimos calcular tu diagnóstico. Recarga e intenta otra vez.</p>';
    return;
  }

  const r = RESULTADO;
  $('marco').innerHTML = `
    <div class="veredicto">
      <div class="veredicto__r">Tu diagnóstico</div>
      <h2 class="veredicto__t">${esc(r.titulo)}</h2>
      <p class="veredicto__d">${esc(r.diagnostico)}</p>
    </div>

    <div class="receta">
      <div class="receta__t">Lo que haría yo en tu lugar</div>
      ${(r.receta || []).map((p, i) => `
        <div class="paso">
          <span class="paso__n">${i + 1}</span>
          <span class="paso__t">${esc(p)}</span>
        </div>`).join('')}
    </div>

    <div class="empezar">${esc(r.empezar)}</div>

    <h3 class="preg" style="font-size:19px">¿Te lo armamos?</h3>
    <p class="ayuda">
      Déjanos tus datos y te mandamos una propuesta con creadoras concretas para
      tu marca — con nombres, lo que cobran y qué harían. Sin compromiso.
    </p>

    <div class="campo"><label>Nombre de tu marca</label><input id="marca" autocomplete="organization"></div>
    <div class="campo"><label>Tu correo</label><input id="email" type="email" autocomplete="email"></div>
    <div class="campo"><label>WhatsApp <span style="text-transform:none;letter-spacing:0">(opcional)</span></label><input id="tel" type="tel" autocomplete="tel"></div>

    <div class="ops"><button class="op" id="enviar" style="border-color:var(--lime);background:var(--lime);color:var(--ink);text-align:center">
      <span class="op__t">Quiero la propuesta →</span></button></div>
    <div class="error oculto" id="err"></div>

    <p class="nota">
      Usamos tus datos solo para mandarte esto y hablar contigo. Puedes pedirnos
      que los borremos cuando quieras — <a href="/privacidad" style="color:var(--text-2)">así los tratamos</a>.
    </p>`;

  $('enviar').onclick = enviar;
}

async function enviar() {
  const b = $('enviar'), err = $('err');
  const marca = $('marca').value.trim();
  const email = $('email').value.trim();

  err.classList.add('oculto');
  if (!marca)                     return fallo('Falta el nombre de tu marca');
  if (!/^[^@\s]+@[^@\s]+\.\w{2,}$/.test(email)) return fallo('Ese correo no se ve bien');

  b.disabled = true;
  b.querySelector('.op__t').textContent = 'Enviando…';
  try {
    await fetch('/api/diagnostico/contacto', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: marca, email, telefono: $('tel').value.trim() || null,
        respuestas: R, perfil: RESULTADO?.perfil,
      }),
    });
    window.pixelRegistro?.();
    $('marco').innerHTML = `
      <div class="listo">
        <h2 class="listo__t">Listo, ${esc(marca)}</h2>
        <p class="veredicto__d">
          Te escribimos en menos de 24 horas con una propuesta concreta: qué
          creadoras, qué harían y cuánto cuesta.
        </p>
      </div>
      <p class="nota" style="text-align:center">
        Mientras tanto puedes ver <a href="/metodologia" style="color:var(--lime)">por qué esto funciona</a>
        o <a href="/marcas" style="color:var(--lime)">cómo trabajamos</a>.
      </p>`;
  } catch (e) {
    fallo('No se pudo enviar. Revisa tu conexión e intenta otra vez.');
    b.disabled = false;
    b.querySelector('.op__t').textContent = 'Quiero la propuesta →';
  }

  function fallo(m) { err.textContent = m; err.classList.remove('oculto'); return false; }
}

arrancar();
</script>
</body>
</html>
