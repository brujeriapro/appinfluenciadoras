<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi portal · Creadores.app</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  /* Portal de la creadora. Un solo archivo para móvil y escritorio:
     bajo 900px son pestañas al pie y vistas apiladas; por encima, barra lateral
     fija y maestro-detalle. */

  body { background: var(--ink); }

  /* ── Estructura ─────────────────────────────────────────────────────────── */

  .layout { display: flex; min-height: 100vh; }

  .lateral {
    width: 246px; flex: none;
    border-right: 2px solid var(--border-dark);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .lateral__logo {
    display: flex; align-items: center; gap: 9px;
    padding: 18px 20px; border-bottom: 2px solid var(--border-dark);
  }
  .logo__marca { width: 24px; height: 24px; background: var(--lime); display: grid; place-items: center;
                 color: var(--ink); font-family: var(--mono-title); font-weight: 800; font-size: 12px; }
  .logo__texto { font-family: var(--mono-title); font-weight: 800; font-size: 13px; letter-spacing: -0.5px; }
  .lateral__rotulo { font-size: 9.5px; letter-spacing: 1.2px; color: var(--text-5);
                     padding: 16px 20px 8px; text-transform: uppercase; }

  .nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; background: none; border: none;
    border-left: 4px solid transparent;
    padding: 13px 20px; cursor: pointer;
    font-family: var(--mono-title); font-weight: 700; font-size: 11.5px;
    letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-4);
  }
  .nav-item:hover { color: var(--off-white); }
  .nav-item.activo { background: var(--surface-3); }
  .nav-item.activo[data-vista="perfil"]     { color: var(--blue-text-soft); border-left-color: var(--blue); }
  .nav-item.activo[data-vista="tarifas"]    { color: var(--lime);      border-left-color: var(--lime); }
  .nav-item.activo[data-vista="propuestas"] { color: var(--magenta);   border-left-color: var(--magenta); }
  .nav-item.activo[data-vista="entregar"]   { color: var(--off-white); border-left-color: var(--off-white); }
  .nav-item[disabled] { color: var(--text-7); cursor: not-allowed; }
  .nav-item[disabled]:hover { color: var(--text-7); }

  .badge { font-size: 10px; font-weight: 700; padding: 1px 6px; }
  .badge--magenta { background: var(--magenta); color: var(--ink); }
  .badge--plano   { color: var(--text-5); }

  /* Area de trabajo en claro: el portal se usa a diario y son formularios
     largos. La barra lateral se queda negra para que la identidad no se
     pierda, y los bloques de dinero pasan a lima solido — sobre claro
     resaltan mas que antes. */
  .principal {
    flex: 1; min-width: 0;
    padding: 26px clamp(16px, 3vw, 34px) 60px;
    background: var(--off-white);
    color: var(--ink);
  }

  .encabezado { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 22px; }
  .titulo {
    font-family: var(--mono-title); font-weight: 800;
    font-size: clamp(20px, 2.2vw, 30px); letter-spacing: -1.4px;
    text-transform: uppercase; margin: 0;
  }
  /* Sobre claro, el color va en un bloque bajo el titulo, no en la letra:
     el lima como texto sobre blanco no se lee. */
  .titulo { color: var(--ink); border-bottom: 6px solid; padding-bottom: 4px; display: inline-block; }
  .titulo--perfil     { border-bottom-color: var(--blue); }
  .titulo--tarifas    { border-bottom-color: var(--lime); }
  .titulo--propuestas { border-bottom-color: var(--magenta); }
  .titulo--entregar   { border-bottom-color: var(--ink); }
  .subtitulo { font-size: 11.5px; letter-spacing: 0.6px; color: #5A5A5A;
               text-transform: uppercase; margin: 8px 0 0; }

  .chips-info { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip-info {
    font-size: 9.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    padding: 6px 10px; border: 2px solid var(--ink); color: var(--ink);
  }
  .chip-info--lime { background: var(--lime); border-color: var(--ink); color: var(--ink); }

  /* ── Tarifas ────────────────────────────────────────────────────────────── */

  .tabla-tarifas { border-top: 2px solid var(--ink); border-left: 2px solid var(--ink); }
  .tarifa-cab, .tarifa-fila {
    display: grid; grid-template-columns: 1.3fr 90px 2fr 1fr; align-items: center;
  }
  .tarifa-cab > *, .tarifa-fila > * {
    border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    padding: 14px 16px; min-width: 0;
  }
  .tarifa-cab { background: var(--ink); }
  .tarifa-cab > * {
    font-size: 9.5px; letter-spacing: 1.2px; color: var(--off-white);
    text-transform: uppercase; font-weight: 700;
    border-right-color: var(--border-dark); border-bottom-color: var(--ink);
  }
  .tarifa-fila.apagada .col-nombre,
  .tarifa-fila.apagada .col-tarifa,
  .tarifa-fila.apagada .col-neto { opacity: .42; }

  .ent-nombre { font-family: var(--mono-title); font-weight: 700; font-size: 12.5px;
                letter-spacing: -0.2px; text-transform: uppercase; }
  .ent-sub { font-size: 9.5px; letter-spacing: 1px; color: #6A6A6A;
             text-transform: uppercase; margin-top: 4px; }

  .monto { font-family: var(--mono-title); font-weight: 800; font-size: 19px;
           letter-spacing: -1px; color: var(--ink); background: var(--lime);
           padding: 2px 7px; display: inline-block; }
  .monto--off { color: #6A6A6A; background: transparent; padding: 0;
                font-size: 12px; letter-spacing: 0.8px; }
  .neto { font-family: var(--mono-title); font-weight: 800; font-size: 18px;
          letter-spacing: -1px; color: var(--ink); }
  .neto-nota { font-size: 9.5px; letter-spacing: 1px; color: #6A6A6A;
               text-transform: uppercase; margin-top: 5px; }

  /* Interruptor cuadrado. El cuadro interior se mueve con transform para que
     tenga transición: animar justify-content no funciona. */
  .switch {
    width: 48px; height: 24px; border: 2px solid var(--ink);
    background: #fff; padding: 0; cursor: pointer; position: relative;
    display: block;
  }
  .switch__cuadro {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    background: #B4B4B4; transition: transform 120ms ease-out, background-color 120ms ease-out;
  }
  .switch[aria-checked="true"] { background: var(--lime); border-color: var(--ink); }
  .switch[aria-checked="true"] .switch__cuadro { background: var(--ink); transform: translateX(24px); }

  /* Deslizador con pista y pulgar cuadrados: el nativo trae esquinas redondas. */
  input[type=range].slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; background: #D0D0D0; padding: 0; border: none;
    cursor: pointer; margin: 10px 0 6px;
  }
  input[type=range].slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; background: var(--ink); border: none; cursor: pointer;
  }
  input[type=range].slider::-moz-range-thumb {
    width: 16px; height: 16px; background: var(--ink); border: none; border-radius: 0; cursor: pointer;
  }
  input[type=range].slider:disabled { cursor: not-allowed; }
  input[type=range].slider:disabled::-webkit-slider-thumb { background: var(--text-6); }
  .extremos { display: flex; justify-content: space-between; font-size: 9.5px;
              letter-spacing: 0.8px; color: #7A7A7A; }

  .fila-monto { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  /* El neto tiene columna propia en escritorio; en móvil se muestra esta
     versión en línea, junto al monto, como define el handoff. */
  .neto-inline { display: none; font-family: var(--mono-title); font-weight: 800;
                 font-size: 13px; letter-spacing: -0.4px; color: var(--ink); }

  /* ── Propuestas ─────────────────────────────────────────────────────────── */

  .maestro-detalle { display: flex; gap: 0; border-top: 2px solid var(--ink); }
  .lista-propuestas { width: 396px; flex: none; border-right: 2px solid var(--ink); }
  .detalle-propuesta { flex: 1; min-width: 0; padding: 22px clamp(16px, 2vw, 28px); }

  .filtros { display: flex; gap: 6px; flex-wrap: wrap; padding: 14px 16px;
             border-bottom: 2px solid var(--ink); }
  .filtro {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
    padding: 7px 11px; border: 2px solid var(--ink); background: transparent;
    color: var(--ink); cursor: pointer;
  }
  .filtro.activo { background: var(--magenta); border-color: var(--ink); color: var(--ink); }

  .fila-propuesta {
    display: block; width: 100%; text-align: left; background: none;
    border: none; border-bottom: 1px solid #D8D8D8; border-left: 4px solid transparent;
    padding: 16px; cursor: pointer; color: inherit;
  }
  .fila-propuesta:hover { background: #E8E8E8; }
  .fila-propuesta.seleccionada { background: #fff; border-left-color: var(--ink); }
  .fp-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .fp-marca { font-family: var(--mono-title); font-weight: 800; font-size: 14px;
              letter-spacing: -0.5px; text-transform: uppercase; }
  .fp-linea { font-size: 10.5px; letter-spacing: 0.8px; color: #5A5A5A;
              text-transform: uppercase; margin-top: 6px; }
  .fp-neto { display: flex; align-items: baseline; justify-content: space-between;
             gap: 10px; margin-top: 12px; }
  .fp-neto__label { font-size: 9.5px; letter-spacing: 1.2px; color: #5A5A5A; text-transform: uppercase; }
  .fp-neto__valor { font-family: var(--mono-title); font-weight: 800; font-size: 17px;
                    letter-spacing: -0.9px; color: var(--ink); }

  /* Las propuestas nuevas gritan más: borde magenta y el neto en grande. */
  .fila-propuesta.nueva { border: 2px solid var(--magenta); border-left-width: 4px; margin-bottom: -1px; }
  /* El neto de una propuesta nueva es lo mas importante de la pantalla: bloque
     lima solido, que sobre claro resalta mas que el texto lima sobre negro. */
  .fila-propuesta.nueva .destacado {
    background: var(--lime); border-left: 4px solid var(--ink);
    padding: 12px 14px; margin-top: 12px;
  }
  .fila-propuesta.nueva .fp-neto__label { color: var(--ink); }
  .fila-propuesta.nueva .fp-neto__valor { font-size: 26px; letter-spacing: -1.6px; }
  .fp-nota { font-size: 10px; letter-spacing: 0.6px; color: #3A3A3A; margin-top: 5px; }

  .pill {
    display: inline-block; padding: 4px 8px; font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.6px; text-transform: uppercase; white-space: nowrap; border: 1px solid;
  }
  .pill--nueva    { background: var(--magenta); color: var(--ink); border-color: var(--magenta); }
  .pill--aceptada { background: var(--lime);    color: var(--ink); border-color: var(--lime); }
  .pill--neutra   { background: transparent; color: #5A5A5A; border-color: #5A5A5A; }

  /* ── Detalle ────────────────────────────────────────────────────────────── */

  .det-ref { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .det-ref__texto { font-size: 10px; letter-spacing: 1.2px; color: #5A5A5A; text-transform: uppercase; }
  .det-marca { font-family: var(--mono-title); font-weight: 800;
               font-size: clamp(22px, 2.6vw, 34px); letter-spacing: -1.6px;
               text-transform: uppercase; margin: 14px 0 0; line-height: 1.05; }
  .det-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .det-chip { font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
              padding: 5px 9px; border: 2px solid var(--ink); color: var(--ink); }
  .det-chip--blue { background: var(--blue); border-color: var(--blue); color: #fff; }

  .det-rotulo { font-size: 9.5px; letter-spacing: 1.2px; color: #5A5A5A;
                text-transform: uppercase; margin: 26px 0 10px; font-weight: 700; }
  .det-brief { font-size: 13.5px; line-height: 1.75; color: var(--ink); max-width: 60ch; }

  .condiciones { display: grid; grid-template-columns: 1fr 1fr;
                 border-top: 2px solid var(--ink); border-left: 2px solid var(--ink); }
  .condiciones > div { border-right: 2px solid var(--ink);
                       border-bottom: 2px solid var(--ink); padding: 13px 15px; }
  .cond-label { font-size: 9.5px; letter-spacing: 1.1px; color: #5A5A5A; text-transform: uppercase; }
  .cond-valor { font-size: 12.5px; margin-top: 6px; }
  .cond-valor--lime { background: var(--lime); color: var(--ink); padding: 2px 6px;
                      display: inline-block; font-family: var(--mono-title); font-weight: 700; }

  .desglose { border: 2px solid var(--ink); margin-top: 26px; background: #fff; }
  .desglose__fila { display: flex; justify-content: space-between; align-items: center;
                    gap: 12px; padding: 13px 16px; border-bottom: 1px solid #D8D8D8; }
  .desglose__label { font-size: 10.5px; letter-spacing: 1px; color: #5A5A5A; text-transform: uppercase; }
  .desglose__valor { font-family: var(--mono-title); font-weight: 700; font-size: 14px; }
  .desglose__valor--resta { color: #C4106F; }
  .desglose__neto { background: var(--lime); color: var(--ink); padding: 16px; }
  .desglose__neto-label { font-size: 10.5px; letter-spacing: 1.2px; font-weight: 700; text-transform: uppercase; }
  .desglose__neto-valor { font-family: var(--mono-title); font-weight: 800;
                          font-size: 34px; letter-spacing: -2.2px; margin-top: 4px; }
  .desglose__neto-nota { font-size: 9.5px; letter-spacing: 0.8px; margin-top: 6px; text-transform: uppercase; }

  .nota-escrow { background: #EEEEFF; border-left: 4px solid var(--blue);
                 padding: 14px 16px; margin-top: 20px; font-size: 12.5px; line-height: 1.65; color: var(--ink); }

  .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; align-items: center; }
  .btn-portal {
    font-family: var(--mono-title); font-weight: 800; font-size: 12.5px; letter-spacing: 0.6px;
    padding: 15px 22px; border: 2px solid var(--ink); background: var(--ink);
    color: var(--lime); cursor: pointer; text-transform: uppercase;
  }
  .btn-portal:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn-portal:disabled { opacity: .45; cursor: not-allowed; }
  .btn-portal--ghost { background: transparent; border-color: var(--ink); color: var(--ink); }
  .btn-portal--ghost:hover { background: var(--magenta); border-color: var(--ink); color: var(--ink); }
  .btn-portal--sec { background: transparent; border-color: var(--ink); color: var(--ink);
                     font-size: 10.5px; padding: 11px 14px; }
  .btn-portal--sec:hover { background: var(--ink); color: var(--lime); }
  .nota-pie { font-size: 9.5px; letter-spacing: 1px; color: #5A5A5A; text-transform: uppercase; }

  /* ── Entregar ───────────────────────────────────────────────────────────── */

  .entregar-wrap { display: flex; gap: 26px; align-items: flex-start; }
  .entregar-main { flex: 1; min-width: 0; }
  .entregar-lado { width: 300px; flex: none; }

  .caja-dato { border: 2px solid var(--ink); padding: 14px 16px; margin-bottom: 12px; background: #fff; }
  .caja-dato__label { font-size: 9.5px; letter-spacing: 1.2px; color: #5A5A5A; text-transform: uppercase; }
  .caja-dato__valor { font-family: var(--mono-title); font-weight: 800; font-size: 22px;
                      letter-spacing: -1.2px; color: var(--ink); background: var(--lime);
                      padding: 2px 8px; display: inline-block; margin-top: 6px; }

  .input-link {
    width: 100%; background: #fff; border: 2px solid var(--ink);
    color: var(--ink); font-family: var(--mono-body); font-size: 12.5px; padding: 14px 15px;
  }
  .input-link:focus { outline: none; border-color: var(--blue); }
  .input-link::placeholder { color: #9A9A9A; }

  .check-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 12.5px; }
  .check-caja { width: 18px; height: 18px; flex: none; border: 2px solid var(--ink);
                background: #fff; display: grid; place-items: center; font-size: 11px; cursor: pointer; }
  .check-caja.ok { background: var(--lime); border-color: var(--ink); color: var(--ink); font-weight: 700; }
  .check-item.pendiente { color: #5A5A5A; }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0;
                 font-size: 10.5px; letter-spacing: 0.8px; text-transform: uppercase; color: #7A7A7A; }
  .timeline li .caja { width: 14px; height: 14px; flex: none; border: 2px solid var(--ink); background: #fff; }
  .timeline li.hecho { color: var(--ink); font-weight: 700; }
  .timeline li.hecho .caja { background: var(--lime); border-color: var(--ink); }

  /* ── Mi perfil ──────────────────────────────────────────────────────────── */

  .bloque-perfil { border: 2px solid var(--ink); padding: 18px; margin-bottom: 16px; background: #fff; }
  .bloque-perfil__titulo { font-family: var(--mono-title); font-weight: 800; font-size: 12.5px;
                           letter-spacing: -0.2px; text-transform: uppercase; margin-bottom: 4px; }
  .bloque-perfil__nota { font-size: 10.5px; letter-spacing: 0.6px; color: #5A5A5A;
                         text-transform: uppercase; margin-bottom: 16px; }

  .campo-p { margin-bottom: 14px; }
  .campo-p label { display: block; font-size: 9.5px; letter-spacing: 1.2px;
                   text-transform: uppercase; color: #5A5A5A; margin-bottom: 6px; font-weight: 700; }
  .campo-p input, .campo-p textarea, .campo-p select {
    width: 100%; background: #fff; border: 2px solid var(--ink);
    color: var(--ink); font-family: var(--mono-body); font-size: 12.5px; padding: 11px 12px;
  }
  .campo-p input:focus, .campo-p textarea:focus, .campo-p select:focus { outline: none; border-color: var(--blue); }
  .campo-p input::placeholder, .campo-p textarea::placeholder { color: #9A9A9A; }
  .campos-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

  .grupo-nicho { margin-bottom: 14px; }
  .grupo-nicho__titulo { font-size: 9.5px; letter-spacing: 1.1px; color: #5A5A5A;
                         text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
  .chips-nicho { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-n { font-size: 10.5px; padding: 6px 10px; border: 2px solid var(--ink);
            color: var(--ink); cursor: pointer; background: #fff; }
  .chip-n:hover { background: #E8E8E8; }
  .chip-n.on { background: var(--lime); border-color: var(--ink); color: var(--ink); font-weight: 700; }

  .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .pieza { border: 2px solid var(--ink); position: relative; background: #fff; }
  .pieza img, .pieza video { width: 100%; height: 150px; object-fit: cover; display: block; background: #E0E0E0; }
  .pieza__pie { padding: 8px 10px; font-size: 10px; color: #5A5A5A; display: flex;
                justify-content: space-between; align-items: center; gap: 8px;
                border-top: 2px solid var(--ink); }
  .pieza__borrar { background: none; border: none; color: #5A5A5A; cursor: pointer;
                   font-size: 14px; line-height: 1; padding: 0; }
  .pieza__borrar:hover { color: #C4106F; }
  .subir {
    border: 2px dashed var(--ink); background: #fff; display: grid; place-items: center; min-height: 186px;
    cursor: pointer; color: #5A5A5A; font-size: 11px; letter-spacing: 0.8px;
    text-align: center; padding: 12px; text-transform: uppercase;
  }
  .subir:hover { background: var(--lime); color: var(--ink); }
  .subir input { display: none; }

  .verificacion { display: flex; gap: 10px; align-items: flex-start; padding: 14px;
                  background: #EEEEFF; border-left: 4px solid var(--blue); margin-top: 14px; }
  .verificacion__texto { font-size: 11.5px; line-height: 1.6; color: var(--ink); }

  /* ── Pestañas móviles ───────────────────────────────────────────────────── */

  .tabs-movil {
    position: sticky; bottom: 0; z-index: 20; display: none;
    background: var(--surface-1); border-top: 2px solid var(--border-dark);
  }
  .tabs-movil__inner { display: grid; grid-template-columns: repeat(4, 1fr); }
  .tab-movil {
    background: transparent; border: none; padding: 14px 6px; cursor: pointer;
    font-family: var(--mono-body); font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-5);
  }
  .tab-movil.activo[data-vista="perfil"]     { background: var(--blue);     color: #fff; }
  .tab-movil.activo[data-vista="tarifas"]    { background: var(--lime);      color: var(--ink); }
  .tab-movil.activo[data-vista="propuestas"] { background: var(--magenta);   color: var(--ink); }
  .tab-movil.activo[data-vista="entregar"]   { background: var(--off-white); color: var(--ink); }

  .volver { background: none; border: none; color: var(--text-4); font-size: 18px;
            cursor: pointer; padding: 0 10px 0 0; line-height: 1; display: none; }
  .volver:hover { color: var(--lime); }

  .vacio { padding: 46px 16px; text-align: center; color: #5A5A5A; font-size: 12.5px; line-height: 1.7; }
  .aviso { border: 2px solid #C4106F; background: #FFF0F7; color: var(--ink);
           padding: 12px 14px; font-size: 12.5px; margin-bottom: 16px; }
  .aviso--ok { border-color: var(--ink); background: var(--lime); }
  .oculto { display: none !important; }

  /* ── Login ──────────────────────────────────────────────────────────────── */

  .login-wrap { display: grid; place-items: center; min-height: 100vh; padding: 20px; }

  /* Bloque claro sobre el negro de la pagina. El formulario de registro es
     largo —doce campos— y leerlo en blanco sobre negro cansa. Mismo recurso
     que la landing en la seccion "para creadoras". */
  .login {
    width: min(420px, 100%);
    background: var(--off-white);
    color: var(--ink);
    border: 2px solid var(--ink);
    padding: 28px 26px;
  }
  .login h1 { font-family: var(--mono-title); font-weight: 800; font-size: 21px;
              letter-spacing: -1.1px; margin: 0 0 4px; text-transform: uppercase; color: var(--ink); }
  .login p { font-size: 10.5px; color: #6A6A6A; margin: 0 0 22px; letter-spacing: 1px; text-transform: uppercase; }

  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 9.5px; letter-spacing: 1.2px;
                 text-transform: uppercase; color: #5A5A5A; margin-bottom: 6px; font-weight: 700; }
  .campo input, .campo select {
    width: 100%; background: #fff; border: 2px solid var(--ink);
    color: var(--ink); font-family: var(--mono-body); font-size: 12.5px; padding: 11px 12px;
  }
  .campo input:focus, .campo select:focus { outline: none; border-color: var(--blue); }
  .campo input::placeholder { color: #9A9A9A; }

  /* Sobre fondo claro el boton se invierte: negro con texto lima, como el CTA
     de la landing en su seccion clara. */
  .login .btn-portal {
    background: var(--ink); border-color: var(--ink); color: var(--lime);
  }
  .login .btn-portal:hover { background: var(--blue); border-color: var(--blue); color: #fff; }

  .error { color: #C4106F; font-size: 11.5px; margin-top: 10px; font-weight: 700; }
  .login .aviso { border-color: var(--ink); background: #fff; color: var(--ink); }
  .login .aviso--ok { border-color: var(--blue); background: #F0F0FF; }

  .cambiar-modo { background: none; border: none; color: #5A5A5A; font-size: 10.5px;
                  text-decoration: underline; cursor: pointer; margin-top: 14px; padding: 0;
                  letter-spacing: 0.6px; }
  .cambiar-modo:hover { color: var(--blue); }
  .enlaces-login { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 16px; }
  .enlaces-login .cambiar-modo { margin-top: 0; }
  .pista { font-size: 10px; line-height: 1.5; color: #6A6A6A; margin-top: 6px; }
  .acepta { display: flex; gap: 9px; align-items: flex-start; font-size: 11.5px;
            line-height: 1.5; color: #3A3A3A; margin-bottom: 16px; cursor: pointer; }
  .acepta input { width: 16px; height: 16px; flex: none; margin-top: 1px; accent-color: var(--ink); }
  .acepta a { color: var(--blue); text-decoration: underline; }

  /* Aviso de en qué punto va el perfil. Es lo primero que ve al entrar. */
  .estado-perfil { border: 2px solid var(--ink); border-left-width: 6px; padding: 14px 16px;
                   margin-bottom: 20px; background: #fff; font-size: 12.5px; line-height: 1.6; }
  .estado-perfil--bueno  { border-left-color: var(--ink); background: var(--lime); }
  .estado-perfil--accion { border-left-color: var(--magenta); }
  .estado-perfil--espera { border-left-color: var(--blue); background: #EEEEFF; }
  .estado-perfil--malo   { border-left-color: #C4106F; background: #FFF0F7; }
  .estado-perfil__titulo { font-family: var(--mono-title); font-weight: 800; font-size: 11.5px;
                           letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 6px; }

  /* ── Responsive ─────────────────────────────────────────────────────────── */

  /* Bajo 1100px el maestro-detalle no cabe: lista de 396px más un detalle
     mínimo de 340px. Se apila. */
  @media (max-width: 1100px) {
    .maestro-detalle { flex-direction: column; }
    .lista-propuestas { width: 100%; border-right: none; border-bottom: 2px solid var(--border-dark); }
    .entregar-wrap { flex-direction: column; }
    .entregar-lado { width: 100%; }
  }

  /* Bajo 900px: barra lateral fuera, pestañas al pie, y la tabla de tarifas se
     vuelve lista de tarjetas. */
  @media (max-width: 900px) {
    .lateral { display: none; }
    .tabs-movil { display: block; }
    .principal { padding: 20px 16px 30px; }
    .titulo { font-size: 21px; letter-spacing: -1.1px; }

    .tarifa-cab { display: none; }
    .tabla-tarifas { border: none; }
    .tarifa-fila {
      display: block; border: 2px solid var(--border-dark);
      border-bottom-width: 2px; margin-bottom: 10px;
    }
    .tarifa-fila > * { border: none; padding: 0; }
    .tarifa-fila .col-nombre { display: flex; justify-content: space-between;
                               align-items: flex-start; gap: 12px; padding: 14px 15px 0; }
    .tarifa-fila .col-switch { padding: 0 15px; margin-top: -34px;
                               display: flex; justify-content: flex-end; }
    .tarifa-fila .col-tarifa { padding: 10px 15px 0; }
    .tarifa-fila .col-neto { display: none; }
    .tarifa-fila .col-tarifa { padding: 10px 15px 14px; }
    .neto-inline { display: block; }
    .tarifa-fila.apagada .neto-inline { font-family: var(--mono-body); font-size: 9.5px;
                                        font-weight: 400; letter-spacing: 1px; color: var(--text-5); }
    .switch { width: 52px; height: 26px; }
    .switch__cuadro { width: 18px; height: 18px; }
    .switch[aria-checked="true"] .switch__cuadro { transform: translateX(26px); }
    .condiciones { grid-template-columns: 1fr; }
    .det-marca { font-size: 26px; }

    /* El detalle no convive con la lista: la reemplaza, y se vuelve con ←. */
    .maestro-detalle.viendo-detalle .lista-propuestas { display: none; }
    .maestro-detalle:not(.viendo-detalle) .detalle-propuesta { display: none; }
    .volver { display: inline-block; }
  }
</style>
</head>
<body>

<!-- ── Login ──────────────────────────────────────────────────────────────── -->
<div class="login-wrap" id="login-wrap">
  <form class="login" id="login-form">
    <h1 id="login-titulo">Mi portal</h1>
    <p id="login-sub">CREADORES.APP</p>

    <!-- Campos que solo pide el registro -->
    <div id="campos-registro" class="oculto">
      <div class="campo">
        <label for="nombre">¿Cómo te llamas?</label>

      <div class="campo">

        <div class="pista">Así te ven las marcas. No pongas tu @usuario: tu identidad se revela solo cuando cierras un trato.</div>
      </div>

      </div>
      <div class="campo">
        <label for="tiktok">Tu TikTok (opcional)</label>

<script>
// ── Sesión ──────────────────────────────────────────────────────────────────

let TOKEN = sessionStorage.getItem('mk_creadora') || null;
let modoPrimeraVez = false;

async function api(ruta, opciones = {}) {
  const res = await fetch('/api/creadoras' + ruta, {
    ...opciones,
    headers: {
      'Authorization': 'Bearer ' + TOKEN,
      'Content-Type': 'application/json',
      ...(opciones.headers || {}),
    },
  });
  if (res.status === 401) {
    sessionStorage.removeItem('mk_creadora');
    location.reload();
    throw new Error('Sesión vencida');
  }
  const texto = await res.text();
  const datos = texto ? JSON.parse(texto) : null;
  if (!res.ok) throw new Error((datos && datos.error) || 'Error ' + res.status);
  return datos;
}

async function publico(ruta, cuerpo) {
  const res = await fetch('/api/creadoras' + ruta, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(cuerpo),
  });
  const datos = await res.json();
  if (!res.ok) throw new Error(datos.error || 'Error');
  return datos;
}

const $ = (id) => document.getElementById(id);

// Cuatro modos en una sola pantalla: entrar, registrarse, primera vez y
// recuperar. Menos pantallas que mantener y menos formas de perderse.
let modo = 'login';

const TEXTOS = {
  login:     { titulo: 'Mi portal',        sub: 'CREADORES.APP',              btn: 'ENTRAR →' },
  registro:  { titulo: 'Crear mi perfil',  sub: 'GRATIS · SIN EXCLUSIVIDAD',  btn: 'CREAR MI PERFIL →' },
  primera:   { titulo: 'Crear contraseña', sub: 'PARA QUIEN YA TIENE PERFIL', btn: 'CREAR Y ENTRAR →' },
  olvide:    { titulo: 'Recuperar acceso', sub: 'TE MANDAMOS UN ENLACE',      btn: 'ENVIARME EL ENLACE →' },
  recuperar: { titulo: 'Nueva contraseña', sub: 'ESCOGE UNA NUEVA',           btn: 'GUARDAR Y ENTRAR →' },
};

function pintarModo() {
  const t = TEXTOS[modo];
  $('login-titulo').textContent = t.titulo;
  $('login-sub').textContent = t.sub;
  $('login-btn').textContent = t.btn;
  $('campos-registro').classList.toggle('oculto', modo !== 'registro');
  $('acepta-wrap').classList.toggle('oculto', modo !== 'registro');
  $('campo-clave').classList.toggle('oculto', modo === 'olvide');
  $('email').closest('.campo').classList.toggle('oculto', modo === 'recuperar');
  $('clave').required = modo !== 'olvide';
  $('label-clave').textContent = ['registro', 'primera', 'recuperar'].includes(modo)
    ? 'Escoge tu contraseña (mínimo 8)' : 'Tu contraseña';
  $('login-error').classList.add('oculto');
  document.querySelectorAll('.enlaces-login .cambiar-modo').forEach(b => {
    b.classList.toggle('oculto', b.dataset.modo === modo);
  });
}

document.querySelectorAll('.enlaces-login .cambiar-modo').forEach(b => {
  b.addEventListener('click', () => {
    modo = b.dataset.modo === modo ? 'login' : b.dataset.modo;
    pintarModo();
  });
});

// La lista de países vive en la configuración del servidor: si mañana se abre
// otro país, no hay que tocar este archivo.
let PAISES = [];
let DEPTOS_CO = [];

/**
 * En Colombia, departamento y ciudad son listas cerradas; fuera, campo libre.
 *
 * Escrito a mano, la misma ciudad llega como "Medellin", "medellin", "Medellín"
 * y "Medellin, Antioquia", y el filtro del catálogo deja de servir. Con lista,
 * filtrar funciona. Para los otros 19 países no tenemos listas confiables, y
 * una incompleta sería peor que un campo abierto.
 */
function ciudadElegida() {
  const sel = $('ciudad-sel');
  const libre = $('ciudad');
  if (sel && !sel.classList.contains('oculto') && sel.value && sel.value !== 'Otra') {
    return sel.value;
  }
  return libre ? libre.value : '';
}

function pintarUbicacion() {
  const pais = $('pais')?.value;
  const esCO = pais === 'CO';
  const campoDepto = $('campo-depto');
  const selCiudad = $('ciudad-sel');
  const inputCiudad = $('ciudad');
  if (!campoDepto || !selCiudad || !inputCiudad) return;

  campoDepto.classList.toggle('oculto', !esCO);
  selCiudad.classList.toggle('oculto', !esCO);
  inputCiudad.classList.toggle('oculto', esCO);

  if (!esCO) return;

  if (!$('departamento').options.length) {
    $('departamento').innerHTML = '<option value="">Elige tu departamento</option>' +
      DEPTOS_CO.map(d => `<option value="${d.nombre}">${d.nombre}</option>`).join('');
  }
  pintarCiudades();
}

function pintarCiudades() {
  const depto = DEPTOS_CO.find(d => d.nombre === $('departamento').value);
  const sel = $('ciudad-sel');
  if (!depto) {
    sel.innerHTML = '<option value="">Elige primero el departamento</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = (depto.ciudades || []).map(c => `<option value="${c}">${c}</option>`).join('');
  // "Otra" abre el campo libre: hay más de mil municipios y la lista solo trae
  // los principales.
  sel.onchange = () => {
    const otra = sel.value === 'Otra';
    $('ciudad').classList.toggle('oculto', !otra);
    if (otra) $('ciudad').focus();
  };
  $('ciudad').classList.add('oculto');
}

fetch('/api/creadoras/paises')
  .then(r => r.json())
  .then(d => {
    PAISES = d.paises || [];
    DEPTOS_CO = d.departamentos_co || [];
    const sel = $('pais');
    if (sel) {
      sel.innerHTML = PAISES.map(p =>
        `<option value="${p.codigo}">${p.nombre}</option>`).join('');
      sel.addEventListener('change', pintarUbicacion);
    }
    $('departamento')?.addEventListener('change', pintarCiudades);
    pintarUbicacion();
  })
  .catch(() => {});

// El correo de recuperación trae el token en el ancla de la URL.
let tokenReset = null;
if (location.hash.startsWith('#recuperar=')) {
  tokenReset = location.hash.slice('#recuperar='.length);
  modo = 'recuperar';
  pintarModo();
}

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('login-error');
  err.classList.add('oculto');
  const btn = $('login-btn');
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'UN MOMENTO…';

  try {
    if (modo === 'registro') {
      if (!$('acepta').checked) throw new Error('Necesitas aceptar los términos');
      const r = await publico('/registro', {
        nombre_real: $('nombre').value,
        nombre_publico: $('nombre_publico').value || $('nombre').value,
        email: $('email').value,
        password: $('clave').value,
        whatsapp: $('whatsapp').value,
        pais: $('pais').value,
        instagram: $('instagram').value,
        tiktok: $('tiktok').value,
        seguidores_instagram: $('seg-ig').value,
        seguidores_tiktok: $('seg-tk').value,
        departamento: $('campo-depto').classList.contains('oculto') ? null : $('departamento').value,
        ciudad: ciudadElegida(),
        acepta_terminos: true,
      });
      TOKEN = r.token;
    } else if (modo === 'olvide') {
      await publico('/olvide-clave', { email: $('email').value });
      err.className = 'aviso aviso--ok';
      err.textContent = 'Si ese correo tiene cuenta, te llega el enlace en un momento. Revisa también el spam.';
      err.classList.remove('oculto');
      return;
    } else if (modo === 'recuperar') {
      const r = await publico('/nueva-clave', { token: tokenReset, password: $('clave').value });
      TOKEN = r.token;
      history.replaceState(null, '', location.pathname);
    } else {
      const ruta = modo === 'primera' ? '/set-password' : '/login';
      const r = await publico(ruta, { email: $('email').value, password: $('clave').value });
      TOKEN = r.token;
    }

    sessionStorage.setItem('mk_creadora', TOKEN);
    arrancar();
  } catch (e) {
    err.className = 'error';
    err.textContent = e.message;
    err.classList.remove('oculto');
  } finally {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
});

// ── Utilidades ──────────────────────────────────────────────────────────────

const COP = (v) => '$' + Math.round(Number(v) || 0).toLocaleString('es-CO');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fechaCorta = (f) => f ? new Date(f).toLocaleDateString('es-CO', { day: '2-digit', month: 'short' }).toUpperCase() : '—';

// El neto se calcula igual que en el backend: se redondea la COMISIÓN y se
// resta. Si aquí se redondeara el neto, el número bailaría un peso respecto al
// que ella ve al aceptar, y eso destruye la confianza en una pantalla de plata.
const netoDe = (monto, pct) => Math.round(monto) - Math.round(monto * pct / 100);

const MAX_LADO = 1600;          // suficiente para verse bien en el catálogo
const MAX_SUBIDA = 10 * 1024 * 1024;

/**
 * Deja el archivo listo para subir.
 *
 * Las fotos se redibujan en un lienzo y salen como JPEG: así una foto de 8 MB
 * del celular llega pesando unos cientos de kilobytes, y cualquier formato que
 * el navegador sepa leer termina en uno que todos los navegadores saben mostrar.
 * Eso resuelve de una vez el peso y la compatibilidad.
 *
 * Los videos van tal cual: convertirlos en el navegador no es viable.
 */
function prepararArchivo(archivo) {
  return new Promise((resolve, reject) => {
    const esVideo = archivo.type.startsWith('video/');

    if (esVideo) {
      if (archivo.size > MAX_SUBIDA) {
        return reject(new Error(
          `Ese video pesa ${(archivo.size / 1024 / 1024).toFixed(1)} MB y el máximo son 10 MB. ` +
          'Súbelo más corto o baja la calidad.'
        ));
      }
      const lector = new FileReader();
      lector.onload = () => resolve({ base64: lector.result, mime: archivo.type });
      lector.onerror = () => reject(new Error('No pude leer ese video.'));
      return lector.readAsDataURL(archivo);
    }

    const url = URL.createObjectURL(archivo);
    const img = new Image();

    img.onload = () => {
      URL.revokeObjectURL(url);
      const escala = Math.min(1, MAX_LADO / Math.max(img.width, img.height));
      const lienzo = document.createElement('canvas');
      lienzo.width = Math.round(img.width * escala);
      lienzo.height = Math.round(img.height * escala);
      lienzo.getContext('2d').drawImage(img, 0, 0, lienzo.width, lienzo.height);

      const datos = lienzo.toDataURL('image/jpeg', 0.85);
      const bytes = Math.ceil((datos.length - datos.indexOf(',') - 1) * 3 / 4);
      if (bytes > MAX_SUBIDA) {
        return reject(new Error('Esa foto es demasiado grande incluso comprimida.'));
      }
      resolve({ base64: datos, mime: 'image/jpeg' });
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      // Pasa sobre todo con HEIC de iPhone: el navegador no lo sabe decodificar.
      reject(new Error(
        'No pude leer esa imagen. Si la sacaste de un iPhone, tómale una captura ' +
        'de pantalla y sube esa.'
      ));
    };

    img.src = url;
  });
}

let RANGO = { min: 50000, max: 8000000, paso: 10000 };
let HORAS_PAGO = 48;

// esto sea así, la interfaz tiene que decirlo en cada pantalla de plata.

const pill = (estado) => {

let vista = 'perfil';
let DATOS = { tarifas: null, tratos: [], perfil: null };

function marcarNav() {
  document.querySelectorAll('.nav-item, .tab-movil').forEach(b => {
    b.classList.toggle('activo', b.dataset.vista === vista);
  });
}

document.addEventListener('click', e => {
  const b = e.target.closest('.nav-item, .tab-movil');
  if (b && !b.disabled && b.dataset.vista !== 'pagos') ir(b.dataset.vista);
});

async function ir(v) {
  vista = v;
  marcarNav();
  $('principal').innerHTML = '<div class="vacio">Cargando…</div>';
  try {
    ESTADO = await api('/estado').catch(() => null);
    if (v === 'perfil') await vistaPerfil();
    else if (v === 'tarifas') await vistaTarifas();
    else if (v === 'propuestas') await vistaPropuestas();
    else if (v === 'entregar') await vistaEntregar();
  } catch (e) {
    $('principal').innerHTML = `<div class="aviso">No se pudo cargar: ${esc(e.message)}</div>`;
  }
}

let ESTADO = null;

/**
 * Aviso de en qué punto va su perfil.
 *
 * Sin esto, una creadora recién registrada pone sus tarifas, no le llega nada,
 * y se desconecta pensando que el programa no sirve. Es la diferencia entre
 * esperar sabiendo y esperar a ciegas.
 */
function avisoEstado() {
  if (!ESTADO || ESTADO.tono === 'bueno') return '';
  const titulos = {
    accion: 'Te falta un paso',
    espera: 'Estamos revisando tu perfil',
    malo:   'Tu perfil no fue aprobado',
  };
  return `
    <div class="estado-perfil estado-perfil--${ESTADO.tono}">
      <div class="estado-perfil__titulo">${titulos[ESTADO.tono] || ''}</div>
      ${esc(ESTADO.mensaje)}
    </div>`;
}

function cabecera(titulo, subtitulo, clase) {
  return `
    <div class="encabezado">
      <h1 class="titulo titulo--${clase}">${titulo}</h1>
      <p class="subtitulo">${subtitulo}</p>
      <div class="chips-info">
        <span class="chip-info">Comisión ${COMISION}%</span>
        <span class="chip-info">Retiro ${HORAS_PAGO}h</span>
      </div>
    </div>
    ${avisoEstado()}`;
}

function ciudadPerfil() {
  const sel = $('p-ciudad-sel');
  if (sel && !sel.classList.contains('oculto') && sel.value && sel.value !== 'Otra') return sel.value;
  return $('p-ciudad').value;
}

function pintarUbicacionPerfil(perfil) {
  const esCO = $('p-pais').value === 'CO';
  $('p-campo-depto').classList.toggle('oculto', !esCO);
  $('p-ciudad-sel').classList.toggle('oculto', !esCO);
  $('p-ciudad').classList.toggle('oculto', esCO);
  if (!esCO) return;

  $('p-depto').innerHTML = '<option value="">Elige tu departamento</option>' +
    DEPTOS_CO.map(d =>
      `<option value="${d.nombre}" ${perfil.departamento === d.nombre ? 'selected' : ''}>${d.nombre}</option>`
    ).join('');
  pintarCiudadesPerfil(perfil.ciudad);
}

function pintarCiudadesPerfil(ciudadActual) {
  const depto = DEPTOS_CO.find(d => d.nombre === $('p-depto').value);
  const sel = $('p-ciudad-sel');
  if (!depto) {
    sel.innerHTML = '<option value="">Elige primero el departamento</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = (depto.ciudades || []).map(c =>
    `<option value="${c}" ${c === ciudadActual ? 'selected' : ''}>${c}</option>`).join('');
  const enLista = (depto.ciudades || []).includes(ciudadActual);
  $('p-ciudad').classList.toggle('oculto', enLista);
  if (!enLista && ciudadActual) sel.value = 'Otra';
  sel.onchange = () => {
    const otra = sel.value === 'Otra';
    $('p-ciudad').classList.toggle('oculto', !otra);
  };
}

function pintarNichos() {
  $('nichos').innerHTML = TAXONOMIA.map(cat => `
    <div class="grupo-nicho">
      <div class="grupo-nicho__titulo">${esc(cat.nombre)}</div>
      <div class="chips-nicho">
        ${(cat.subnichos || []).map(sn => `
          <button type="button" class="chip-n ${NICHO_SEL.includes(sn) ? 'on' : ''}" data-n="${esc(sn)}">${esc(sn)}</button>
        `).join('')}
      </div>
    </div>`).join('');

  $('nichos').querySelectorAll('[data-n]').forEach(chip => {
    chip.addEventListener('click', () => {
      const n = chip.dataset.n;
      if (NICHO_SEL.includes(n)) {
        NICHO_SEL = NICHO_SEL.filter(x => x !== n);
      } else {
        if (NICHO_SEL.length >= 3) {
          alert('Máximo 3. Un perfil enfocado recibe más propuestas que uno que dice hacer de todo.');
          return;
        }
        NICHO_SEL.push(n);
      }
      chip.classList.toggle('on');
    });
  });
}

function pintarGaleria(muestras, maximo) {
  const piezas = muestras.map(m => `
    <div class="pieza">
      ${m.tipo === 'video'
        ? `<video src="/media/${m.id}?t=${TOKEN}" muted playsinline></video>`
        : `<img src="/media/${m.id}?t=${TOKEN}" alt="${esc(m.titulo || 'Pieza de tu trabajo')}">`}
      <div class="pieza__pie">
        <span>${esc(m.titulo || (m.tipo === 'video' ? 'Video' : 'Foto'))}</span>
        <button class="pieza__borrar" data-borrar="${m.id}" aria-label="Quitar esta pieza">✕</button>
      </div>
    </div>`).join('');

  const puedeSubir = muestras.length < maximo;
  $('galeria').innerHTML = piezas + (puedeSubir ? `
    <label class="subir">
      <input type="file" id="archivo" accept="image/*,video/mp4,video/quicktime,video/webm">
      <span>+ Subir pieza<br><span style="font-size:9.5px;color:var(--text-6)">Foto o video · máx 10 MB</span></span>
    </label>` : '');

  $('galeria').querySelectorAll('[data-borrar]').forEach(b => {
    b.addEventListener('click', async () => {
      if (!confirm('¿Quitar esta pieza de tu perfil?')) return;
      try {
        await api('/muestras/' + b.dataset.borrar, { method: 'DELETE' });
        const d = await api('/muestras');
        pintarGaleria(d.muestras, d.maximo);
      } catch (e) { alert('No se pudo: ' + e.message); }
    });
  });

  $('archivo')?.addEventListener('change', async (e) => {
    const archivo = e.target.files[0];
    if (!archivo) return;
    const msg = $('muestras-msg');
    msg.classList.add('oculto');

    try {
      msg.className = 'aviso aviso--ok';
      msg.textContent = 'Preparando la foto…';
      msg.classList.remove('oculto');

      const { base64, mime } = await prepararArchivo(archivo);

      msg.textContent = 'Subiendo…';
      await api('/muestras', {
        method: 'POST',
        body: JSON.stringify({ archivo_base64: base64, mime }),
      });
      const d = await api('/muestras');
      pintarGaleria(d.muestras, d.maximo);
      msg.classList.add('oculto');
    } catch (err) {
      msg.className = 'aviso';
      msg.textContent = err.message;
      msg.classList.remove('oculto');
    } finally {
      e.target.value = '';   // permite volver a escoger el mismo archivo
    }
  });
}

async function guardarPerfil() {
  const btn = $('btn-guardar-perfil');
  const msg = $('perfil-msg');
  msg.classList.add('oculto');
  btn.disabled = true;
  btn.textContent = 'GUARDANDO…';
  try {
    await api('/perfil', {
      method: 'PUT',
      body: JSON.stringify({
        nombre_publico: $('p-nombre').value,
        bio_corta: $('p-bio').value,
        pais: $('p-pais').value,
        whatsapp: $('p-whatsapp').value,
        instagram: $('p-ig').value,
        tiktok: $('p-tk').value,
        departamento: $('p-campo-depto').classList.contains('oculto') ? null : $('p-depto').value,
        ciudad: ciudadPerfil(),
        seguidores_instagram: $('p-seg-ig').disabled ? undefined : $('p-seg-ig').value,
        seguidores_tiktok: $('p-seg-tk').disabled ? undefined : $('p-seg-tk').value,
      }),
    });
    if (NICHO_SEL.length) {
      await api('/nichos', { method: 'PUT', body: JSON.stringify({ nicho: NICHO_SEL }) });
    }
    ESTADO = await api('/estado').catch(() => ESTADO);
    msg.className = 'aviso aviso--ok';
    msg.textContent = 'Guardado.';
    msg.classList.remove('oculto');
    // El aviso de arriba puede haber cambiado: ya no le falta lo que acaba de llenar.
    const cab = document.querySelector('.estado-perfil');
    if (cab) cab.outerHTML = avisoEstado();
  } catch (e) {
    msg.className = 'aviso';
    msg.textContent = e.message;
    msg.classList.remove('oculto');
  } finally {
    btn.disabled = false;
    btn.textContent = 'GUARDAR PERFIL →';
  }
}

let ITEMS = [];

async function vistaTarifas() {
  const d = await api('/tarifas');
  COMISION = d.comision_creadora_pct ?? 8;
  RANGO = d.rango || RANGO;
  HORAS_PAGO = d.horas_pago_tras_aprobar ?? 48;
  MONEDA_UNICA = d.moneda_unica !== false;

  const guardadas = new Map((d.tarifas || []).map(t => [t.entregable, t]));
  ITEMS = (d.entregables || []).map(e => {
    const g = guardadas.get(e.clave);
    return {
      clave: e.clave,
      nombre: e.nombre || e.clave,
      subtitulo: e.subtitulo || '',
      // Sin tarifa guardada, arranca en un valor intermedio y apagada: nadie
      // debe quedar publicada con un precio que no eligió.
      valor: g ? Number(g.precio) : 500000,
      on: g ? g.activo !== false : false,
    };
  });

  $('principal').innerHTML =
    cabecera('Mis tarifas', 'Tú pones el precio. Las marcas lo ven en tu perfil.', 'tarifas') + `
    <div class="chips-info" style="margin-bottom:18px">
      <span class="chip-info chip-info--lime" id="chip-activos"></span>
      <span class="chip-info">Rango ${COP(RANGO.min)} – ${COP(RANGO.max)}</span>
      <span class="chip-info">El neto ya descuenta la comisión</span>
      ${MONEDA_UNICA ? '<span class="chip-info">Todo en pesos colombianos (COP)</span>' : ''}
    </div>

    <div class="tabla-tarifas">
      <div class="tarifa-cab">
        <div>Entregable</div><div>Ofrezco</div><div>Tarifa</div><div>Tu neto</div>
      </div>
      <div id="filas-tarifas"></div>
    </div>

    <div class="acciones">
      <button class="btn-portal" id="btn-guardar">GUARDAR TARIFAS →</button>
      <span class="nota-pie">Los cambios se ven en tu perfil público al guardar</span>
    </div>
    <div class="error oculto" id="tarifas-msg"></div>
  `;

  pintarFilas();
  $('btn-guardar').addEventListener('click', guardarTarifas);
}

function pintarFilas() {
  $('filas-tarifas').innerHTML = ITEMS.map((it, i) => `
    <div class="tarifa-fila ${it.on ? '' : 'apagada'}" data-i="${i}">
      <div class="col-nombre">
        <div>
          <div class="ent-nombre">${esc(it.nombre)}</div>
          ${it.subtitulo ? `<div class="ent-sub">${esc(it.subtitulo)}</div>` : ''}
        </div>
      </div>
      <div class="col-switch">
        <button class="switch" role="switch" aria-checked="${it.on}"
                aria-label="Ofrecer ${esc(it.nombre)}" data-switch="${i}">
          <span class="switch__cuadro"></span>
        </button>
      </div>
      <div class="col-tarifa">
        <div class="fila-monto">
          ${it.on
            ? `<div class="monto" data-monto="${i}">${COP(it.valor)}</div>`
            : `<div class="monto monto--off">No lo ofrezco</div>`}
          <div class="neto-inline">
            ${it.on
              ? `NETO <span data-neto-inline="${i}">${COP(netoDe(it.valor, COMISION))}</span>`
              : 'OCULTO PARA MARCAS'}
          </div>
        </div>
        <input type="range" class="slider" data-slider="${i}"
               min="${RANGO.min}" max="${RANGO.max}" step="${RANGO.paso}"
               value="${it.valor}" ${it.on ? '' : 'disabled'}
               aria-label="Tarifa de ${esc(it.nombre)}"
               aria-valuetext="${COP(it.valor)}">
        <div class="extremos"><span>${COP(RANGO.min)}</span><span>${COP(RANGO.max)}</span></div>
      </div>
      <div class="col-neto">
        ${it.on
          ? `<div><div class="neto" data-neto="${i}">${COP(netoDe(it.valor, COMISION))}</div>
               <div class="neto-nota">Visible para marcas</div></div>`
          : `<div><div class="neto" style="color:var(--text-6)">—</div>
               <div class="neto-nota">Oculto para marcas</div></div>`}
      </div>
    </div>`).join('');

  const activos = ITEMS.filter(i => i.on).length;
  $('chip-activos').textContent = `${activos} de ${ITEMS.length} entregables activos`;
  $('badge-tarifas').textContent = `${activos}/${ITEMS.length}`;

  $('filas-tarifas').querySelectorAll('[data-slider]').forEach(sl => {
    sl.addEventListener('input', () => {
      const i = Number(sl.dataset.slider);
      ITEMS[i].valor = Number(sl.value);
      const m = $('filas-tarifas').querySelector(`[data-monto="${i}"]`);
      const n = $('filas-tarifas').querySelector(`[data-neto="${i}"]`);
      if (m) m.textContent = COP(ITEMS[i].valor);
      if (n) n.textContent = COP(netoDe(ITEMS[i].valor, COMISION));
      const ni = $('filas-tarifas').querySelector(`[data-neto-inline="${i}"]`);
      if (ni) ni.textContent = COP(netoDe(ITEMS[i].valor, COMISION));
      sl.setAttribute('aria-valuetext', COP(ITEMS[i].valor));
    });
  });

  $('filas-tarifas').querySelectorAll('[data-switch]').forEach(sw => {
    sw.addEventListener('click', () => {
      const i = Number(sw.dataset.switch);
      ITEMS[i].on = !ITEMS[i].on;
      pintarFilas();
    });
  });
}

async function guardarTarifas() {
  const msg = $('tarifas-msg');
  msg.classList.add('oculto');
  const btn = $('btn-guardar');
  btn.disabled = true;
  btn.textContent = 'GUARDANDO…';
  try {
    const r = await api('/tarifas', {
      method: 'PUT',
      body: JSON.stringify({
        tarifas: ITEMS.map(i => ({ entregable: i.clave, precio: i.valor, activo: i.on })),
      }),
    });
    msg.className = 'aviso aviso--ok';
    msg.textContent = r.tarifa_min
      ? `Listo. Las marcas te ven desde ${COP(r.tarifa_min)}.`
      : 'Listo. Como no dejaste ningún entregable activo, tu perfil no aparece en el catálogo.';
    msg.classList.remove('oculto');
  } catch (e) {
    msg.className = 'aviso';
    msg.textContent = e.message;
    msg.classList.remove('oculto');
  } finally {
    btn.disabled = false;
    btn.textContent = 'GUARDAR TARIFAS →';
  }
}

  badge.classList.toggle('oculto', nuevas === 0);

  $('principal').innerHTML =
    cabecera('Mis propuestas', 'El neto es lo que te queda a ti. Nunca aceptes sin verlo.', 'propuestas') + `
    <div class="maestro-detalle">
      <div class="lista-propuestas">
        <div class="filtros">
          <button class="filtro ${filtro === 'nuevas' ? 'activo' : ''}" data-f="nuevas">Nuevas ${cuenta('nuevas')}</button>
          <button class="filtro ${filtro === 'aceptadas' ? 'activo' : ''}" data-f="aceptadas">Aceptadas ${cuenta('aceptadas')}</button>
          <button class="filtro ${filtro === 'pagadas' ? 'activo' : ''}" data-f="pagadas">Pagadas ${cuenta('pagadas')}</button>
        </div>
        <div id="lista"></div>
      </div>
      <div class="detalle-propuesta" id="detalle">
        <div class="vacio">Escoge una propuesta para ver el detalle.</div>
      </div>
    </div>`;

  $('principal').querySelectorAll('[data-f]').forEach(b => {
    b.addEventListener('click', () => { filtro = b.dataset.f; seleccionada = null; ir('propuestas'); });
  });

  pintarLista();
}

function pintarLista() {
  const lista = DATOS.tratos.filter(t => GRUPOS[filtro].includes(t.estado));
  if (!lista.length) {
    $('lista').innerHTML = `<div class="vacio">
      ${filtro === 'nuevas'
        ? 'No tienes propuestas nuevas.<br>Cuando una marca te escriba, aparece aquí.'
        : 'Nada por aquí todavía.'}
    </div>`;
    return;
  }

  $('lista').innerHTML = lista.map(t => {
    const esNueva = t.estado === 'solicitado';
    const pagada = ['pagado', 'cerrado'].includes(t.estado);
    const linea = [t.entregables, t.fecha_entrega_esperada ? 'Entrega ' + fechaCorta(t.fecha_entrega_esperada) : null]
      .filter(Boolean).join(' · ');

    return `
      <button class="fila-propuesta ${esNueva ? 'nueva' : ''} ${seleccionada === t.id ? 'seleccionada' : ''}" data-t="${t.id}">
        <div class="fp-cab">
          <div>
            <div class="fp-marca">${esc(t.mk_marcas?.nombre_empresa || 'Marca')}</div>
            <div class="fp-linea">${esc(linea || '—')}</div>
          </div>
          ${pill(t.estado)}
        </div>
        <div class="${esNueva ? 'destacado' : ''}">
          <div class="fp-neto">
            <span class="fp-neto__label">${pagada ? 'Recibiste' : 'Tu neto'}</span>
            <span class="fp-neto__valor" ${pagada ? 'style="color:var(--off-white)"' : ''}>${COP(t.neto_a_recibir_creadora)}</span>
          </div>
          ${esNueva ? `<div class="fp-nota">De ${COP(t.monto_creadora)} acordados · ${t.comision_creadora_pct}% comisión</div>` : ''}
        </div>
      </button>`;
  }).join('');

  $('lista').querySelectorAll('[data-t]').forEach(b => {
    b.addEventListener('click', () => verPropuesta(b.dataset.t));
  });

  // En escritorio se abre la primera de una: el panel no debería quedar vacío.
  if (!seleccionada && window.innerWidth > 900 && lista.length) {
    verPropuesta(lista[0].id);
    document.querySelector('.maestro-detalle')?.classList.remove('viendo-detalle');
  }
}

async function verPropuesta(id) {
  seleccionada = id;
  pintarLista();
  const cont = $('detalle');
  document.querySelector('.maestro-detalle')?.classList.add('viendo-detalle');
  cont.innerHTML = '<div class="vacio">Cargando…</div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const t = await api('/tratos/' + id);
  const esNueva = t.estado === 'solicitado';

  const historial = t.campanas_previas > 0
    ? `${t.campanas_previas} campaña${t.campanas_previas > 1 ? 's' : ''} previa${t.campanas_previas > 1 ? 's' : ''}`
    : 'Primera campaña';

  cont.innerHTML = `
    <div class="det-ref">
      <span style="display:flex;align-items:center">
        <button class="volver" id="btn-volver" aria-label="Volver a la lista">←</button>
        <span class="det-ref__texto">Propuesta ${esc(t.codigo || '')}</span>
      </span>
      ${pill(t.estado)}
    </div>

    <h2 class="det-marca">${esc(t.marca?.nombre_empresa || 'Marca')}</h2>

    <div class="det-chips">
      ${t.marca?.ciudad ? `<span class="det-chip det-chip--blue">${esc(t.marca.ciudad)}</span>` : ''}
      <span class="det-chip">${esc(historial)}</span>
      ${t.exclusividad ? '<span class="det-chip">Con exclusividad</span>' : ''}
    </div>

    <div class="det-rotulo">El brief</div>
    <div class="det-brief">${esc(t.brief)}</div>

    <div class="condiciones" style="margin-top:20px">
      <div><div class="cond-label">Entregables</div><div class="cond-valor">${esc(t.entregables || '—')}</div></div>
      <div><div class="cond-label">Fecha de entrega</div>
        <div class="cond-valor cond-valor--lime">${t.fecha_entrega_esperada ? fechaCorta(t.fecha_entrega_esperada) : 'Sin fecha'}</div></div>
      <div><div class="cond-label">Producto</div><div class="cond-valor">${esc(t.producto || 'No especificado')}</div></div>
      <div><div class="cond-label">Exclusividad</div><div class="cond-valor">${esc(t.exclusividad || 'Sin exclusividad')}</div></div>
    </div>

    <div class="desglose">
      <div class="desglose__fila">
        <span class="desglose__label">Monto acordado</span>
        <span class="desglose__valor">${COP(t.monto_creadora)}</span>
      </div>
      <div class="desglose__fila">
        <span class="desglose__label">Comisión Creadores.app ${t.comision_creadora_pct}%</span>
        <span class="desglose__valor desglose__valor--resta">−${COP(t.comision_creadora_valor)}</span>
      </div>
      <div class="desglose__neto">
        <div class="desglose__neto-label">Tu neto</div>
        <div class="desglose__neto-valor">${COP(t.neto_a_recibir_creadora)}</div>
        <div class="desglose__neto-nota">A tu cuenta ${t.horas_pago_tras_aprobar || 48}h después de aprobado</div>
      </div>
    </div>

    ${['pago_retenido','entregado','aprobado','pagado','cerrado'].includes(t.estado) ? `
      <div class="nota-escrow">
        El dinero ya está retenido. Si publicas lo acordado, te lo pagan. No depende de la marca.
      </div>` : `
      <div class="nota-escrow">
        Cuando aceptes, la marca paga y el dinero queda retenido antes de que publiques.
      </div>`}

    ${esNueva ? `
      <div class="acciones">
        <button class="btn-portal" id="btn-aceptar">ACEPTAR PROPUESTA →</button>
        <button class="btn-portal btn-portal--ghost" id="btn-rechazar">RECHAZAR</button>
      </div>
      ${t.responder_antes_de ? `<div class="nota-pie" style="margin-top:10px">
        Tienes ${t.horas_responder || 72} horas para responder
      </div>` : ''}
    ` : ''}
  `;

  $('btn-volver')?.addEventListener('click', () => {
    seleccionada = null;
    document.querySelector('.maestro-detalle')?.classList.remove('viendo-detalle');
    pintarLista();
  });

  $('btn-aceptar')?.addEventListener('click', async () => {
    const b = $('btn-aceptar');
    b.disabled = true; b.textContent = 'ACEPTANDO…';
    try {
      await api('/tratos/' + id + '/aceptar', { method: 'POST', body: '{}' });
      // Aceptar lleva a Entregar, como define el diseño: es el siguiente paso real.
      await ir('entregar');
    } catch (e) {
      alert('No se pudo aceptar: ' + e.message);
      b.disabled = false; b.textContent = 'ACEPTAR PROPUESTA →';
    }
  });

  $('btn-rechazar')?.addEventListener('click', async () => {
    const motivo = prompt('¿Por qué la rechazas? (opcional, le llega a la marca)');
    if (motivo === null) return;
    try {
      await api('/tratos/' + id + '/rechazar', { method: 'POST', body: JSON.stringify({ motivo }) });
      seleccionada = null;
      await ir('propuestas');
    } catch (e) { alert('No se pudo: ' + e.message); }
  });
}

// ── Vista: Entregar ─────────────────────────────────────────────────────────

let links = [''];

async function vistaEntregar() {
  DATOS.tratos = await api('/tratos');
  // Solo se puede entregar lo que ya tiene el pago retenido.
  const pendientes = DATOS.tratos.filter(t => t.estado === 'pago_retenido');

  $('badge-entregar').textContent = pendientes.length || '';

  if (!pendientes.length) {
    $('principal').innerHTML =
      cabecera('Entregar contenido', 'Pega el link de lo publicado para liberar el pago.', 'entregar') + `
      <div class="vacio">
        No tienes nada pendiente por entregar.<br>
        Cuando aceptes una propuesta y la marca pague, aparece aquí.
      </div>`;
    return;
  }

  const t = pendientes[0];
  const contexto = [t.codigo, t.mk_marcas?.nombre_empresa, t.entregables].filter(Boolean).join(' · ');

  // La lista de revisión sale del brief, no es fija: cada marca pide lo suyo.
  const requisitos = (t.brief || '')
    .split(/[.\n;]+/)
    .map(s => s.trim())
    .filter(s => s.length > 12)
    .slice(0, 4);

  $('principal').innerHTML =
    cabecera('Entregar contenido', 'Pega el link de lo publicado para liberar el pago.', 'entregar') + `
    ${pendientes.length > 1 ? `
      <div class="campo" style="max-width:340px">
        <label>¿Cuál vas a entregar?</label>
        <select id="sel-trato" class="input-link">
          ${pendientes.map((p, i) => `<option value="${p.id}">${esc(p.codigo)} · ${esc(p.mk_marcas?.nombre_empresa || '')}</option>`).join('')}
        </select>
      </div>` : ''}

    <div class="entregar-wrap">
      <div class="entregar-main">
        <div class="det-ref__texto" style="margin-bottom:16px">Entrega ${esc(contexto)}</div>

        <div class="det-rotulo" style="margin-top:0">Pega el link de lo publicado</div>
        <div id="links"></div>
        <div class="acciones" style="margin-top:12px">
          <button class="btn-portal btn-portal--sec" id="btn-pegar">Pegar del portapapeles</button>
          <button class="btn-portal btn-portal--sec" id="btn-otro">+ Otro link</button>
        </div>

        <div class="det-rotulo">Antes de enviar, revisa</div>
        <div id="checklist">
          ${requisitos.length ? requisitos.map((r, i) => `
            <div class="check-item pendiente" data-check="${i}">
              <span class="check-caja"></span>
              <span>${esc(r)}</span>
            </div>`).join('') : `
            <div class="check-item pendiente" data-check="0">
              <span class="check-caja"></span>
              <span>El post está público, no en borrador ni archivado</span>
            </div>`}
        </div>

        <div class="acciones">
          <button class="btn-portal" id="btn-enviar" disabled>ENVIAR PARA APROBACIÓN →</button>
        </div>
        <div class="nota-pie" style="margin-top:10px">
          La marca tiene ${t.horas_aprobar || 48}h para aprobar.
        </div>
        <div class="error oculto" id="entregar-msg"></div>
      </div>

      <div class="entregar-lado">
        <div class="caja-dato">
          <div class="caja-dato__label">Se libera al aprobar</div>
          <div class="caja-dato__valor">${COP(t.neto_a_recibir_creadora)}</div>
        </div>
        <div class="caja-dato">
          <div class="caja-dato__label">Fecha acordada</div>
          <div class="caja-dato__valor" style="font-size:16px">${t.fecha_entrega_esperada ? fechaCorta(t.fecha_entrega_esperada) : 'Sin fecha'}</div>
        </div>
        <div class="det-rotulo">Tu progreso</div>
        <ul class="timeline">
          <li class="hecho"><span class="caja"></span>Propuesta aceptada</li>
          <li class="hecho"><span class="caja"></span>Pago en escrow</li>
          <li><span class="caja"></span>Contenido entregado</li>
          <li><span class="caja"></span>Aprobado y pagado</li>
        </ul>
      </div>
    </div>`;

  links = [''];
  pintarLinks();

  $('sel-trato')?.addEventListener('change', () => vistaEntregar());

  $('btn-otro').addEventListener('click', () => { links.push(''); pintarLinks(); });

  $('btn-pegar').addEventListener('click', async () => {
    try {
      const texto = await navigator.clipboard.readText();
      links[links.length - 1] = texto.trim();
      pintarLinks();
    } catch (e) {
      alert('No pude leer el portapapeles. Pega el link a mano.');
    }
  });

  $('checklist').querySelectorAll('[data-check]').forEach(item => {
    item.addEventListener('click', () => {
      const caja = item.querySelector('.check-caja');
      const ok = caja.classList.toggle('ok');
      caja.textContent = ok ? '✓' : '';
      item.classList.toggle('pendiente', !ok);
      revisarEnvio();
    });
  });

  $('btn-enviar').addEventListener('click', async () => {
    const idTrato = $('sel-trato')?.value || t.id;
    const b = $('btn-enviar');
    const msg = $('entregar-msg');
    msg.classList.add('oculto');
    b.disabled = true; b.textContent = 'ENVIANDO…';
    try {
      await api('/tratos/' + idTrato + '/entregar', {
        method: 'POST',
        body: JSON.stringify({ url_contenido: links.filter(Boolean).join('\n') }),
      });
      await ir('propuestas');
    } catch (e) {
      msg.className = 'aviso';
      msg.textContent = e.message;
      msg.classList.remove('oculto');
      b.disabled = false; b.textContent = 'ENVIAR PARA APROBACIÓN →';
    }
  });
}

function pintarLinks() {
  $('links').innerHTML = links.map((l, i) => `
    <input class="input-link" data-link="${i}" style="margin-bottom:8px"
           placeholder="https://instagram.com/reel/..." value="${esc(l)}">`).join('');
  $('links').querySelectorAll('[data-link]').forEach(inp => {
    inp.addEventListener('input', () => {
      links[Number(inp.dataset.link)] = inp.value.trim();
      revisarEnvio();
    });
  });
  revisarEnvio();
}

// El botón se habilita solo con un link que parezca URL y todo el checklist
// marcado. Es fricción a propósito: una entrega mal hecha le cuesta a ella.
function revisarEnvio() {
  const btn = $('btn-enviar');
  if (!btn) return;
  const hayLink = links.some(l => /^https?:\/\/.+\..+/.test(l));
  const items = [...document.querySelectorAll('#checklist [data-check]')];
  const todoOk = items.length > 0 && items.every(i => i.querySelector('.check-caja').classList.contains('ok'));
  btn.disabled = !(hayLink && todoOk);
}

// ── Arranque ────────────────────────────────────────────────────────────────

async function arrancar() {
  $('login-wrap').classList.add('oculto');
  $('app').classList.remove('oculto');
  $('tabs-movil').classList.remove('oculto');
  try {
    DATOS.perfil = await api('/me');
    DATOS.tratos = await api('/tratos');
    const nuevas = DATOS.tratos.filter(t => t.estado === 'solicitado').length;
    const badge = $('badge-propuestas');
    badge.textContent = nuevas;
    badge.classList.toggle('oculto', nuevas === 0);
    $('badge-entregar').textContent = DATOS.tratos.filter(t => t.estado === 'pago_retenido').length || '';

    // Aviso en la pestaña de perfil si le falta algo que se llena ahí.
    const est = await api('/estado').catch(() => null);
    const pendientesPerfil = (est?.faltantes || []).filter(f => f !== 'tarifas').length;
    const bp = $('badge-perfil');
    bp.textContent = pendientesPerfil || '';
    bp.classList.toggle('oculto', !pendientesPerfil);
  } catch (e) { /* el detalle se muestra en cada vista */ }
  ir('perfil');
}

if (TOKEN) {
  api('/me').then(arrancar).catch(() => {
    sessionStorage.removeItem('mk_creadora');
    TOKEN = null;
  });
}
</script>
